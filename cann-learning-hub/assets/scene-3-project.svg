  <!-- Desk surface -->
  <polygon points="88,332 652,306 728,392 142,418" fill="url(#desk)"/>
  <polygon points="142,418 728,392 728,404 142,430" fill="#c99c72"/>

  <!-- Coffee mug on left -->
  <ellipse cx="145" cy="346" rx="18" ry="6" fill="#d3a87f" opacity="0.5"/>
