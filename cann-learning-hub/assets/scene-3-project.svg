    <circle cx="594" cy="152" r="6" fill="#39b982"/>
    <path d="M591 152 L593.5 154.5 L597.5 150" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="606" y="147" width="64" height="5" rx="2.5" fill="#4f46e5"/>
    <rect x="606" y="156" width="44" height="4" rx="2" fill="#94a3b8"/>

    <rect x="580" y="174" width="102" height="28" rx="7" fill="#ecfeff"/>
    <circle cx="594" cy="188" r="6" fill="#28a8d8"/>
    <rect x="606" y="183" width="60" height="5" rx="2.5" fill="#0284c7"/>
    <rect x="606" y="192" width="48" height="4" rx="2" fill="#94a3b8"/>

    <rect x="580" y="210" width="102" height="28" rx="7" fill="#f5f3ff"/>
    <circle cx="594" cy="224" r="6" fill="#5b5bd6"/>
    <rect x="606" y="219" width="66" height="5" rx="2.5" fill="#5b5bd6"/>
    <rect x="606" y="228" width="40" height="4" rx="2" fill="#94a3b8"/>

    <rect x="580" y="246" width="102" height="18" rx="6" fill="#22262f"/>
    <rect x="604" y="253" width="54" height="4.5" rx="2.2" fill="#ffffff" opacity="0.85"/>
