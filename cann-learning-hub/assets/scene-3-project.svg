<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#f1f4fa"/>
    </linearGradient>
    <linearGradient id="desk" x1="120" y1="305" x2="710" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0d4b3"/>
      <stop offset="100%" stop-color="#dfb88e"/>
    </linearGradient>
    <linearGradient id="sweater" x1="170" y1="205" x2="320" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4e5888"/>
      <stop offset="100%" stop-color="#353d66"/>
    </linearGradient>
    <linearGradient id="dropGlow" x1="420" y1="120" x2="640" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Chair back -->
  <path d="M136 220 C136 200 152 190 174 190 L215 190 C226 190 234 198 234 210 L240 375 L155 375 Z" fill="#8b9ab0"/>
