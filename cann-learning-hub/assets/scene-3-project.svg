    <rect x="325" y="168" width="32" height="5" rx="2.5" fill="#0284c7"/>
    <rect x="325" y="180" width="42" height="4" rx="2" fill="#7dd3fc"/>
    <rect x="325" y="190" width="36" height="4" rx="2" fill="#7dd3fc"/>
    <rect x="325" y="200" width="40" height="4" rx="2" fill="#7dd3fc"/>
