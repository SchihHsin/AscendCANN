  <circle cx="261" cy="148" r="10" stroke="#313954" stroke-width="2.2" fill="#ffffff" fill-opacity="0.22"/>
  <circle cx="285" cy="147" r="9.5" stroke="#313954" stroke-width="2.2" fill="#ffffff" fill-opacity="0.22"/>
  <path d="M271 148 L275 148" stroke="#313954" stroke-width="2.2"/>
  <circle cx="263" cy="148" r="2.3" fill="#23283c"/>
  <circle cx="286" cy="147" r="2.3" fill="#23283c"/>
  <path d="M254 135 C258 132 264 132 268 134" stroke="#2a2d43" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M279 134 C283 132 288 132 292 134" stroke="#2a2d43" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M266 168 C272 173 280 172 285 166" stroke="#b96d53" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="252" cy="160" rx="6" ry="3.5" fill="#f08e7c" opacity="0.35"/>

