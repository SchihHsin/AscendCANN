  <!-- Front folder + file card -->
  <g transform="rotate(-3 398 186)" filter="url(#softShadow)">
    <rect x="364" y="142" width="74" height="88" rx="9" fill="#ffffff" stroke="#5b5bd6" stroke-width="2"/>
    <rect x="376" y="156" width="28" height="12" rx="6" fill="#eef2ff"/>
    <rect x="382" y="160" width="16" height="4" rx="2" fill="#5b5bd6"/>
    <rect x="376" y="176" width="50" height="5" rx="2.5" fill="#334155"/>
    <rect x="376" y="188" width="44" height="4.5" rx="2.2" fill="#94a3b8"/>
    <rect x="376" y="199" width="48" height="4.5" rx="2.2" fill="#94a3b8"/>
    <rect x="376" y="210" width="32" height="4.5" rx="2.2" fill="#39b982"/>
