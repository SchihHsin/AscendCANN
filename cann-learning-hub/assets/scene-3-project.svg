  <!-- Mouse cursor dragging the card -->
  <path d="M432 214 L432 239 L439 233 L445 244 L450 241 L444 230 L452 229 Z" fill="#1e293b" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
