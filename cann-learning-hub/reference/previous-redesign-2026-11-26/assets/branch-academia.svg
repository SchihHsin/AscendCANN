<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f9fc"/><stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="shA" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgA)"/>
  <!-- Split Academia (Course Syllabus + Graduation Cap) & Competition (Judge + Trophy) -->
