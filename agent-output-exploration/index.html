   list.forEach((node,i)=>{const wobble=[0,8,-5,12,3,-8,6,1][(i+cluster.id.length)%8];positions[node.id]={x:x+(zoneW-cardW)/2+wobble,y:top+42+i*step+(i%3===1?4:0),w:cardW,h:cardH,cluster:cluster.id,side:cluster.side,turn:node.turn}});
   const height=42+list.length*step+8,palette=clusterPalette[cluster.tone]||clusterPalette.blue;
   regions.push({id:cluster.id,title:cluster.title,tone:cluster.tone,side:cluster.side,tier:cluster.tier,x,y:top,w:zoneW,h:height,count:list.length,palette});cursor+=height+28;
  });
 }else{
  const colW=(w-outer*2-gap)/2;
  [...new Set(ordered.map(c=>c.tier))].forEach(tier=>{
   const tierClusters=ordered.filter(c=>c.tier===tier);let tierBottom=cursor;
   tierClusters.forEach(cluster=>{
    const list=nodes.filter(n=>n.cluster===cluster.id).sort((a,b)=>Number(b.rootAnchor)-Number(a.rootAnchor)||b.degree-a.degree||a.title.localeCompare(b.title,'zh'));
    if(!list.length)return;
    const x=cluster.side==='left'?outer:outer+colW+gap,top=cursor+(cluster.side==='right'?22:0),cardW=Math.min(232,colW-38),cardH=106,step=cardH+13;
    list.forEach((node,i)=>{const wobble=[0,9,-5,14,3,-8,7,1][(i+cluster.id.length)%8],maxX=x+colW-14-cardW;positions[node.id]={x:Math.max(x+14,Math.min(maxX,x+(colW-cardW)/2+wobble)),y:top+42+i*step+(i%3===1?4:0),w:cardW,h:cardH,cluster:cluster.id,side:cluster.side,turn:node.turn}});
    const height=42+list.length*step+8,palette=clusterPalette[cluster.tone]||clusterPalette.blue;
    regions.push({id:cluster.id,title:cluster.title,tone:cluster.tone,side:cluster.side,tier:cluster.tier,x,y:top,w:colW,h:height,count:list.length,palette});tierBottom=Math.max(tierBottom,top+height);
   });
   cursor=tierBottom+52;
  });
 }
 return{positions,regions,height:Math.max(340,cursor+18),width:w,compact};
}
function edgePath(a,b,positions,regions,width){
 const p=positions[a],q=positions[b];if(!p||!q)return '';
 if(a==='root'){
  const sx=p.x+p.w/2,sy=p.y+p.h,tx=q.x+q.w/2,ty=q.y;
  return `M${sx},${sy} C${sx},${sy+28} ${tx},${ty-28} ${tx},${ty}`;
 }
 const ra=regions.find(r=>r.id===p.cluster),rb=regions.find(r=>r.id===q.cluster);
 if(!ra||!rb)return '';
 let sx,tx,rail;
 if(p.cluster===q.cluster){
  const right=ra.side==='left';sx=right?p.x+p.w:p.x;tx=right?q.x+q.w:q.x;rail=right?ra.x+ra.w-7:ra.x+7;
 }else if(ra.side!==rb.side){
  rail=width/2;sx=ra.side==='left'?p.x+p.w:p.x;tx=rb.side==='left'?q.x+q.w:q.x;
 }else{
  const left=ra.side==='left';rail=left?7:width-7;sx=left?p.x:p.x+p.w;tx=left?q.x:q.x+q.w;
 }
 const sy=p.y+p.h/2,ty=q.y+q.h/2,dir=ty>=sy?1:-1,bend=Math.min(20,Math.max(8,Math.abs(ty-sy)*.18));
 return `M${sx},${sy} C${rail},${sy} ${rail},${sy+dir*bend} ${rail},${sy+dir*bend} L${rail},${ty-dir*bend} C${rail},${ty} ${rail},${ty} ${tx},${ty}`;
}
function renderGraph(){
 const s=scenario(),{nodes,links,clusters}=data(),container=$('graph'),width=Math.max(container.clientWidth,320),{positions,regions,height}=layout(nodes,clusters,width);
 container.style.height=height+'px';$('lines').setAttribute('viewBox',`0 0 ${width} ${height}`);$('lines').setAttribute('height',height);
 container.querySelectorAll('.graph-cluster').forEach(e=>e.remove());
 regions.forEach(region=>{const box=document.createElement('div');box.className='graph-cluster';box.style.cssText=`left:${region.x}px;top:${region.y}px;width:${region.w}px;height:${region.h}px;--cluster-tone:${region.palette.fg};--cluster-bg:${region.palette.bg}55;--cluster-border:${region.palette.border}`;container.appendChild(box);const label=document.createElement('div');label.className='graph-cluster-label';label.style.cssText=`left:${region.x+14}px;top:${region.y+11}px;--cluster-tone:${region.palette.fg}`;label.innerHTML=`<span class="cluster-dot"></span><strong>${esc(region.title)}</strong><span class="cluster-count">${region.count} 个知识点</span>`;container.appendChild(label)});
 const connected=new Set();links.forEach(([a,b])=>{if(a===selected)connected.add(b);if(b===selected)connected.add(a)});
 const defs=`<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#9ca5b4"/></marker></defs>`;
 $('lines').innerHTML=defs+links.map(([a,b,kind])=>{const d=edgePath(a,b,positions,regions,width);if(!d)return '';const hot=a===selected||b===selected;return `<path class="line ${kind==='loop'?'line-return':''} ${hot?'selected-line':''}" d="${d}" marker-end="url(#arrow)"/>`}).join('');
 $('nodes').innerHTML=nodes.map(node=>{const p=positions[node.id],cluster=clusters.find(c=>c.id===node.cluster),tone=clusterPalette[cluster?.tone]||clusterPalette.indigo;return `<button class="node ${node.id==='root'?'root':''} ${node.id===selected?'selected':''} ${connected.has(node.id)?'direct-related':''} ${lastNew.has(node.id)?'node-new':''}" data-kind="${esc(node.type)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;--tone:${tone.fg};--tone-soft:${tone.bg}" data-node="${esc(node.id)}" aria-pressed="${node.id===selected}"><div class="node-type"><span class="dot"></span>${esc(node.type)}</div><strong>${esc(node.title)}</strong><div class="node-summary">${esc(node.summary)}</div></button>`}).join('');
 $('nodes').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selected=b.dataset.node;lastNew.clear();renderGraph()});
 $('counter').textContent=`${nodes.length-1} 个知识点 · ${regions.length} 个语义簇 · ${counts[current]} 轮对话`;$('canvasTitle').textContent=s.root;
 let item=nodes.find(x=>x.id===selected)||nodes[0],cluster=clusters.find(c=>c.id===item.cluster),tone=clusterPalette[cluster?.tone]||clusterPalette.indigo;
 const turnLinks=s.turns.slice(0,counts[current]).map((t,i)=>`<button class="turn-step ${i<counts[current]?'done':''} ${i===counts[current]-1?'current':''}" title="第 ${i+1} 轮" aria-label="跳到第 ${i+1} 轮" data-turn="${i+1}"></button>`).join('');
 $('detail').innerHTML=`<div class="turn-ribbon"><span class="tiny">追问进度</span>${turnLinks}<button class="replay" id="replay">${replayTimer?'暂停回放':counts[current]>=s.turns.length?'从头回放':'继续生长'}</button></div>${cluster?`<div class="cluster-origin"><span class="dot" style="background:${tone.fg}"></span>归入 ${esc(cluster.title)}</div>`:''}<div class="detail-head"><span class="dot" style="background:${tone.fg}"></span>${esc(item.title)}</div><div class="detail-text">${esc(item.summary)}</div>${item.turn>=0?`<button class="source-btn" id="source">↗ 回看第 ${item.turn+1} 轮回答</button>`:`<div class="tiny">${nodes.length-1} 个知识点围绕主题形成关联</div>`}`;
 const source=$('source');if(source)source.onclick=()=>{const e=$('answer-'+item.turn);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('source-highlight');void e.offsetWidth;e.classList.add('source-highlight')}};
 $('detail').querySelectorAll('[data-turn]').forEach(b=>b.onclick=()=>{const msg=$('answer-'+(Number(b.dataset.turn)-1));if(msg){msg.scrollIntoView({behavior:'smooth',block:'center'});msg.classList.remove('source-highlight');void msg.offsetWidth;msg.classList.add('source-highlight')}});
 $('replay').onclick=()=>{if(replayTimer){stopReplay();renderGraph();return}if(counts[current]>=scenario().turns.length){counts[current]=1;selected='root';lastNew.clear();render()}if(counts[current]<scenario().turns.length){replayTimer=setInterval(()=>{if(counts[current]>=scenario().turns.length){stopReplay();renderGraph();return}advance()},900);renderGraph()}};
}
function render(){renderTopics();renderMessages();document.querySelectorAll('[data-answer-turn]').forEach(b=>b.onclick=()=>{const turn=Number(b.dataset.answerTurn),first=scenario().turns[turn].nodes[0]?.[0];selected=first||'root';renderGraph();$('canvas').scrollTo({top:0,behavior:'smooth'})});renderGraph();requestAnimationFrame(scrollMessagesToEnd)}
function advance(){const s=scenario(),n=counts[current];if(n>=s.turns.length)return;counts[current]++;lastNew=new Set(s.turns[n].nodes.map(x=>x[0]));selected=s.turns[n].nodes[0]?.[0]||'root';render();requestAnimationFrame(()=>{const node=$('nodes').querySelector(`[data-node="${selected}"]`);node?.scrollIntoView({behavior:'smooth',block:'nearest'})})}
function send(){const value=$('input').value.trim();if(!value)return;const s=scenario(),next=s.turns[counts[current]];if(!next){$('hint').textContent='这组示例已完成，请切换主题或重新开始回放。';return}if(value===next.q||[...value].filter(c=>next.q.includes(c)).length>=Math.min(4,Math.ceil(value.length*.5))){$('input').value='';advance()}else{$('hint').textContent='选择一条预设追问，继续观察新内容如何并入已有知识簇。'}}
$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('reset').onclick=()=>{stopReplay();counts[current]=1;selected='root';lastNew.clear();render()};$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();document.querySelectorAll('[data-topic]').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))});window.addEventListener('resize',renderGraph);render();
</script></body></html>
