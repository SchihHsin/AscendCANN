const scenarios=[
{id:'harness',title:'认识 Harness 工程',root:'Harness 工程',description:'从概念到一次 Agent 运行，理解模型与运行环境如何协作。',turns:[
{q:'Harness 工程是什么意思？',a:'可以把 Harness 理解为模型周围的<strong>运行与协作机制</strong>：它为模型准备上下文，提供工具，把执行结果带回后续交互，让模型能够参与完成任务。',nodes:[['context','上下文','组织指令、任务信息与已有结果','概念'],['model','模型','基于输入生成文本或工具调用','参与者']],links:[['root','context'],['root','model']]},
{q:'它和模型本身有什么区别？',a:'模型根据输入生成响应；Harness 负责<strong>组织输入、处理响应和协调执行</strong>。模型可以通过外部 API 提供，不一定是 Harness 内置模块。',nodes:[['boundary','职责边界','模型生成；Harness 组织和协调','关系']],links:[['boundary','model']]},
{q:'它是怎么调用工具的？',a:'模型可能返回工具调用请求；Host 解析请求并校验权限，按名称执行工具，再把<strong>工具结果</strong>加入下一轮上下文。并非每次回答都需要调用工具。',nodes:[['tool','工具调用','解析、授权、路由并执行','机制'],['feedback','结果回填','将工具结果带回后续上下文','机制']],links:[['boundary','tool'],['tool','feedback'],['feedback','context']]},
{q:'那规则和上下文又是怎么起作用的？',a:'任务目标、项目指令、对话历史和可用工具信息可以被组织进上下文。规则为执行提供约束，但是否满足业务目标仍需要另外判断。',nodes:[['rules','项目规则','为任务与工具使用提供约束','约束'],['history','对话历史','保留当前任务中的相关信息','来源']],links:[['context','rules'],['context','history']]},
{q:'最终回答就代表任务完成了吗？',a:'不一定。模型返回的最终文本可以作为<strong>候选结果</strong>；任务是否完成，还要看目标、实际执行结果和验收条件。',nodes:[['result','候选结果','最终文本不自动等于任务完成','结果'],['verify','任务验收','依据目标与证据判断是否完成','判断']],links:[['model','result'],['result','verify']]}
]},
{id:'operator',title:'理解算子开发',root:'自定义算子开发',description:'从算子定义到实现与验证，逐步建立开发全貌。',turns:[
{q:'算子开发是什么？',a:'算子是完成特定计算的基本单元。自定义算子开发通常从<strong>明确输入、输出与计算规则</strong>开始，再实现并验证其行为。',nodes:[['contract','输入输出','明确数据类型、形状和约束','概念'],['compute','计算规则','描述输入如何得到输出','概念']],links:[['root','contract'],['root','compute']]},
{q:'比如做一个 Add 算子，要先明确什么？',a:'以逐元素 Add 为例，需要明确两个输入如何对应、输出形状与数据类型，以及是否支持广播等边界条件。具体约束要以目标算子的定义为准。',nodes:[['add','Add 示例','两个输入逐元素相加','示例'],['shape','形状与类型','先确认输入输出约定','约束']],links:[['compute','add'],['contract','shape'],['add','shape']]},
{q:'实现时一般需要考虑哪些部分？',a:'一般需要把计算表达为设备可执行的实现，并处理<strong>数据搬运、计算划分和边界</strong>。具体开发接口和流程取决于硬件、工具链和版本。',nodes:[['implementation','设备实现','根据目标平台实现计算','操作'],['memory','数据搬运','协调数据读取与写回','机制'],['tail','边界处理','考虑不能整除时的数据范围','约束']],links:[['compute','implementation'],['implementation','memory'],['implementation','tail']]},
{q:'写完后怎么知道算得对不对？',a:'可以准备覆盖常见形状和边界的输入，与可信的参考结果比较，并根据数据类型选择适当的误差判断。通过示例不代表覆盖了所有情况。',nodes:[['correctness','正确性验证','参考结果、测试输入和误差判断','验证'],['cases','测试用例','覆盖常见形状与边界','操作']],links:[['implementation','correctness'],['correctness','cases'],['tail','cases']]},
{q:'如果结果正确，接下来怎么优化？',a:'先测量，再结合访存、计算和并行度定位瓶颈；每次调整后重新验证正确性与性能。性能结论取决于具体设备、输入和测量环境。',nodes:[['profile','性能分析','测量并定位潜在瓶颈','操作'],['experiment','对照实验','调整后比较结果并复验','验证']],links:[['correctness','profile'],['profile','experiment']]}
]},
{id:'training',title:'理解训练与调优',root:'训练与调优',description:'从一次训练到多卡收益，用问题逐步连接效率、瓶颈与实验。',turns:[
{q:'训练调优是做什么的？',a:'训练调优是在明确目标和约束后，通过测量与调整改善训练过程。例如，在精度可接受的前提下，提升吞吐或减少训练时间。',nodes:[['goal','优化目标','结合精度、时间和资源约束','目标'],['measure','基线测量','先记录当前吞吐、耗时等指标','操作']],links:[['root','goal'],['root','measure']]},
{q:'为什么加了更多卡，训练不一定更快？',a:'多卡增加了并行计算能力，但也会带来通信、同步和资源利用上的开销。收益取决于模型、数据、并行方式及环境。',nodes:[['multicard','多卡收益','计算加速与额外开销共同决定','概念'],['communication','通信与同步','设备间交换和等待会消耗时间','机制']],links:[['root','multicard'],['multicard','communication']]},
{q:'怎么判断瓶颈在哪里？',a:'先观察数据准备、计算、通信及等待等阶段的时间分布，再结合设备利用情况定位值得检查的环节。单个指标不能独立证明根因。',nodes:[['bottleneck','瓶颈定位','比较数据、计算、通信与等待','操作'],['profiling','性能采样','结合时间分布和设备指标','工具']],links:[['measure','bottleneck'],['bottleneck','profiling'],['communication','bottleneck']]},
{q:'并行策略会影响哪些地方？',a:'不同并行策略会改变计算与数据如何分布，也会改变显存占用和通信方式。选择需结合模型规模、硬件和任务目标。',nodes:[['parallel','并行策略','决定计算和数据的分布方式','策略'],['memory','显存占用','策略会影响每个设备的内存需求','约束']],links:[['multicard','parallel'],['parallel','communication'],['parallel','memory']]},
{q:'怎样判断调整真的有效？',a:'固定模型、数据、硬件和测量条件，记录调整前后的吞吐、时间与质量指标；重复观察，并确认正确性和收敛表现没有受到不可接受的影响。',nodes:[['experiment','对照实验','控制条件，比较调整前后','验证'],['quality','训练质量','同时关注正确性与收敛','约束']],links:[['bottleneck','experiment'],['experiment','measure'],['experiment','quality']]}
]},
{id:'inference',title:'理解推理与调优',root:'模型推理',description:'围绕推理目标，串联输入、性能指标与优化验证。',turns:[

let current='harness', counts=Object.fromEntries(scenarios.map(s=>[s.id,s.turns.length])),selected='tool',lastNew=new Set(), replayTimer=null;
const $=id=>document.getElementById(id);function scenario(){return scenarios.find(s=>s.id===current)}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderTopics(){ $('topics').innerHTML=scenarios.map((s,i)=>`<button class="topic ${s.id===current?'active':''}" data-topic="${s.id}" ${s.id===current?'aria-current="page"':''}><span class="topic-icon">${['◇','⌘','↗','◈'][i]}</span>${s.title}</button>`).join('');$('topics').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{current=b.dataset.topic;selected='root';lastNew.clear();render();$('messages').scrollTop=$('messages').scrollHeight;});}
function renderMessages(){let s=scenario(),n=counts[current];$('conversationTitle').textContent='对话';$('breadcrumb').textContent=s.title;$('messages').innerHTML=s.turns.slice(0,n).map((t,i)=>`<div class="msg user" id="question-${i}"><div class="bubble">${esc(t.q)}</div></div><div class="msg answer has-nodes" id="answer-${i}"><div class="answer-label"><span>Ascend Studio</span><button class="turn-link" data-answer-turn="${i}">↗ 本轮整理 ${t.nodes.length} 个知识点</button></div><p>${t.a}</p><div class="msg-actions">第 ${i+1} 轮 · 知识已汇入右侧关系图</div></div>`).join('');let next=s.turns[n];$('suggestions').innerHTML=next?`<button class="suggest" id="next">↗ ${esc(next.q)}</button>`:`<span class="tiny">已完成这组示例对话，可切换其他主题继续探索。</span>`;if(next)$('next').onclick=advance;$('hint').textContent=next?'选择上方建议问题，或输入相关问题继续演示。':'这组演示已结束，切换主题或重新开始。';}
function data(){let s=scenario(),n=counts[current],nodes=[{id:'root',title:s.root,summary:'随着对话逐步整理的核心主题',type:'主题',turn:0}],links=[];s.turns.slice(0,n).forEach((t,i)=>{t.nodes.forEach(([id,title,summary,type])=>nodes.push({id,title,summary,type,turn:i}));t.links.forEach(([a,b])=>links.push([a,b]));});return{nodes,links}}
function layout(nodes,width){let w=Math.max(width,320),outer=14,gap=12,cardMax=230,positions={},root=nodes.find(n=>n.id==='root'),turns=[...new Set(nodes.filter(n=>n.id!=='root').map(n=>n.turn))].sort((a,b)=>a-b);let rootW=Math.min(300,w-outer*2);positions.root={x:(w-rootW)/2,y:8,w:rootW,h:82,turn:-1};let rowTop=124,rowStep=140,rowH=112;turns.forEach(turn=>{let row=nodes.filter(n=>n.id!=='root'&&n.turn===turn),card=Math.min(cardMax,(w-outer*2-gap*(row.length-1))/row.length),total=row.length*card+(row.length-1)*gap,start=(w-total)/2;row.forEach((node,index)=>{positions[node.id]={x:start+index*(card+gap),y:rowTop+turn*rowStep+19,w:card,h:rowH,turn}})});let maxTurn=turns.length?Math.max(...turns):0;return{positions,height:Math.max(320,rowTop+maxTurn*rowStep+rowH+24),turns,rowTop,rowStep,rowH,outer}}
function renderGraph(){let s=scenario(),{nodes,links}=data(),container=$('graph'),width=Math.max(container.clientWidth,320),{positions,height,turns,rowTop,rowStep,rowH,outer}=layout(nodes,width);container.style.height=height+'px';$('lines').setAttribute('viewBox',`0 0 ${width} ${height}`);container.querySelectorAll('.graph-group,.graph-group-label').forEach(e=>e.remove());turns.forEach(turn=>{let y=rowTop+turn*rowStep-4,row=nodes.filter(n=>n.id!=='root'&&n.turn===turn);let bg=document.createElement('div');bg.className='graph-group';bg.style.cssText=`left:${outer}px;top:${y}px;width:${width-outer*2}px;height:${rowH+19}px`;container.appendChild(bg);let tag=document.createElement('div');tag.className='graph-group-label';tag.style.cssText=`left:${outer+12}px;top:${y+5}px`;tag.textContent=`第 ${turn+1} 轮 · ${row.length} 个知识点`;container.appendChild(tag)});let defs=`<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#aeb5c1"/></marker></defs>`;$('lines').innerHTML=defs+links.map(([a,b])=>{let x=positions[a],y=positions[b];if(!x||!y)return '';let d='',backward=y.turn<x.turn;if(x.turn===y.turn){let right=x.x<x.x+x.w/2?x.x+x.w:x.x;let left=y.x>=x.x?y.x:y.x+y.w;let sy=x.y+x.h/2,ty=y.y+y.h/2,mid=(right+left)/2;d=`M${right},${sy} C${mid},${sy} ${mid},${ty} ${left},${ty}`}else if(backward){let sx=x.x,sy=x.y+x.h/2,tx=y.x,ty=y.y+y.h/2,rail=5+((x.y+y.y)%3)*5;d=`M${sx},${sy} C${rail+30},${sy} ${rail},${sy} ${rail},${sy+24} L${rail},${ty-24} C${rail},${ty} ${rail+25},${ty} ${tx},${ty}`}else if(y.turn-x.turn===1){let sx=x.x+x.w/2,sy=x.y+x.h,tx=y.x+y.w/2,ty=y.y,mid=(sy+ty)/2;d=`M${sx},${sy} C${sx},${mid} ${tx},${mid} ${tx},${ty}`}else{let sx=x.x+x.w/2,sy=x.y+x.h,tx=y.x+y.w/2,ty=y.y,rail=width-5;d=`M${sx},${sy} C${sx},${sy+18} ${rail},${sy+18} ${rail},${sy+35} L${rail},${ty-25} C${rail},${ty-8} ${tx},${ty-18} ${tx},${ty}`}return `<path class="line ${backward?'line-return':''}" d="${d}" marker-end="url(#arrow)"/>`}).join('');$('nodes').innerHTML=nodes.map(node=>{let p=positions[node.id];return `<button class="node ${node.id==='root'?'root':''} ${node.id===selected?'selected':''} ${lastNew.has(node.id)?'node-new':''}" data-kind="${esc(node.type)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px" data-node="${node.id}" aria-pressed="${node.id===selected}"><div class="node-type"><span class="dot"></span>${esc(node.type)}</div><strong>${esc(node.title)}</strong><div class="node-summary">${esc(node.summary)}</div></button>`}).join('');$('nodes').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{selected=b.dataset.node;lastNew.clear();renderGraph()});$('counter').textContent=`${nodes.length-1} 个知识点 · ${counts[current]} 轮对话`;$('canvasTitle').textContent=s.root;let item=nodes.find(x=>x.id===selected)||nodes[0];let turnLinks=s.turns.slice(0,counts[current]).map((t,i)=>`<button class="turn-step ${i<counts[current]?'done':''} ${i===counts[current]-1?'current':''}" title="第 ${i+1} 轮" aria-label="跳到第 ${i+1} 轮" data-turn="${i+1}"></button>`).join('');$('detail').innerHTML=`<div class="turn-ribbon"><span class="tiny">对话脉络</span>${turnLinks}<button class="replay" id="replay">${counts[current]>=s.turns.length?'从头回放':'继续生长'}</button></div><div class="detail-head"><span class="dot"></span>${esc(item.title)}</div><div class="detail-text">${esc(item.summary)}</div><button class="source-btn" id="source">↗ 查看第 ${item.turn+1} 轮来源</button>`;$('source').onclick=()=>{let e=$('answer-'+item.turn);e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('source-highlight');void e.offsetWidth;e.classList.add('source-highlight')};$('detail').querySelectorAll('[data-turn]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.turn)-1;let msg=$('answer-'+i);msg.scrollIntoView({behavior:'smooth',block:'center'});msg.classList.add('source-highlight')});$('replay').onclick=()=>{if(replayTimer){clearInterval(replayTimer);replayTimer=null}counts[current]=1;selected='root';lastNew.clear();render();replayTimer=setInterval(()=>{if(counts[current]>=scenario().turns.length){clearInterval(replayTimer);replayTimer=null;return}advance()},850)}}
function render(){renderTopics();renderMessages();document.querySelectorAll('[data-answer-turn]').forEach(b=>b.onclick=()=>{selected=scenario().turns[Number(b.dataset.answerTurn)].nodes[0][0];renderGraph();$('canvas').scrollTo({top:0,behavior:'smooth'})});renderGraph();requestAnimationFrame(()=>$('messages').scrollTop=$('messages').scrollHeight)}function advance(){let s=scenario(),n=counts[current];if(n>=s.turns.length)return;counts[current]++;lastNew=new Set(s.turns[n].nodes.map(x=>x[0]));selected=s.turns[n].nodes[0][0];render();requestAnimationFrame(()=>{$('messages').scrollTop=$('messages').scrollHeight;let node=$('nodes').querySelector(`[data-node="${selected}"]`);node?.scrollIntoView({behavior:'smooth',block:'nearest'});})}function send(){let value=$('input').value.trim();if(!value)return;let s=scenario(),next=s.turns[counts[current]];if(!next){$('hint').textContent='这组示例已完成，请切换主题或重新开始。';return}if(value===next.q || [...value].filter(c=>next.q.includes(c)).length>=Math.min(4,Math.ceil(value.length*.5))){$('input').value='';advance()}else{$('hint').textContent='当前为预设演示，请选择上方建议问题继续。';}}
$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('reset').onclick=()=>{counts[current]=1;selected='root';lastNew.clear();render()};$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();document.querySelectorAll('[data-topic]').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))});window.addEventListener('resize',renderGraph);render();
</script></body></html>
