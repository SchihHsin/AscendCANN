<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昇腾学习</title>
  <link rel="stylesheet" href="cann-style.css">
  <link rel="stylesheet" href="cann-website-v2.css">
  <link rel="preload" as="image" href="visual-assets/learning-hi-fi/learning-hero-bg.avif" type="image/avif">
  <link rel="preload" as="image" href="visual-assets/learning-hi-fi/配图@4x.png" type="image/png">
  <script src="https://unpkg.com/lucide"></script>
</head>
<body class="learn-standalone">
  <main id="page-learn" class="page active">
    <div class="ld-home-rail" aria-label="学习快捷入口">
      <button class="ld-home-rail-btn ld-home-assistant-btn" type="button" onclick="toggleAiChat()" title="智能助手"><img src="visual-assets/learning-hi-fi/智能助手@4x.png" alt=""></button>
      <button class="ld-home-rail-btn ld-home-twin-btn" type="button" onclick="ldToggleTwinPanel()" title="学习分身"><img src="visual-assets/learning-hi-fi/学习分身@4x.png" alt=""></button>
      <button class="ld-home-rail-btn" type="button" onclick="openLearningArchive('paths')" title="学习档案"><i data-lucide="folder-kanban"></i></button>
      <button class="ld-home-rail-btn" type="button" onclick="openLearningArchive('quiz')" title="错题本"><i data-lucide="notebook-pen"></i></button>
    </div>
    <div class="ld-search-overlay" id="ld-search-overlay" aria-hidden="true" onclick="if(event.target===this)ldCloseSearch()"><section class="ld-search-dialog" role="dialog"><button class="ld-search-close" type="button" onclick="ldCloseSearch()"><i data-lucide="x"></i></button><div class="ld-search-top"><form class="ld-search-field" onsubmit="ldSearchSubmit(event)"><i data-lucide="sparkles"></i><input id="ld-search-input" autocomplete="off" placeholder="描述你的学习或开发任务"><button type="submit">生成路径</button></form></div><div class="ld-search-content" id="ld-search-content"></div></section></div>
    <div class="ld-dash" id="ld-dash">
      <div class="ld-hero"><div class="ld-hero-inner"><div class="ld-hero-kicker"><i data-lucide="sparkles"></i>面向昇腾开发者的个性化学习</div><h1 class="ld-hero-title">快速开始<em>昇腾学习成长之旅</em></h1><p class="ld-hero-desc">告诉我你想完成的开发任务，AI 会结合当前基础与可用资源，为你组织一条可实践的学习路径。</p><div class="ld-hero-art" aria-hidden="true"></div><form class="ld-input-bar" id="ld-task-search" onsubmit="ldOpenSearch(event)"><i data-lucide="sparkles"></i><input id="ld-ai-input" autocomplete="off" placeholder="描述你的学习任务，AI 为你生成专属路径…" onfocus="ldOpenSearch(event)"><button class="ld-gen-btn" id="ld-free-gen-btn" type="submit" disabled>生成路径</button></form></div></div>
      <section class="ld-section ld-scenario-section"><div class="ld-scenario-head"><span>从典型场景开始</span><small>选择一个场景，生成可执行的学习计划</small></div><div class="ld-scenario-grid" id="ld-scenario-grid"><button class="ld-scenario-card scenario-migrate" onclick="ldChooseScenario('模型迁移')"><span class="ld-scenario-icon"><img src="visual-assets/learning-hi-fi/模型迁移@4x.png" alt=""></span><strong>模型迁移</strong><small>将现有模型适配到昇腾</small></button><button class="ld-scenario-card scenario-train" onclick="ldChooseScenario('模型训练')"><span class="ld-scenario-icon"><img src="visual-assets/learning-hi-fi/模型训练@4x.png" alt=""></span><strong>模型训练</strong><small>启动、调试与优化训练任务</small></button><button class="ld-scenario-card scenario-infer" onclick="ldChooseScenario('模型推理')"><span class="ld-scenario-icon"><img src="visual-assets/learning-hi-fi/模型推理@4x.png" alt=""></span><strong>模型推理</strong><small>转换模型并完成推理部署</small></button><button class="ld-scenario-card scenario-operator" onclick="ldChooseScenario('算子开发')"><span class="ld-scenario-icon"><img src="visual-assets/learning-hi-fi/算子开发@4x.png" alt=""></span><strong>算子开发</strong><small>开发、编译与调试自定义算子</small></button><button class="ld-scenario-card scenario-performance" onclick="ldChooseScenario('性能调优')"><span class="ld-scenario-icon"><img src="visual-assets/learning-hi-fi/性能调优@4x.png" alt=""></span><strong>性能调优</strong><small>定位训练、推理或算子瓶颈</small></button></div></section>
      <section class="ld-scene-tasks" id="ld-scene-tasks"></section>
      <section class="ld-section" id="ld-recommend-section"><div class="ld-sec-hd"><span class="ld-sec-title">从系统化学习开始 <small id="ld-recommend-note"></small></span><div class="ld-cat-chips" id="ld-cat-chips"><button class="ld-cat-chip active" onclick="ldSetCat('all',this)">全部</button><button class="ld-cat-chip" onclick="ldSetCat('beginner',this)">入门</button><button class="ld-cat-chip" onclick="ldSetCat('developer',this)">应用开发</button><button class="ld-cat-chip" onclick="ldSetCat('operator',this)">算子开发</button></div><button class="ld-refresh-btn" onclick="ldRefreshRecommendations()">换一换</button></div><div class="ld-node-grid" id="ld-node-grid"></div></section>
      <section class="ld-section ld-continue-section"><div class="ld-sec-hd"><span class="ld-sec-title">我的学习</span></div><div class="ld-continue-list" id="ld-continue-list"></div></section>
      <section class="ld-section ld-resource-section"><div class="ld-sec-hd"><span class="ld-sec-title">我的学习资源</span><button class="ld-sec-link" onclick="ldToggleResourceForm()">+ 添加资源</button></div><form class="ld-resource-form" id="ld-resource-form" onsubmit="ldSaveResource(event)"><input id="ld-resource-title" required placeholder="资源名称"><input id="ld-resource-url" type="url" required placeholder="链接"><select id="ld-resource-type"><option>文档</option><option>课程</option><option>代码</option></select><button>保存</button></form><div class="ld-resource-list" id="ld-resource-list"></div></section>
    </div>
    <div id="ld-roadmap" style="display:none"></div>
    <aside class="ai-chat-sidebar" id="ai-sidebar" aria-label="智能助手"><div class="ai-header-panel"><div class="ai-title"><span id="ai-title-text">智能助手</span></div><button class="btn-close-ai" type="button" onclick="closeAiSidebar()">×</button></div><div class="ai-messages" id="ai-messages"></div><div class="ai-chips" id="ai-chips"></div><div class="ai-input-area"><div class="ai-input-wrap"><input id="ai-sidebar-input" placeholder="输入你的学习目标" onkeydown="if(event.key==='Enter')sendAiMessage()"><button type="button" onclick="sendAiMessage()">发送</button></div></div></aside>
  </main>
  <script>window.__LEARN_STANDALONE_PAGE='home';</script>
  <script src="cann-app.js"></script><script src="learn-standalone.js"></script>
</body>
</html>
