<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Ploy Code Sync 本地与工作区代码交接</title><desc id="desc">依据 Ploy 官方 CLI 文档绘制的流程图，不是产品界面截图。展示本地编辑和审阅、推送到 GitHub main、通过 Ploy Code Sync 导入、成功回执中的提交关系，冲突时在编辑器解决并重试。发布是单独后续步骤。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#EFF3F8"/></linearGradient>
 <linearGradient id="git" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EEEAF8"/><stop offset="1" stop-color="#E4F0F7"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#56617A" flood-opacity=".10"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8A8FA7"/></marker>
 <style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#20283A}.muted{fill:#737D91}.small{font-size:20px}.body{font-size:24px}.title{font-size:42px;font-weight:700}.step{font-size:18px;font-weight:700;letter-spacing:1px;fill:#817AA8}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><circle cx="1490" cy="95" r="180" fill="#E4E2F4" opacity=".28"/>
<g class="t"><text x="64" y="68" font-size="18" font-weight="700" letter-spacing="2" fill="#7167A8">PLOY CLI · CODE SYNC</text><text x="64" y="130" class="title">本地改动通过 Git 版本交回 Ploy</text><text x="64" y="172" class="small muted">同步回执记录两端提交；遇到冲突先在编辑器处理。发布仍是之后独立的动作。</text><rect x="1278" y="42" width="258" height="42" rx="21" fill="#fff" stroke="#D9DEEA"/><text x="1407" y="69" text-anchor="middle" class="small muted">官方 CLI 流程图 · 非产品截图</text></g>
<!-- main nodes -->
<path d="M448 370 H534" stroke="#9A9EB2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1006 370 H1092" stroke="#9A9EB2" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="64" y="232" width="384" height="288" rx="22" fill="#fff" stroke="#DFE4ED" stroke-width="2"/></g>
<g class="t"><text x="98" y="276" class="step">01 · LOCAL WORKSPACE</text><text x="98" y="322" font-size="31" font-weight="700">编辑与审阅</text><rect x="98" y="350" width="316" height="102" rx="14" fill="#202736"/><circle cx="120" cy="373" r="5" fill="#9F9ABF"/><circle cx="138" cy="373" r="5" fill="#A9C7D5"/><circle cx="156" cy="373" r="5" fill="#CED4DE"/><text x="120" y="413" font-size="19" class="mono" fill="#DDE2ED">edit → review</text><text x="120" y="440" font-size="19" class="mono" fill="#BFC8D6">commit → push</text><text x="98" y="490" class="small muted">coding agent / 本地编辑器</text></g>
<!-- GitHub node -->
<g filter="url(#shadow)"><rect x="534" y="232" width="472" height="288" rx="22" fill="url(#git)" stroke="#DADDEA" stroke-width="2"/></g>
<g class="t"><text x="570" y="276" class="step">02 · SHARED VERSION</text><text x="570" y="322" font-size="31" font-weight="700">GitHub · main</text><rect x="570" y="350" width="400" height="102" rx="14" fill="#fff" stroke="#E0E3EC"/>
<circle cx="604" cy="400" r="14" fill="#E8E5F5" stroke="#8A80B9" stroke-width="3"/><circle cx="710" cy="400" r="14" fill="#E8E5F5" stroke="#8A80B9" stroke-width="3"/><circle cx="816" cy="400" r="14" fill="#E6F0F6" stroke="#7CA0B3" stroke-width="3"/><circle cx="922" cy="400" r="14" fill="#fff" stroke="#AEB5C3" stroke-width="3"/><path d="M618 400 H696 M724 400 H802 M830 400 H908" stroke="#B9BDD0" stroke-width="3"/><text x="604" y="438" text-anchor="middle" font-size="16" class="muted">A</text><text x="710" y="438" text-anchor="middle" font-size="16" class="muted">B</text><text x="816" y="438" text-anchor="middle" font-size="16" class="muted">C</text><text x="922" y="438" text-anchor="middle" font-size="16" class="muted">HEAD</text><text x="570" y="490" class="small muted">push origin main · 以提交版本作为交接依据</text></g>
<!-- Ploy sync -->
<g filter="url(#shadow)"><rect x="1092" y="232" width="444" height="288" rx="22" fill="#fff" stroke="#DFE4ED" stroke-width="2"/></g>
<g class="t"><text x="1128" y="276" class="step">03 · IMPORT TO PLOY</text><text x="1128" y="322" font-size="31" font-weight="700">Code Sync</text><rect x="1128" y="350" width="372" height="62" rx="13" fill="#202736"/><text x="1152" y="389" font-size="20" class="mono" fill="#F1F2F7">ploy site code-sync sync</text><rect x="1128" y="430" width="372" height="58" rx="12" fill="#E8F4EF"/><circle cx="1152" cy="459" r="6" fill="#43A78B"/><text x="1172" y="454" font-size="18" font-weight="700" fill="#347E6D">成功回执</text><text x="1172" y="476" font-size="16" class="muted">GitHub commit → site-workspace commit</text></g>
<!-- conflict branch -->
<path d="M1308 520 V580 H1115" stroke="#B08F77" stroke-width="3" fill="none" marker-end="url(#arrow)"/><g class="t"><rect x="1092" y="558" width="444" height="108" rx="18" fill="#FBF7F1" stroke="#E9DCCB" stroke-width="2"/><circle cx="1126" cy="592" r="12" fill="#F3E5D0"/><path d="M1126 585v8m0 6v1" stroke="#9B7651" stroke-width="2.5" stroke-linecap="round"/><text x="1152" y="595" font-size="22" font-weight="700">若同步冲突</text><text x="1126" y="632" class="small muted">在编辑器解决冲突 → 再次执行 Code Sync</text></g>
<!-- publish separate -->
<g class="t"><rect x="64" y="712" width="1472" height="104" rx="20" fill="#fff" stroke="#DFE4ED" stroke-width="2"/><rect x="96" y="742" width="118" height="42" rx="21" fill="#F1EFF8"/><text x="155" y="770" text-anchor="middle" font-size="18" font-weight="700" fill="#7167A8">之后可选</text><text x="244" y="758" class="body" font-weight="700">在 Ploy 审阅同步后的网站</text><text x="244" y="790" class="small muted">发布需另行选择；该命令不属于 Code Sync，也不会随同步自动触发。</text><rect x="1062" y="739" width="440" height="48" rx="12" fill="#202736"/><text x="1084" y="770" font-size="18" class="mono" fill="#F1F2F7">ploy site publish --wait</text><text x="1502" y="800" text-anchor="end" font-size="16" class="muted">Ploy CLI · 文档所述工作流</text></g>
</svg>