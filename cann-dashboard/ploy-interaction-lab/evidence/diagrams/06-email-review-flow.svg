<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Email ICP 从访客信号到可审阅外联队列</title><desc id="desc">依据 Ploy 官方 Email ICP Ploybook 绘制的工作流，不是产品界面截图。展示访客排序、联系人核实、Gmail 草稿待审，以及无邮箱记录保留。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F8FC"/><stop offset="1" stop-color="#EFF2F9"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECE9FA"/><stop offset="1" stop-color="#E4F0FA"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E7F5F1"/><stop offset="1" stop-color="#EFF8F6"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#56617A" flood-opacity=".10"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8FA7"/></marker>
 <style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#20283A}.muted{fill:#737D91}.small{font-size:20px}.body{font-size:25px}.title{font-size:42px;font-weight:700}.card{fill:#fff;stroke:#DFE4ED;stroke-width:2}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2px;fill:#7167A8}.step{font-size:19px;font-weight:700;letter-spacing:1px;fill:#817AA8}</style>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><circle cx="1480" cy="85" r="170" fill="#E6E3F6" opacity=".28"/><circle cx="80" cy="835" r="210" fill="#DCECF5" opacity=".32"/>
<g class="t"><text x="64" y="68" class="eyebrow">EMAIL ICP · OFFICIAL PLOYBOOK</text><text x="64" y="130" class="title">访客信号，落成一条可审阅的外联队列</text><text x="64" y="172" class="small muted">按适配度筛选 → 核实联系人 → 草稿交由人审；无邮箱记录仍有后续去向</text><rect x="1278" y="42" width="258" height="42" rx="21" fill="#fff" stroke="#D9DEEA"/><text x="1407" y="69" text-anchor="middle" class="small muted">官方工作流图解 · 非产品截图</text></g>
<!-- flow connectors -->
<path d="M 430 360 H 512" stroke="#9A9EB2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 850 360 H 915 V 276 H 982" stroke="#9A9EB2" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M 915 360 V 588 H 982" stroke="#9A9EB2" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<!-- ranking card -->
<g filter="url(#shadow)"><rect x="64" y="226" width="366" height="278" rx="22" class="card"/></g>
<g class="t"><text x="96" y="270" class="step">01 · RANK</text><text x="96" y="316" font-size="32" font-weight="700">访客公司排序</text><text x="96" y="355" class="body muted">从已识别访客中找优先对象</text>
<rect x="96" y="384" width="140" height="44" rx="22" fill="#F0EDFA"/><text x="166" y="413" text-anchor="middle" class="small" fill="#655D9A">ICP 适配度</text><rect x="250" y="384" width="132" height="44" rx="22" fill="#E9F3F8"/><text x="316" y="413" text-anchor="middle" class="small" fill="#507D95">意图信号</text>
<path d="M96 453 H398" stroke="#E6E9EF" stroke-width="2"/><text x="96" y="484" class="small muted">明显不匹配项会被剔除</text></g>
<!-- contact verification -->
<g filter="url(#shadow)"><rect x="512" y="226" width="338" height="278" rx="22" fill="url(#violet)" stroke="#D8D8EA" stroke-width="2"/></g>
<g class="t"><text x="544" y="270" class="step">02 · VERIFY</text><text x="544" y="316" font-size="32" font-weight="700">核实联系人</text><text x="544" y="358" class="body muted">每家公司解析一位合适联系人</text>
<rect x="544" y="390" width="274" height="68" rx="14" fill="#fff" stroke="#DCDDE9"/><circle cx="576" cy="424" r="16" fill="#D7E9F2"/><path d="M568 425h16m-8-8v16" stroke="#557D94" stroke-width="2.5" stroke-linecap="round"/><text x="606" y="420" class="small" font-weight="700">工作邮箱核实</text><text x="606" y="445" font-size="18" class="muted">只进入可投递地址</text>
<text x="544" y="483" class="small muted">无可验证邮箱 → 保留记录</text></g>
<!-- branch labels -->
<g class="t"><rect x="982" y="196" width="256" height="48" rx="24" fill="#E6F4EF"/><circle cx="1008" cy="220" r="7" fill="#42A88B"/><text x="1030" y="228" class="small" font-weight="700" fill="#347E6D">已核实 · 可投递</text>
<rect x="982" y="506" width="256" height="48" rx="24" fill="#F0F2F6"/><circle cx="1008" cy="530" r="7" fill="#9199AA"/><text x="1030" y="538" class="small" font-weight="700" fill="#657083">未找到 · 不猜测</text></g>
<!-- email draft card -->
<g filter="url(#shadow)"><rect x="982" y="260" width="554" height="210" rx="20" class="card"/></g>
<g class="t"><rect x="1012" y="282" width="42" height="42" rx="13" fill="#EBF3F8"/><path d="M1021 295h24v16h-24z M1022 296l11 9 11-9" fill="none" stroke="#607D9E" stroke-width="2.4" stroke-linejoin="round"/><text x="1072" y="303" class="body" font-weight="700">Gmail · Drafts</text><text x="1072" y="329" font-size="18" class="muted">角色相关 · 单一低摩擦 CTA</text>
<rect x="1012" y="348" width="494" height="1" fill="#E7EAF0"/><text x="1012" y="382" class="small muted">邮件生成后停在草稿箱，等待人工审阅</text><rect x="1012" y="402" width="216" height="38" rx="19" fill="#E8F4EF"/><circle cx="1032" cy="421" r="5" fill="#43A78B"/><text x="1048" y="428" font-size="18" font-weight="700" fill="#347E6D">草稿待审 · 不自动发送</text><text x="1497" y="435" text-anchor="end" font-size="18" class="muted">Draft only</text></g>
<!-- no-email row -->
<g filter="url(#shadow)"><rect x="982" y="568" width="554" height="186" rx="20" class="card"/></g>
<g class="t"><text x="1012" y="608" class="body" font-weight="700">无邮箱公司仍在导出队列</text><text x="1012" y="642" class="small muted">CRM / Sheet / Ploy doc</text>
<path d="M1012 662 H1506" stroke="#E7EAF0" stroke-width="2"/><text x="1012" y="700" font-size="18" class="muted">公司</text><text x="1120" y="700" font-size="18" class="muted">适配理由</text><text x="1292" y="700" font-size="18" class="muted">意图</text><text x="1410" y="700" font-size="18" class="muted">草稿状态</text><rect x="1012" y="714" width="20" height="7" rx="3.5" fill="#D8DDE6"/><rect x="1120" y="714" width="104" height="7" rx="3.5" fill="#E7EAF0"/><rect x="1292" y="714" width="62" height="7" rx="3.5" fill="#E7EAF0"/><text x="1410" y="726" font-size="17" fill="#737D91">未生成</text></g>
<!-- footer -->
<path d="M64 800 H1536" stroke="#DCE1E9" stroke-width="2"/><g class="t"><text x="64" y="842" class="small muted">依据：Ploy · Email ICP Website Visitors</text><text x="1536" y="842" text-anchor="end" class="small muted">实际 Gmail 队列界面尚未公开取得</text></g>
</svg>