<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AEO 查询回答中的引用证据下钻</title><desc id="desc">依据 Ploy 官方 AEO 页面说明绘制的结构示意，不含实际查询、回答或引用数据。展示一条跟踪查询、完整回答、行内引用位置、来源页面、品牌与竞品出现，以及同查询的每日历史。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#F0F2F8"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EEEBF8"/><stop offset="1" stop-color="#E5F0F8"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#56617A" flood-opacity=".10"/></filter>
 <style>.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#20283A}.muted{fill:#737D91}.small{font-size:20px}.body{font-size:24px}.title{font-size:42px;font-weight:700}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2px;fill:#7167A8}</style>
</defs>
<rect width="1600" height="900" rx="30" fill="url(#bg)"/><circle cx="1460" cy="105" r="180" fill="#E5E1F3" opacity=".28"/>
<g class="t"><text x="64" y="68" class="eyebrow">AEO · CITATION TRACKING</text><text x="64" y="130" class="title">从“被引用了”下钻到回答里的依据</text><text x="64" y="172" class="small muted">一条查询对应一份完整回答、引用来源、品牌/竞品位置，以及相同查询的历史变化</text><rect x="1278" y="42" width="258" height="42" rx="21" fill="#fff" stroke="#D9DEEA"/><text x="1407" y="69" text-anchor="middle" class="small muted">结构示意 · 非实测回答</text></g>
<!-- query context -->
<g filter="url(#shadow)"><rect x="64" y="218" width="1472" height="94" rx="20" fill="#fff" stroke="#DFE4ED" stroke-width="2"/></g>
<g class="t"><rect x="94" y="242" width="50" height="46" rx="14" fill="url(#accent)"/><path d="M109 265h20m-10-10v20" stroke="#7167A8" stroke-width="2.5" stroke-linecap="round"/><text x="166" y="253" font-size="17" font-weight="700" letter-spacing="1" class="muted">TRACKED QUERY</text><text x="166" y="283" class="body" font-weight="700">某个已跟踪的问题 · 查询文本依具体记录查看</text><rect x="1070" y="242" width="132" height="46" rx="23" fill="#F3F5F8"/><text x="1136" y="272" text-anchor="middle" class="small">ChatGPT</text><rect x="1214" y="242" width="144" height="46" rx="23" fill="#F3F5F8"/><text x="1286" y="272" text-anchor="middle" class="small">Perplexity</text><rect x="1370" y="242" width="136" height="46" rx="23" fill="#F3F5F8"/><text x="1438" y="272" text-anchor="middle" class="small">Gemini</text></g>
<!-- answer body -->
<g filter="url(#shadow)"><rect x="64" y="344" width="910" height="356" rx="22" fill="#fff" stroke="#DFE4ED" stroke-width="2"/></g>
<g class="t"><text x="100" y="392" font-size="18" font-weight="700" letter-spacing="1" fill="#817AA8">GENERATED ANSWER · FULL TEXT</text><text x="100" y="443" class="body">回答正文在这里完整呈现，避免只看到汇总分数。</text><text x="100" y="484" class="body muted">品牌出现的位置与引用标记贴着原句显示，方便检查上下文。</text>
<rect x="98" y="518" width="836" height="70" rx="14" fill="#F5F3FB" stroke="#E2DDF1"/><text x="126" y="561" class="body">……回答文本中的</text><rect x="348" y="531" width="146" height="42" rx="10" fill="#E7E1F6"/><text x="421" y="559" text-anchor="middle" font-size="21" font-weight="700" fill="#625793">品牌出现</text><text x="512" y="561" class="body">与引用</text><circle cx="625" cy="551" r="17" fill="#766AB0"/><text x="625" y="558" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text><text x="652" y="561" class="body">位置相连</text>
<rect x="98" y="606" width="836" height="54" rx="12" fill="#F7F8FA"/><circle cx="126" cy="633" r="15" fill="#E4EEF5"/><text x="126" y="639" text-anchor="middle" font-size="16" font-weight="700" fill="#507D95">2</text><text x="156" y="640" class="small muted">引用标号可追到对应的来源页面</text><text x="914" y="680" text-anchor="end" font-size="16" class="muted">这里只示范信息关系，不是实际回答</text></g>
<!-- citation inspector -->
<g filter="url(#shadow)"><rect x="1000" y="344" width="536" height="356" rx="22" fill="#fff" stroke="#DFE4ED" stroke-width="2"/></g>
<g class="t"><text x="1036" y="392" font-size="18" font-weight="700" letter-spacing="1" fill="#817AA8">EVIDENCE TO VERIFY</text><text x="1036" y="435" font-size="29" font-weight="700">展开一条引用</text>
<rect x="1036" y="460" width="464" height="74" rx="14" fill="url(#accent)"/><circle cx="1067" cy="497" r="18" fill="#786CB0"/><text x="1067" y="504" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text><text x="1101" y="490" class="small" font-weight="700">来源页面</text><text x="1101" y="516" font-size="17" class="muted">实际标题与 URL 随回答记录显示</text>
<path d="M1036 556 H1500" stroke="#E5E8EF" stroke-width="2"/><circle cx="1052" cy="587" r="5" fill="#7167A8"/><text x="1072" y="594" class="small">品牌是否出现、在回答中的位置</text><circle cx="1052" cy="627" r="5" fill="#8CB2C5"/><text x="1072" y="634" class="small">同一查询还出现了哪些竞品</text><circle cx="1052" cy="667" r="5" fill="#B0A5D1"/><text x="1072" y="674" class="small">引用获得或丢失的日期</text></g>
<!-- history strip -->
<g filter="url(#shadow)"><rect x="64" y="732" width="1472" height="104" rx="20" fill="#fff" stroke="#DFE4ED" stroke-width="2"/></g>
<g class="t"><text x="96" y="775" class="small" font-weight="700">同一查询的每日历史</text><text x="96" y="808" font-size="17" class="muted">按同一查询追踪，避免把不同问题混在一起比</text><path d="M470 786 H1454" stroke="#C8CCD8" stroke-width="3" stroke-dasharray="5 9"/><circle cx="500" cy="786" r="12" fill="#ECEAF6" stroke="#887CB5" stroke-width="3"/><circle cx="810" cy="786" r="12" fill="#ECEAF6" stroke="#887CB5" stroke-width="3"/><circle cx="1120" cy="786" r="12" fill="#E5F1F7" stroke="#6E9DB3" stroke-width="3"/><circle cx="1438" cy="786" r="12" fill="#fff" stroke="#AEB5C3" stroke-width="3"/><text x="500" y="822" text-anchor="middle" font-size="16" class="muted">既往记录</text><text x="810" y="822" text-anchor="middle" font-size="16" class="muted">引用变化</text><text x="1120" y="822" text-anchor="middle" font-size="16" class="muted">当前回答</text><text x="1438" y="822" text-anchor="middle" font-size="16" class="muted">持续跟踪</text></g>
</svg>