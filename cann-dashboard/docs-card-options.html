    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #F4F6FA;
      color: #1D2129;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .hero-banner-bg {
      background:
        radial-gradient(48% 68% at 14% 102%, rgba(59, 130, 246, 0.28) 0%, transparent 72%),
        radial-gradient(46% 72% at 50% 105%, rgba(139, 92, 246, 0.30) 0%, transparent 72%),
        radial-gradient(42% 65% at 86% 102%, rgba(244, 63, 94, 0.22) 0%, transparent 72%),
        linear-gradient(180deg, #F5F7FE 0%, #EDF2FD 56%, #E8EEFC 100%);

    .hero-3d-art {
      filter: drop-shadow(0 18px 28px rgba(59, 130, 246, 0.12));
    }
    /* 3D 球体微粒（高光 + 体积渐变 + 投影） */
    .orb-3d-blue {
      background: radial-gradient(circle at 32% 28%, #EFF6FF 0%, #60A5FA 42%, #2563EB 88%, #1D4ED8 100%);
      box-shadow: 0 6px 14px -2px rgba(37, 99, 235, 0.28), inset 0 -2px 4px rgba(30, 58, 138, 0.25);
    }
    .orb-3d-lavender {
      background: radial-gradient(circle at 32% 28%, #F5F3FF 0%, #C4B5FD 40%, #8B5CF6 86%, #6D28D9 100%);
      box-shadow: 0 6px 14px -2px rgba(124, 58, 237, 0.26), inset 0 -2px 4px rgba(76, 29, 149, 0.22);
    }
    .orb-3d-coral {
      background: radial-gradient(circle at 32% 28%, #FFF1F2 0%, #FDA4AF 38%, #F43F5E 85%, #BE123C 100%);
      box-shadow: 0 6px 14px -2px rgba(244, 63, 94, 0.30), inset 0 -2px 4px rgba(136, 19, 55, 0.22);
    }
    .tile-3d-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96) 0%, rgba(224, 236, 255, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 20px -4px rgba(59, 130, 246, 0.18), 0 2px 6px rgba(15, 23, 42, 0.06), inset 0 1px 1px #FFFFFF;
    }

    .bento-card {
      background: #FFFFFF;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .bento-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 4px 10px -4px rgba(0, 82, 217, 0.04);
    }

    /* 通用文档条目微交互 */
    .doc-link {
      transition: all 0.15s ease;
    }
    .doc-link:hover {
      background-color: #F2F6FF;
      color: #0052D9;
    }
    .doc-link:hover .link-arrow {
      opacity: 1;
      transform: translateX(0);
    }
    .link-arrow {
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.15s ease;
    }

          id: 'compiler',
          title: '编译器',
          tier: 'standard',
          badge: 'ISA',
          icon: 'beaker',
          accent: 'purple',
          items: [
            { title: '毕昇编译器开发与指令集参考', href: '#bisheng', keywords: '毕昇编译器开发与指令集参考 编译器' }
          ]
        },
        {
          id: 'more',
          title: '更多',
          tier: 'standard',
          subtitle: '场景扩展',
          icon: 'grid',
          accent: 'slate',
          items: [
            { title: '应用开发', href: '#app-dev', keywords: '应用开发' },
            { title: 'LLM DataDist开发', href: '#llm-datadist', keywords: 'LLM DataDist开发' },
            { title: 'DataFlow开发', href: '#dataflow', keywords: 'DataFlow开发' }
          ]
        },
        {
          id: 'reference',
          title: '参考',
          subtitle: '日常开发排障、参数配置与底层融合规范速查',
          tier: 'strip',
          badge: 'Quick Reference',
          icon: 'book',
          accent: 'amber',
          items: [
            { title: '故障处理', href: '#troubleshooting', keywords: '故障处理' },
            { title: '日志参考', href: '#log-ref', keywords: '日志参考' },
            { title: '环境变量参考', href: '#env-ref', keywords: '环境变量参考' },
            { title: '图融合和UB融合规则参考', href: '#fusion-ref', keywords: '图融合和UB融合规则参考' },
            { title: '基础数据结构和接口', href: '#data-struct', keywords: '基础数据结构和接口' }
          ]
        }
      ]
    };

    // 精简配置示例（4 分类）
    const COMPACT_DOCS_CONFIG = {
      quickTags: [
        { label: 'Ascend C', query: 'Ascend C' },
        { label: 'PyPTO', query: 'PyPTO' },
        { label: '故障处理', query: '故障' }
      ],
      categories: [
        DEFAULT_DOCS_CONFIG.categories[0],
        DEFAULT_DOCS_CONFIG.categories[1],
        DEFAULT_DOCS_CONFIG.categories[3],
        DEFAULT_DOCS_CONFIG.categories[6]
      ]
    };

    // 扩容配置示例（10 分类 + 单卡超 5 项自动折叠）
    const EXPANDED_DOCS_CONFIG = {
      quickTags: [
        ...DEFAULT_DOCS_CONFIG.quickTags,
        { label: '驱动与固件', query: '驱动' },
        { label: '量化压缩', query: '量化' }
      ],
      categories: [
        DEFAULT_DOCS_CONFIG.categories[0],
        {
          ...DEFAULT_DOCS_CONFIG.categories[1],
          items: [
            ...DEFAULT_DOCS_CONFIG.categories[1].items.map(i => ({ ...i, spanFullIfOdd: false })),
            { title: 'ACLlib基础接口API', href: '#api-acl', keywords: 'ACLlib基础接口API API参考' }
          ]
        },
        DEFAULT_DOCS_CONFIG.categories[2],
        {
          ...DEFAULT_DOCS_CONFIG.categories[3],
          items: [
            ...DEFAULT_DOCS_CONFIG.categories[3].items,
            { title: 'MindStudio Insight可视化', href: '#insight', keywords: 'MindStudio Insight可视化 调试' },
            { title: '算子仿真与核函数剖析', href: '#sim', keywords: '算子仿真 核函数剖析' },
            { title: '异常Dump与快照诊断', href: '#dump', keywords: '异常Dump 快照诊断' }
          ]
        },
        DEFAULT_DOCS_CONFIG.categories[4],
        DEFAULT_DOCS_CONFIG.categories[5],
        {
          id: 'quant',
          title: '模型压缩与量化',
          tier: 'standard',
          badge: 'New',
          icon: 'cube',
          accent: 'indigo',
          items: [
            { title: 'AMCT训练后量化指南', href: '#amct-ptq', keywords: 'AMCT训练后量化' },
            { title: 'W8A8 / W4A16大模型量化', href: '#llm-quant', keywords: '大模型量化 W8A8' },
            { title: '稀疏化与剪枝工具链', href: '#prune', keywords: '稀疏化 剪枝' }
          ]
        },
        {
          id: 'driver',
          title: '驱动、固件与容器',
          tier: 'standard',
          icon: 'shield',
          accent: 'rose',
          items: [
            { title: 'NPU驱动与固件升级', href: '#driver-upgrade', keywords: 'NPU驱动 固件升级' },
            { title: 'Ascend Docker Runtime', href: '#docker-runtime', keywords: 'Docker Runtime 容器' },
            { title: 'npu-smi设备运维命令', href: '#npu-smi', keywords: 'npu-smi 设备运维' }
          ]
        },
        {
          id: 'migration',
          title: '三方框架迁移与适配',
          tier: 'standard',
          icon: 'network',
          accent: 'blue',
          items: [
            { title: 'PyTorch模型迁移指南', href: '#torch-npu', keywords: 'PyTorch torch_npu 迁移' },
            { title: 'vLLM / SGLang推理适配', href: '#vllm-ascend', keywords: 'vLLM SGLang 推理适配' }
          ]
        },
        DEFAULT_DOCS_CONFIG.categories[6]
      ]
    };

    const CONFIG_PRESETS = {
      compact: COMPACT_DOCS_CONFIG,
      standard: DEFAULT_DOCS_CONFIG,
      expanded: EXPANDED_DOCS_CONFIG
    };

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function renderIcon(iconName) {
      const paths = ICON_MAP[iconName] || ICON_MAP.cube;
      return `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">${paths}</svg>`;
    }

    function renderQuickTags(tags) {
      const container = document.getElementById('quickTagsContainer');
      if (!container) return;
      const pills = (tags || []).map(t => {
        const label = typeof t === 'string' ? t : t.label;
        const query = typeof t === 'string' ? t : (t.query || t.label);
        return `<button onclick="quickFilter('${escapeHtml(query)}')" class="px-2.5 py-1 rounded-md bg-white/80 hover:bg-white ring-1 ring-slate-200/70 text-slate-700 hover:text-[#0052D9] transition-colors font-medium">${escapeHtml(label)}</button>`;
      }).join('');
      container.innerHTML = `<span class="text-slate-500 mr-1">高频直达：</span>${pills}`;
    }

    function renderFeaturedCard(cat) {
      const acc = ACCENT_MAP[cat.accent] || ACCENT_MAP.blue;
      const items = cat.items || [];
      const hasTags = items.some(item => item.tag);

      const headerRight = cat.badge
        ? `<span class="text-[11px] font-medium px-2 py-0.5 rounded ${acc.soft}">${escapeHtml(cat.badge)}</span>`
        : (cat.showCount ? `<span class="text-xs text-slate-400 font-mono-code">${items.length} Modules</span>` : '');

      const flowHtml = (cat.flowSteps && cat.flowSteps.length >= 2)
        ? `<div class="my-4 px-3 py-2 rounded-lg bg-[#F5F7FA] flex items-center justify-between text-[11px] text-slate-500 font-mono-code">${cat.flowSteps.map(s => `<span>${escapeHtml(s)}</span>`).join('<span class="text-slate-300">──▶</span>')}</div>`
        : '';

      let itemsHtml = '';
      if (hasTags) {
        const colsClass = items.length === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-3';
        itemsHtml = `
          <div class="grid grid-cols-1 ${colsClass} gap-2.5">
            ${items.map(item => {
              const tagAcc = ACCENT_MAP[item.tagAccent] || acc;
              return `
                <a href="${escapeHtml(item.href || '#')}" class="doc-item doc-link bg-[#F5F7FA] hover:bg-blue-50/80 rounded-xl p-3 flex flex-col justify-between group" data-keywords="${escapeHtml(item.keywords || item.title)}">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[10px] font-mono-code px-1.5 py-0.5 rounded bg-white ${tagAcc.tag} font-medium">${escapeHtml(item.tag || '')}</span>
                    <span class="link-arrow text-[#0052D9] text-xs">→</span>
                  </div>
                  <div class="text-sm font-semibold text-slate-800 group-hover:text-[#0052D9]">${escapeHtml(item.title)}</div>
                </a>`;
            }).join('')}
          </div>`;
      } else {
        itemsHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${items.map((item, idx) => {
              const spanFull = (item.spanFullIfOdd && items.length % 2 === 1 && idx === items.length - 1) ? ' sm:col-span-2' : '';
              return `
                <a href="${escapeHtml(item.href || '#')}" class="doc-item doc-link bg-[#F5F7FA] px-3.5 py-2.5 rounded-xl flex items-center justify-between text-sm font-medium text-slate-800${spanFull}" data-keywords="${escapeHtml(item.keywords || item.title)}">
                  <span>${escapeHtml(item.title)}</span>
                  <span class="link-arrow text-[#0052D9] text-xs">→</span>
                </a>`;
            }).join('')}
          </div>`;
      }

      return `
        <section class="doc-category bento-card rounded-2xl p-6 flex flex-col justify-between ${acc.grad}">
          <div>
            <div class="flex items-center justify-between ${flowHtml ? 'mb-3' : 'mb-4'}">
              <div class="flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-lg ${acc.solid} flex items-center justify-center">${renderIcon(cat.icon)}</span>
                <div>
                  <h2 class="font-bold text-base text-slate-900">${escapeHtml(cat.title)}</h2>
                  ${cat.subtitle ? `<p class="text-xs text-slate-500">${escapeHtml(cat.subtitle)}</p>` : ''}
                </div>
              </div>
              ${headerRight}
            </div>
            ${flowHtml}
          </div>
          ${itemsHtml}
        </section>`;
    }

    function renderStandardCard(cat) {
      const acc = ACCENT_MAP[cat.accent] || ACCENT_MAP.slate;
      const items = cat.items || [];
      const COLLAPSE_LIMIT = 5;
      const hasOverflow = items.length > COLLAPSE_LIMIT;

      const rightEl = cat.badge
        ? `<span class="text-[11px] font-mono-code ${acc.soft} px-2 py-0.5 rounded">${escapeHtml(cat.badge)}</span>`
        : (cat.subtitle ? `<span class="text-xs text-slate-400">${escapeHtml(cat.subtitle)}</span>` : '');

      const listHtml = items.map((item, idx) => {
        const extraClass = hasOverflow && idx >= COLLAPSE_LIMIT ? ' extra-item hidden' : '';
        return `
          <li class="doc-item${extraClass}" data-keywords="${escapeHtml(item.keywords || item.title)}">
            <a href="${escapeHtml(item.href || '#')}" class="doc-link flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-700">
              <span>${escapeHtml(item.title)}</span>
              <span class="link-arrow text-[#0052D9] text-xs">→</span>
            </a>
          </li>`;
      }).join('');

      const expandBtn = hasOverflow
        ? `<button type="button" onclick="toggleCardExpand(this)" class="expand-toggle-btn mt-3 w-full py-1.5 rounded-lg bg-[#F5F7FA] hover:bg-blue-50 text-xs font-medium text-slate-600 hover:text-[#0052D9] transition-colors">展开全部（共 ${items.length} 项）</button>`
        : '';

      const footerHtml = cat.footerNote
        ? `<div class="mt-4 pt-3 border-t border-slate-100 text-[11px] text-slate-400">${escapeHtml(cat.footerNote)}</div>`
        : '';

      return `
        <section class="doc-category bento-card rounded-2xl p-6 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-lg ${acc.soft} flex items-center justify-center">${renderIcon(cat.icon)}</span>
                <h2 class="font-semibold text-base text-slate-900">${escapeHtml(cat.title)}</h2>
              </div>
              ${rightEl}
            </div>
            <ul class="space-y-1">${listHtml}</ul>
            ${expandBtn}
          </div>
          ${footerHtml}
        </section>`;
    }

    function renderStripCard(cat) {
      const acc = ACCENT_MAP[cat.accent] || ACCENT_MAP.amber;
      const items = cat.items || [];
      return `
        <section class="doc-category bento-card rounded-2xl p-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2.5">
              <span class="w-8 h-8 rounded-lg ${acc.soft} flex items-center justify-center">${renderIcon(cat.icon)}</span>
              <div>
                <h2 class="font-semibold text-base text-slate-900">${escapeHtml(cat.title)}</h2>
                ${cat.subtitle ? `<p class="text-xs text-slate-500">${escapeHtml(cat.subtitle)}</p>` : ''}
              </div>
            </div>
            ${cat.badge ? `<span class="text-xs text-slate-400 font-mono-code">${escapeHtml(cat.badge)}</span>` : ''}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
            ${items.map(item => `
              <a href="${escapeHtml(item.href || '#')}" class="doc-item doc-link bg-[#F5F7FA] px-3.5 py-2.5 rounded-xl flex items-center justify-between text-sm font-medium text-slate-700" data-keywords="${escapeHtml(item.keywords || item.title)}">
                <span>${escapeHtml(item.title)}</span>
                <span class="link-arrow text-[#0052D9] text-xs">→</span>
              </a>`).join('')}
          </div>
        </section>`;
    }

    function renderDocsPage(config) {
      renderQuickTags(config.quickTags);

      const categories = config.categories || [];
      const featured = categories.filter(c => c.tier === 'featured');
      const standard = categories.filter(c => c.tier !== 'featured' && c.tier !== 'strip');
      const strips = categories.filter(c => c.tier === 'strip');

      const container = document.getElementById('view-bento');
      let html = '';

      if (featured.length > 0) {
        const fCols = featured.length === 1 ? 'lg:grid-cols-1' : 'lg:grid-cols-2';
        html += `<div class="grid grid-cols-1 ${fCols} gap-6">${featured.map(renderFeaturedCard).join('')}</div>`;
      }

      if (standard.length > 0) {
        const sCols = standard.length === 1 ? 'lg:grid-cols-1' : (standard.length === 2 ? 'md:grid-cols-2 lg:grid-cols-2' : 'md:grid-cols-2 lg:grid-cols-3');
        html += `<div class="grid grid-cols-1 ${sCols} gap-6">${standard.map(renderStandardCard).join('')}</div>`;
      }

      strips.forEach(cat => {
        html += renderStripCard(cat);
      });

      container.innerHTML = html;
      filterDocs(searchInput.value || '');
    }

    window.toggleCardExpand = function (btn) {
      const card = btn.closest('.doc-category');
      const extras = card.querySelectorAll('.extra-item');
      const expanded = btn.dataset.expanded === '1';
      extras.forEach(el => el.classList.toggle('hidden', expanded));
      btn.dataset.expanded = expanded ? '0' : '1';
      btn.textContent = expanded ? `展开全部（共 ${card.querySelectorAll('.doc-item').length} 项）` : '收起部分';
    };

    // 实时搜索过滤
    const searchInput = document.getElementById('docSearchInput');
    const clearBtn = document.getElementById('clearSearchBtn');
    const emptyState = document.getElementById('emptyState');
    const emptyKeyword = document.getElementById('emptyKeyword');

    function filterDocs(query) {
      const q = query.trim().toLowerCase();
      clearBtn.classList.toggle('hidden', q.length === 0);

      const activeContainer = document.getElementById('view-bento');
      const categories = activeContainer.querySelectorAll('.doc-category');
      let visibleCategories = 0;

      categories.forEach(cat => {
        const items = cat.querySelectorAll('.doc-item');
        const expandBtn = cat.querySelector('.expand-toggle-btn');
        let hasMatch = false;

        items.forEach(item => {
          const text = item.textContent.toLowerCase();
          const keywords = (item.dataset.keywords || '').toLowerCase();
          const matched = !q || text.includes(q) || keywords.includes(q);
          const isCollapsedExtra = !q && item.classList.contains('extra-item') && (!expandBtn || expandBtn.dataset.expanded !== '1');
          item.classList.toggle('hidden', !matched || isCollapsedExtra);
          if (matched) hasMatch = true;
        });

        if (expandBtn) expandBtn.classList.toggle('hidden', q.length > 0);
        cat.classList.toggle('hidden', !hasMatch);
        if (hasMatch) visibleCategories++;
      });

      if (visibleCategories === 0) {
        emptyKeyword.textContent = query;
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }
    }

    function quickFilter(tag) {
      searchInput.value = tag;
      filterDocs(tag);
      searchInput.focus();
    }

    function resetFilter() {
      searchInput.value = '';
      filterDocs('');
    }

    searchInput.addEventListener('input', (e) => filterDocs(e.target.value));
    clearBtn.addEventListener('click', resetFilter);

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        resetFilter();
        searchInput.blur();
      }
    });

    // 预设规模切换
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const preset = btn.dataset.preset;
        document.querySelectorAll('.preset-btn').forEach(b => {
          const active = b === btn;
          b.className = active
            ? 'preset-btn px-3 py-1 rounded-lg font-medium bg-[#0052D9] text-white shadow-2xs transition-colors'
            : 'preset-btn px-3 py-1 rounded-lg font-medium text-slate-600 hover:text-slate-900 transition-colors';
        });
        renderDocsPage(CONFIG_PRESETS[preset] || DEFAULT_DOCS_CONFIG);
      });
    });

    // 优先读取外部 docs-config.json，失败时回退内置默认配置
    (async function initDocsPage() {
      try {
        const res = await fetch('./docs-config.json', { cache: 'no-store' });
        if (res.ok) {
          const externalConfig = await res.json();
          if (externalConfig && Array.isArray(externalConfig.categories)) {
            CONFIG_PRESETS.standard = externalConfig;
          }
        }
      } catch (_) {
        // 本地 file:// 打开时使用内置 DEFAULT_DOCS_CONFIG
      }
      renderDocsPage(CONFIG_PRESETS.standard);
    })();
  </script>
