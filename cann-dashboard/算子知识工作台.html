一条。 设备日志会有连锁反应，最后一条通常是\"前面出错的后果\"。 2. PC 地址。 如果有，配合编译时 -g 保留符号，能定位到 kernel 的具体行。 3. 访问的地址和长度。 越界类日志通常会给\"访问了哪个地址、长度多少\"，和你的 tensor 大小一比就清楚。 4. trap 前后的算子名。 确认崩的是你的算子，还是前一个算子留下的烂摊子（异步执行时，错误的\"归属\"会错位）。", "nodes": ["n52"]}, {"c": 13, "r": 6, "q": "找到了，访问长度比我分配的多了 128 字节。是我 tiling 里算错了。", "a": "那就对上了——不是 workspace 释放问题，是 tiling 算错了长度。 这类\"多 128 字节\"特别典型，通常是： 尾块按 tileLen 算，而不是按 realLen； 对齐时向上取整，但没做边界检查； blockNum × perCore 超过了 total。 修完之后建议加一道运行时断言，把这类问题挡在执行前：", "nodes": ["n50"]}, {"c": 13, "r": 7, "q": "顺便问一句，这种设备侧异常会影响别的进程吗？我这台卡上还有别人的服务。", "a": "会，而且比你想的严重。 同卡进程之间的隔离是有限的：一个进程让 AI Core trap，可能导致： 整卡复位（其他进程的连接断掉）； 其他进程的 kernel 被连带中断； 严重时驱动需要重新加载。 所以两条纪律： 别在共用卡上做破坏性实验（大 shape 压测、越界试探）； 容器/进程要能优雅失败，被连带 kill 后能重试，而不是整个服务挂掉。 如果这台卡上确实有别人的服务，建议先申请一张独占卡做调试，别直接把整个测试流程跑在共享卡上。", "nodes": ["n5"]}, {"c": 13, "r": 8, "q": "明白了。那我改完之后和 PyTorch 对不上，差了 1e-3。", "a": "先排语义，再排数值——顺序反了会浪费很多时间。 语义层（先查）： 数值层（后查）：累加顺序、Cast 的 RoundMode、eps。 验证技巧：用三组特殊输入跑一遍，比随机数好用得多： 随机数的问题是\"错了也看不出错在哪\"，这三种输入能把错误模式放大。", "nodes": ["n18", "n53"]}, {"c": 13, "r": 9, "q": "确实是 NHWC。改了之后对上了。", "a": "对，NHWC/NCHW 是最常见的\"整块错位\"来源——因为数据在内存里的排列变了，kernel 按错误的 stride 读，读到的就是\"另一批元素\"，结果看起来\"差不多对但有偏差\"。 建议在算子入口加一个格式检查或者显式转换：", "nodes": ["n18"]}, {"c": 13, "r": 10, "q": "最后问个事，这个算子要给业务团队，我交什么？", "a": "六样，缺一样都会在对接时返工： 其中最容易漏的是 ③ 和 ⑥： ③ 漏了：业务方传一个你没测过的 shape，出问题后才发现\"不支持\"； ⑥ 漏了：业务方踩到一个已知 bug，以为是新问题，重新排查一遍。 另外建议在 ② 里写清楚 workspace 的复用方式——这是调用方最容易写错的地方。 ---", "nodes": ["n50", "n54"]}, {"c": 14, "r": 1, "q": "一直不太确定，我的算子该用 fp16 还是 fp32。用 fp32 怕慢，用 fp16 怕精度不够。有没有判断标准？", "a": "有三个维度，按顺序判断，基本能定下来： 先看三种格式的差别： 一句话选型：范围不够用 bf16，精度不够用 fp32，都不缺用 fp16。", "nodes": ["n31"]}, {"c": 14, "r": 2, "q": "bf16 和 fp16 到底差在哪？我一直以为 bf16 更\"高级\"。", "a": "不是高级，是取舍不同： 举例： 神经网络权重/激活：值通常集中在 ±10 以内，fp16 够用，精度也更好； 梯度、loss：可能到 1e-8 或者 1e5，fp16 会溢出/下溢，bf16 更稳； 需要高精度的累加：两个都不够，要 fp32。 所以训练里常见\"bf16 存参数、fp32 累加\"，推理里常见\"fp16 全流程\"。", "nodes": ["n31"]}, {"c": 14, "r": 3, "q": "为什么 fp16 在昇腾上更快？是硬件只支持 fp16 吗？", "a": "不是\"只支持\"，是吞吐不同。 Vector 单元一次能处理的元素数，取决于数据宽度。fp16 是 2 字节，fp32 是 4 字节，同样一条指令，fp16 能处理两倍的元素。 再加上 UB 带宽占用减半（同样元素数，fp16 只占一半空间），搬运压力也小。 所以同一个算子： 实测下来，fp16 相对 fp32 通常有 1.5–2 倍的速度优势（取决于算子类型）。", "nodes": []}, {"c": 14, "r": 4, "q": "精度不够的典型表现是什么？我怎么知道是精度问题还是逻辑问题？", "a": "几个特征，能帮你快速区分： 最直接的判据：fp32 版本对不对。fp32 对、fp16 错，就是精度问题；fp32 也错，那是逻辑问题，别在精度上浪费时间。", "nodes": []}, {"c": 14, "r": 5, "q": "那怎么判断\"精度够不够\"？有没有量化标准？", "a": "三个层次： 1. 验收指标（硬标准）：MARE / MERE / RMSE Ratio 等，按算子类别查对应阈值。 2. 误差传播（软判断）：这个算子的输出会进到哪一层？如果后面是 softmax、layernorm 这类\"对输入敏感\"的操作，要求要更严。 3. 端到端（最终标准）：整网精度掉没掉。有时候单算子误差大一点，但整网看不出来；有时候单算子很好，但累积起来崩了。 实践建议：单算子按验收指标卡，整网按端到端卡。两个都要过，不能只看一个。", "nodes": ["n28"]}, {"c": 14, "r": 6, "q": "为什么累加一定要用 fp32？我用 fp16 累加，误差也没大到不能看。", "a": "因为 fp16 累加的误差随长度增长，短序列看不出来，长序列会崩。 原理是\"大数吃小数\"： 序列越长，被吃掉的增量越多。1024 个元素的 sum，误差可能到 1e-2 量级。 fp32 的尾数多 13 位，同样的累加能保住更多增量。所以： 累加器：fp32（几乎无脑） 存储：fp16（省空间） 除法/开方：fp32（误差敏感） 这就是\"混合精度\"的核心：不是全局选一个精度，而是按运算类型选。", "nodes": ["n26"]}, {"c": 14, "r": 7, "q": "那 fp8 呢？我看新芯片支持 fp8，什么时候能用？", "a": "fp8 主要是量化场景用的，不是通用计算格式。 它的有效位非常少（尾数 2–3 位），只适合两类： 推理的权重/激活，而且做过量化校准（scale 是精心选的）； 对精度不敏感的中间层（比如某些 attention 的 QK^T）。 不适合： 累加（误差会爆炸）； 归一化（数值范围变化大）； 任何需要\"看得清细节\"的计算。 如果你的模型没做量化，直接用 fp8 大概率精度崩。这不是\"格式不好\"，是\"用错了场景\"。", "nodes": []}, {"c": 14, "r": 8, "q": "混合精度具体怎么落地？我不想全局改。", "a": "按\"存储 / 计算 / 累加\"三段分开设计，而不是一刀切： 实现上就是\"局部转换\"：", "nodes": []}, {"c": 14, "r": 9, "q": "精度和性能的取舍怎么量化？我想给老板一个说法。", "a": "做一张\"精度-性能\"曲线，比说\"我们用 fp16 所以快\"有说服力。 方法： 同一组输入，分别跑 fp32 / fp16 / bf16 三个版本； 记录：MARE、耗时、带宽利用率； 画在一张图上，标注验收线。 通常会看到： 如果验收线是 1e-3，那 fp16 就是最优解（过线且最快），bf16 不够，fp32 浪费。 这张图还能回答\"万一验收线收紧到 5e-4 怎么办\"——你知道要付出多少性能代价。", "nodes": ["n31"]}, {"c": 14, "r": 10, "q": "有没有\"精度预算\"这种方法？我想在设计阶段就定下来。", "a": "有，思路跟\"误差传播\"一样：把总误差预算分配到每一层。 实际操作中不需要这么精确，但方向要对： 越靠近输入的层，误差会被后面放大，要求更严； 越靠近输出的层，误差影响越小，可以放宽； 有归一化/softmax 的层，误差会被\"重新缩放\"，要看相对误差。 有预算之后，你在选 dtype 时就有依据，而不是\"先跑跑看\"。", "nodes": []}, {"c": 14, "r": 11, "q": "那最后给我一个能直接用的判断流程吧。", "a": "五步，按顺序： 核心原则：能用 fp16 就用 fp16，把 fp32 留给\"真正需要它的那几步\"。全局 fp32 是最省事的偷懒，也是最容易在性能上吃亏的选择。 ---", "nodes": ["n31"]}, {"c": 15, "r": 1, "q": "方案评审被问\"为什么非要 host tiling + kernel 两段，不能像 CUDA 一样一个 kernel 里切分\"。我当时答\"文档就这么写的\"，被追问就没词了。", "a": "这个问题确实值得答清楚，因为它是编程模型层面的差异，不是风格问题。 核心原因三条，每条都是硬约束： 1. AI Core 没有线程抽象，不能动态扩并行。 CUDA 里你在 kernel 里 if (threadIdx.x < n) 就能控制并行度，因为线程数是启动参数，block 内部还能再分层。Ascend C 的并行度在 kernel 启动时就定了（blockDim），kernel 内部没有\"再启动更多并行\"的手段。所以\"怎么分\"必须提前算好。 2. 片上存储很小，且必须显式管理。 UB 是百 KB 级，不是\"自动缓存\"。一块 tile 放多少、开几个 buffer、什么时候搬，全部要提前规划。这个规划需要知道 shape、dtype、对齐，这些信息在 host 侧最全。 3. kernel 二进制静态展开。 循环次数、buffer 数量在编译期确定，运行期不能\"按需申请\"。所以 tiling 参数必须是\"数据\"，从 host 传进来，而不是 kernel 里现算。 合起来就是：kernel 只负责\"按给定的切分执行\"，不负责\"决定怎么切\"。这个分工在 CUDA 里是隐式的（硬件和编译器帮你做了），在 Ascend C 里是显式的。", "nodes": ["n39", "n48", "n49"]}, {"c": 15, "r": 2, "q": "那 Scalar 是干嘛的？我看它性能很差，为什么不干脆去掉。", "a": "因为它干的是控制流，不是数据并行，这两类工作没法用同一个单元做。 Scalar 负责： 算地址（基址 + 偏移 + stride） 判断边界（是不是最后一块、要不要走尾块分支） 控制循环（搬几块、算几轮） 发指令（什么时候启动 MTE，什么时候启动 Vector） 这些都是\"决定做什么\"，而 Vector/Cube 是\"做\"。打个比方：Vector/Cube 是工人，Scalar 是工头。工头不搬砖，但没有他，工人不知道下一车砖从哪来。 所以优化 kernel 有一条重要经验：减少 Scalar 的工作量。具体做法： 别在循环里做逐元素的标量运算（能向量化就向量化）； 地址用增量算，不要每次重算； 循环适当展开，减少分支判断。 Scalar 一旦成为瓶颈，表现是\"各单元利用率都不高，但就是快不起来\"。", "nodes": ["n39", "n40"]}, {"c": 15, "r": 3, "q": "Cube 和 Vector 能同时跑吗？", "a": "能，它们是独立的流水，硬件上可以并行推进。 但\"能并行\"不等于\"会自动并行\"。要真正重叠，需要满足： 没有数据依赖：Cube 的输出不被当前 Vector 任务依赖； buffer 分开：Cube 用 L0A/L0B/L0C，Vector 用 UB，别抢同一块； 同步点合适：用事件精确同步，别用 PIPE_ALL 一刀切。", "nodes": ["n40", "n41"]}, {"c": 15, "r": 4, "q": "可我写的 kernel 里它们看起来像串行的。", "a": "大概率是这两个原因之一： 1. 有依赖，但你没意识到。 比如 Cube 算完写到 GM，Vector 再从 GM 读回来——中间隔了一次 GM 往返，天然串行。 2. 同步写得太粗。 如果你在每个阶段之间都插了 PipeBarrier<PIPE_ALL>，那就等于强制串行。调试时这么写没问题，性能敏感时必须换成精确事件。 判断方法：看 profiling 里的流水图。如果两条流水的\"忙\"区间完全不重叠，就是串行了；如果只是部分重叠，说明同步点还可以再优化。", "nodes": ["n40", "n41"]}, {"c": 15, "r": 5, "q": "UB 和 L1 是什么关系？我老看到 L0A、L0B、L0C。", "a": "一张图能说清： 关键区别：UB 和 L1 是两块不同的片上空间，不是包含关系。 所以你写 elementwise 基本只碰 UB；写 Matmul 才需要管 L1/L0 的搬运。两者不要混着理解。", "nodes": []}, {"c": 15, "r": 6, "q": "那为什么不能把 L1 和 UB 合并？", "a": "这个我只能讲到\"设计取舍\"这一层，具体的微架构原因要看官方架构文档。 从外部能观察到的取舍是：Cube 和 Vector 的访问模式差别很大——Cube 需要大块、规整、可复用的矩阵块；Vector 需要灵活的、逐元素的访问。如果合成一块，两者会争抢同一份带宽和容量，反而都变慢。 至于\"为什么是这样划分、容量怎么定的\"，属于硬件设计细节，我不掌握，建议查对应芯片的架构白皮书。", "nodes": ["n40", "n41"]}, {"c": 15, "r": 7, "q": "行。那图模式和单算子模式，对我的写法有影响吗？", "a": "对 kernel 写法没影响，对性能表现有影响。 实用建议：先在单算子模式下把 kernel 调对、调快，再放进图里。 原因：图模式下如果性能不对，你很难判断是\"算子本身慢\"还是\"调度/融合没做好\"。先有单算子的基线，才有对比。", "nodes": ["n43"]}, {"c": 15, "r": 8, "q": "aclnn、aclop、GE 这三个我一直分不清。", "a": "按调用层次，从下往上： 一句话记：GE 管\"多个算子怎么排\"，aclnn 管\"一个算子怎么调\"，OPP 是仓库，kernel 是货。 你写算子时接触的是 kernel；给别人用时，对方接触的是 aclnn（或图）。", "nodes": ["n43"]}, {"c": 15, "r": 9, "q": "那什么算子该用高阶 API？", "a": "原则：能用就用，除非有明确理由不用。 反模式很常见：一上来就手写全套流水（CopyIn/Compute/CopyOut + 手写同步），最后在同步和精度上耗掉几周，而高阶 API 可能一天就到位。 正确顺序是：高阶 API 拿基线 → 有明确瓶颈 → 再下沉。", "nodes": ["n42"]}, {"c": 15, "r": 10, "q": "那我要是给组里讲这一套，按什么顺序讲比较好？", "a": "五段，每段配一个\"可验证的产出\"，别只讲概念： 最容易跳过、也最该补的是第 4 段。大部分人卡在\"能跑通但不能交付\"，缺的不是 API 知识，而是调试方法论——而这一块恰恰是最难自学的。", "nodes": []}, {"c": 15, "r": 11, "q": "行，我把这页补到方案里，顺便把\"为什么不是 CUDA 那套\"单独画一页。", "a": "画的时候建议加一句对比，能直接堵住追问： CUDA 的并行度是\"线程数\"，由硬件调度器动态分配；Ascend 的并行度是\"核数 × 指令 lane\"，在启动时确定。前者灵活但有调度开销，后者固定但可以精确编排流水。tiling 就是把\"编排\"这件事提前到 host 侧完成。 这句话基本能解释\"为什么不能一个 kernel 搞定\"，也解释了\"为什么 Ascend 的代码看起来更啰嗦\"。", "nodes": ["n39"]}];

 ["慢","性能","带宽","木桶","耗时"],
 ["精度","误差","mare","mere","对不齐"],
 ["对齐","32b","非对齐","对齐错误"],
 ["多核","切分","blockdim","尾核","负载"],
 ["双缓冲","tque","tbuf","流水"],
 ["日志","plog","msnpureport","device 日志"],
 ["驱动","固件","firmware","版本不匹配"],
 ["tiling","切块","分块","tile"],
 ["迁移","cuda","映射","搬"],
 ["shape","动态","分档","尾块"],
];
function expandQ(q){
  const out=new Set([q]);
  SYN.forEach(g=>{ if(g.some(t=>t.includes(q)||q.includes(t))) g.forEach(t=>out.add(t)); });
  return [...out];
}
function qTerms(){ return expandQ((state.q||'').toLowerCase()); }
const anyIn=(hay,terms)=>terms.some(t=>hay.includes(t));
const roundHit=(r,q)=>{
  const terms=q?expandQ(q.toLowerCase()):[];
  return anyIn(roundText(r),terms);
};
function matchQ(n){
  if(!state.q) return false;
  const terms=qTerms();
  const own=(n.name+' '+n.def+' '+(n.pit||'')).toLowerCase();
  if(anyIn(own,terms)) return true;
  return n.turns.some(t=>{const r=ROUNDMAP.get(`${t.c}-${t.t}`); return r&&anyIn(roundText(r),terms);});
}
function visibleNode(n){
  if(state.q){
    if(state.gran===1) return n.anchor;
    if(n.w < {2:3,3:2,4:1,5:0}[state.gran]) return false;
    if(state.domain && n.dom!==state.domain) return false;
    return true;  // 搜索时跨场景，保留全部节点只做淡化
  }
  if(state.gran===1) return n.anchor && inScene(n) && (!state.domain||n.dom===state.domain);
  if(n.w < {2:3,3:2,4:1,5:0}[state.gran]) return false;
  if(state.domain && n.dom!==state.domain) return false;
  return inScene(n);
}
function visibleNodes(){ return NODES.filter(visibleNode); }

/* ================= 布局 ================= */
function initPositions(list){
  list.forEach(n=>{
    if(typeof n.vx!=='number'){ n.vx=0; n.vy=0; }
    if(typeof n.x==='number' && isFinite(n.x)) return;
    const d=domById[n.dom];
    const a=Math.random()*Math.PI*2, r=30+Math.random()*110;
    n.x=d.cx+Math.cos(a)*r; n.y=d.cy+Math.sin(a)*r;
  });
}
function layoutLinks(list){
  const ids=new Set(list.map(n=>n.id));
  return LINKS.filter(([a,b])=>ids.has(a)&&ids.has(b));
}
function step(list,links,alpha){
  const n=list.length;
  for(let i=0;i<n;i++){
    const a=list[i]; a.fx=0; a.fy=0;
    for(let j=i+1;j<n;j++){
      const b=list[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2<1){dx=.6;dy=.6;d2=1;}
      if(d2>90000) continue;
      const d=Math.sqrt(d2), f=3200/d2, ux=dx/d, uy=dy/d;
      a.fx-=ux*f; a.fy-=uy*f; b.fx+=ux*f; b.fy+=uy*f;
      const pad=8;
      const ox=(a.__w+b.__w)/2+pad-Math.abs(dx);
      const oy=(a.__h+b.__h)/2+pad-Math.abs(dy);
      if(ox>0&&oy>0){
        if(ox<oy){ const p=ox*0.5*(dx>=0?1:-1); a.fx-=p; b.fx+=p; }
        else     { const p=oy*0.5*(dy>=0?1:-1); a.fy-=p; b.fy+=p; }
      }
    }
  }
  links.forEach(([a,b])=>{
    const A=nodeById[a],B=nodeById[b];
    if(!A||!B) return;
    let dx=B.x-A.x, dy=B.y-A.y; const d=Math.hypot(dx,dy)||1;
    const same=A.dom===B.dom;
    const L=same?46:112, k=same?.055:.015;
    const f=(d-L)*k, ux=dx/d, uy=dy/d;
    A.fx+=ux*f; A.fy+=uy*f; B.fx-=ux*f; B.fy-=uy*f;
  });
  list.forEach(n=>{
    const d=domById[n.dom];
    if(n.anchor){ n.x=d.cx; n.y=d.cy; n.vx=0; n.vy=0; return; }
    n.fx+=(d.cx-n.x)*0.08;
    n.fy+=(d.cy-n.y)*0.08;
    n.fx+=(W.x/2-n.x)*0.0012;
    n.fy+=(W.y/2-n.y)*0.0012;
  });
  list.forEach(n=>{
    if(n.anchor) return;
    n.vx=((n.vx||0)+(n.fx||0)*alpha*0.5)*0.82;
    n.vy=((n.vy||0)+(n.fy||0)*alpha*0.5)*0.82;
    const sp=Math.hypot(n.vx,n.vy); if(sp>10){n.vx*=10/sp;n.vy*=10/sp;}
    n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(70,Math.min(W.x-70,n.x));
    n.y=Math.max(80,Math.min(W.y-60,n.y));
  });
}
function separate(list,iters=600){
  const pad=8;
  for(let k=0;k<iters;k++){
    let moved=false;
    for(let i=0;i<list.length;i++){
      const a=list[i];
      for(let j=i+1;j<list.length;j++){
        const b=list[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        const ox=(a.__w+b.__w)/2+pad-Math.abs(dx);
        const oy=(a.__h+b.__h)/2+pad-Math.abs(dy);
        if(ox<=0||oy<=0) continue;
        if(ox<oy){
          const p=ox*0.5*(dx>=0?1:-1);
          a.x-=p; b.x+=p;
        } else {
          const p=oy*0.5*(dy>=0?1:-1);
          a.y-=p; b.y+=p;
        }
        moved=true;
      }
    }
    if(!moved) break;
  }
}
function relayout(steps=160){
  const list=visibleNodes();
  initPositions(list);
  const links=layoutLinks(list);
  for(let k=0;k<steps;k++) step(list,links,1-k/steps);
  separate(list);
  list.forEach(n=>{
    n.x=Math.max(n.__w/2+20,Math.min(W.x-n.__w/2-20,n.x));
    n.y=Math.max(n.__h/2+40,Math.min(W.y-n.__h/2-20,n.y));
  });
  render();
}

/* ================= 边聚合 ================= */
function buildAdj(){
  const adj={};
  NODES.forEach(n=>adj[n.id]=[]);
  LINKS.forEach(([a,b])=>{ adj[a].push(b); adj[b].push(a); });
  return adj;
}
const ADJ=buildAdj();
function repsFor(visSet){
  const rep={};
  const hidden=NODES.filter(n=>!visSet.has(n.id));
  hidden.forEach(h=>{
    // BFS：优先同域
    for(const sameDom of [true,false]){
      const seen=new Set([h.id]); const q=[h.id]; let found=null;
      while(q.length&&!found){
        const cur=q.shift();
        for(const nx of ADJ[cur]||[]){
          if(seen.has(nx)) continue;
          seen.add(nx);
          if(visSet.has(nx)&&(!sameDom||nodeById[nx].dom===h.dom)){ found=nx; break; }
          q.push(nx);
        }
      }
      if(found){ rep[h.id]=found; break; }
    }
  });
  return rep;
}
let AGG=[];
function buildEdges(visSet){
  const rep=repsFor(visSet), m=new Map();
  LINKS.forEach(([a,b,kind])=>{
    const ra=visSet.has(a)?a:(rep[a]||null);
    const rb=visSet.has(b)?b:(rep[b]||null);
    if(!ra||!rb||ra===rb) return;
    const key=ra<rb?ra+'|'+rb:rb+'|'+ra;
    if(!m.has(key)) m.set(key,{a:ra,b:rb,kind:kind||'dep',count:0});
    m.get(key).count++;
  });
  return [...m.values()];
}

/* ================= 渲染：节点 / 边 / 标签 ================= */
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(t,q){
  if(!q) return esc(t);
  const i=t.toLowerCase().indexOf(q);
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
let measureCtx=document.createElement('canvas').getContext('2d');
function textW(t,fs=9.8){ measureCtx.font=fs+'px "PingFang SC",sans-serif'; return measureCtx.measureText(t).width; }

const CAP={3:{h:24,fs:9.8,pad:10,fw:700},2:{h:20,fs:9.2,pad:9,fw:600},
            1:{h:18,fs:8.6,pad:8,fw:500},0:{h:16,fs:8.2,pad:7,fw:500}};
function capSize(n){
  const c=CAP[n.w];
  return {w:Math.ceil(textW(n.name,c.fs)+c.pad*2),h:c.h,fs:c.fs,fw:c.fw};
}
function mixWhite(hex,t){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const f=v=>Math.round(v+(255-v)*t);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function capStyle(n){
  const c=domById[n.dom].color;
  if(n.w===3) return {fill:c,stroke:'none',sw:0,txt:'#0F172A',halo:.13};
  if(n.w===2) return {fill:mixWhite(c,.78),stroke:c,sw:1,txt:'#1E293B',halo:0};
  if(n.w===1) return {fill:'#FFFFFF',stroke:c,sw:1,txt:'#334155',halo:0};
  return {fill:'#FFFFFF',stroke:'#DDE3EC',sw:1,txt:'#64748B',halo:0};
}
function buildNodes(){
  const g=$('#nodes');
  NODES.forEach(n=>{
    const size=capSize(n), st=capStyle(n);
    n.__w=size.w; n.__h=size.h;
    const el=document.createElementNS(NS,'g');
    el.setAttribute('class','node'); el.dataset.id=n.id;

    const halo=document.createElementNS(NS,'rect');
    halo.setAttribute('class','caphalo');
    halo.setAttribute('x',-(size.w/2+5)); halo.setAttribute('y',-(size.h/2+4));
    halo.setAttribute('width',size.w+10); halo.setAttribute('height',size.h+8);
    halo.setAttribute('rx',(size.h+8)/2);
    halo.setAttribute('fill',domById[n.dom].color);
    halo.style.opacity=st.halo;
    el.appendChild(halo);

    const cap=document.createElementNS(NS,'rect');
    cap.setAttribute('class','cap');
    cap.setAttribute('x',-size.w/2); cap.setAttribute('y',-size.h/2);
    cap.setAttribute('width',size.w); cap.setAttribute('height',size.h);
    cap.setAttribute('rx',size.h/2);
    cap.setAttribute('fill',st.fill);
    cap.setAttribute('stroke',st.stroke);
    cap.setAttribute('stroke-width',st.sw);
    el.appendChild(cap);

    const t=document.createElementNS(NS,'text');
    t.setAttribute('y',size.fs*0.36);
    t.setAttribute('font-size',size.fs);
    t.setAttribute('font-weight',size.fw);
    t.setAttribute('fill',st.txt);
    t.textContent=n.name;
    el.appendChild(t);

    n.__el=el;
    el.addEventListener('pointerenter',()=>hover(n.id));
    el.addEventListener('pointerleave',()=>hover(null));
    el.addEventListener('pointerdown',e=>startDrag(e,n));
    g.appendChild(el);
  });
}

function render(){
  const list=visibleNodes(); const visSet=new Set(list.map(n=>n.id));
  HITS = state.q ? new Set(list.filter(matchQ).map(n=>n.id)) : null;
  NODES.forEach(n=>{ n.__el.style.display=visSet.has(n.id)?'':'none'; });

  // 节点位置与尺寸
  list.forEach(n=>{
    n.__el.setAttribute('transform',`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    n.__el.classList.toggle('qdim', !!HITS && !HITS.has(n.id));
  });

  // 边
  AGG=buildEdges(visSet);
  const eg=$('#edges'); eg.innerHTML='';
  AGG.forEach(e=>{
    const A=nodeById[e.a],B=nodeById[e.b];
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',A.x); ln.setAttribute('y1',A.y);
    ln.setAttribute('x2',B.x); ln.setAttribute('y2',B.y);
    ln.setAttribute('class','edge '+(e.kind==='trade'?'trade':'dep')+(e.count>1?' agg':''));
    const wd=(e.kind==='trade'?1.7:1)+Math.min(e.count-1,3)*0.55;
    ln.setAttribute('stroke-width',wd.toFixed(2));
    e.__el=ln; eg.appendChild(ln);
  });

  renderDomains(list);
  applyHighlight();
}

function placeLabels(list){
  const placed=[];
  const obstacles=list.map(n=>({x:n.x-n.__r-2,y:n.y-n.__r-2,w:(n.__r+2)*2,h:(n.__r+2)*2}));
  const overlaps=(b,arr)=>arr.reduce((c,o)=>c+((b.x+b.w<o.x||b.x>o.x+o.w||b.y+b.h<o.y||b.y>o.y+o.h)?0:1),0);
  const nameW=n=>textW(n.name,9.8);
  const sorted=list.slice().sort((a,b)=>b.w-a.w);
  sorted.forEach(n=>{
    const w=nameW(n), h=14, r=n.__r;
    const ring=[];
    for(const ang of [-90,90,0,180,-45,45,135,-135]){
      const rad=(ang%90===0?r+13:r+18)* (Math.abs(ang)===90?1:1);
      const x=Math.cos(ang*Math.PI/180)*rad, y=Math.sin(ang*Math.PI/180)*rad;
      const anchor=Math.abs(x)<1?'middle':(x>0?'start':'end');
      ring.push({x, y:y+4, anchor, box:{x:n.x+x-(anchor==='middle'?w/2:anchor==='start'?0:w), y:n.y+y+4-11, w, h}});
    }
    let best=null, bestScore=1e9;
    ring.forEach(c=>{
      const sc=overlaps(c.box,placed)*3+overlaps(c.box,obstacles);
      if(sc<bestScore){ bestScore=sc; best=c; }
    });
    const score=bestScore;
    if(score>0 && n.w<3){ n.__t.style.display='none'; n.__bg.style.display='none'; return; }
    n.__t.style.display=''; n.__bg.style.display='';
    n.__t.setAttribute('text-anchor',best.anchor);
    n.__t.setAttribute('x',best.x); n.__t.setAttribute('y',best.y);
    n.__bg.setAttribute('x',best.x-(best.anchor==='middle'?w/2:best.anchor==='start'?0:w)-4);
    n.__bg.setAttribute('y',best.y-11); n.__bg.setAttribute('width',w+8);
    placed.push(best.box);
  });
}

/* ================= 高亮 / 悬停 ================= */
function neighbors(id){
  const s=new Set([id]);
  AGG.forEach(e=>{ if(e.a===id)s.add(e.b); if(e.b===id)s.add(e.a); });
  return s;
}
function applyHighlight(){
  const focus=state.sel||state.hover;
  const glows=document.querySelectorAll('#glows .glow');
  NODES.forEach(n=>{
    n.__el.classList.remove('dim','nb','sel');
  });
  if(!focus){
    glows.forEach(g=>g.style.opacity=0);
    AGG.forEach(e=>{
      const on=HITS?(HITS.has(e.a)||HITS.has(e.b)):true;
      e.__el.setAttribute('stroke-opacity',on?'1':'.06');
    });
    document.querySelectorAll('.eglabel').forEach(e=>e.remove());
    AGG.forEach(e=>{ e.__el.setAttribute('stroke-opacity','1'); e.__el.removeAttribute('marker-end'); });
    return;
  }
  const nb=neighbors(focus);
  const focusDom=nodeById[focus].dom;
  const nbDoms=new Set([...nb].map(id=>nodeById[id].dom));
  glows.forEach(g=>{
    g.style.opacity = g.dataset.dom===focusDom ? 1 : (nbDoms.has(g.dataset.dom)? .45 : 0);
  });
  NODES.forEach(n=>{
    if(n.__el.style.display==='none') return;
    n.__el.classList.toggle('sel', n.id===state.sel);
    if(!nb.has(n.id)) n.__el.classList.add('dim');
    else if(n.id!==focus) n.__el.classList.add('nb');
  });
  const eg=$('#eglabels'); eg.innerHTML='';
  AGG.forEach(e=>{
    const hit=e.a===focus||e.b===focus;
    e.__el.setAttribute('stroke-opacity',hit?'1':'.12');
    if(hit){ e.__el.setAttribute('marker-end','url(#arrow)'); }
    else e.__el.removeAttribute('marker-end');
    if(hit && e.count>1){
      const A=nodeById[e.a],B=nodeById[e.b];
      const t=document.createElementNS(NS,'text');
      t.setAttribute('class','eglabel');
      t.setAttribute('x',(A.x+B.x)/2); t.setAttribute('y',(A.y+B.y)/2-3);
      t.textContent=e.count+' 项聚合关联';
      eg.appendChild(t);
    }
  });
}
function hover(id){
  state.hover=id;
  applyHighlight();
}

/* ================= 对话原文 ================= */
function renderStream(){
  const box=$('#stream'); box.innerHTML='';
  const sel=$('#dlgFilter');
  const ds=SCENES.find(s=>s.id===state.scene).ds;
  const cur=sel.value;
  sel.innerHTML='';
  const all=document.createElement('option'); all.value='all'; all.textContent=`全部（${ds.length} 篇）`;
  sel.appendChild(all);
  ds.forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=dlgByN[c].t;
    sel.appendChild(o);
  });
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'all';
  const only=sel.value==='all'?null:Number(sel.value);

  const q=state.q.toLowerCase();
  let list=ROUNDS.filter(r=>sceneSet.has(r.c)&&(!only||r.c===only));
  if(q) list=list.filter(r=>roundHit(r,q));
  const frag=document.createDocumentFragment();
  if(q){
    const bar=document.createElement('div');
    bar.className='searchbar';
    bar.innerHTML=`搜索 “${esc(state.q)}” · 命中 <b>${list.length}</b> 轮`;
    frag.appendChild(bar);
  }
  let last=null, wrap=null;
  list.forEach(r=>{
    if(r.c!==last){
      wrap=document.createElement('div');
      wrap.className='grpw'; wrap.dataset.c=r.c;
      frag.appendChild(wrap);
      const dv=document.createElement('div'); dv.className='grpdiv';
      wrap.appendChild(dv); last=r.c;
    }
    const el=document.createElement('div');
    el.className='round'; el.id=`r-${r.c}-${r.r}`;
    const chips=r.nodes.map(id=>`<button class="chip" data-node="${id}">${nodeById[id].name}</button>`).join('');
    el.innerHTML=`
      <div class="round-top"><span class="rd">第 ${r.r} 轮</span></div>
      <div class="qa q"><span class="who">他</span><div class="tx">${hl(r.q,q)}</div></div>
      <div class="qa a"><span class="who a">助手</span><div class="tx">${hl(r.a,q)}</div></div>
      ${chips?`<div class="chips">${chips}</div>`:''}`;
    el.querySelectorAll('.tx').forEach(t=>t.onclick=()=>t.classList.toggle('open'));
    el.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>onChip(b.dataset.node));
    wrap.appendChild(el);
  });
  box.appendChild(frag);
  requestAnimationFrame(updateCrumb);
}
$('#dlgFilter').onchange=()=>renderStream();

let crumbTick=false;
function updateCrumb(){
  const box=$('#stream'), el=$('#crumb');
  if(!box||!el) return;
  const wraps=[...box.querySelectorAll('.grpw')];
  if(!wraps.length){ el.textContent='—'; return; }
  const line=box.getBoundingClientRect().top+10;
  let cur=wraps[0];
  for(const w of wraps){ if(w.getBoundingClientRect().top<=line) cur=w; else break; }
  const d=dlgByN[Number(cur.dataset.c)];
  el.textContent=d?d.t:'—';
}
$('#stream').addEventListener('scroll',()=>{
  if(crumbTick) return; crumbTick=true;
  requestAnimationFrame(()=>{ updateCrumb(); crumbTick=false; });
});

function scrollToRound(c,t,pulse){
  const el=document.getElementById(`r-${c}-${t}`);
  const box=$('#stream');
  if(!el||!box) return;
  const r1=el.getBoundingClientRect(), r2=box.getBoundingClientRect();
  const top=box.scrollTop+(r1.top-r2.top)-box.clientHeight/2+r1.height/2;
  box.scrollTop=Math.max(0,top);
  if(pulse){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
}
function scrollToFirstTurn(id){
  const n=nodeById[id];
  if(!n.turns.length) return;
  openDrawer();
  requestAnimationFrame(()=>scrollToRound(n.turns[0].c,n.turns[0].t,true));
}

/* ================= 选择 / 展开 ================= */
function select(id,opts={}){
  state.sel=id;
  applyHighlight();
  renderInsight();
  if(opts.scroll!==false) scrollToFirstTurn(id);
  if(opts.fly) flyTo(id);
}
function onChip(id){
  const n=nodeById[id];
  const vis=new Set(visibleNodes().map(x=>x.id));
  if(!vis.has(id)){
    state.gran=5; state.domain=null; state.scene='all'; sceneSet.clear();
    SCENES[0].ds.forEach(d=>sceneSet.add(d));
    syncControls(); renderStream(); relayout();
  }
  select(id,{scroll:true,fly:true});
}

/* ================= 视野 ================= */
function fitView(animate,subset){
  const list=(subset&&subset.length?subset:visibleNodes());
  if(!list.length) return;
  const pad=40;
  const minX=Math.min(...list.map(n=>n.x-n.__w/2))-pad;
  const maxX=Math.max(...list.map(n=>n.x+n.__w/2))+pad;
  const minY=Math.min(...list.map(n=>n.y-n.__h/2))-pad;
  const maxY=Math.max(...list.map(n=>n.y+n.__h/2))+pad;
  const w=$('#stage').clientWidth, h=$('#stage').clientHeight;
  const k=Math.min(w/(maxX-minX), h/(maxY-minY), 1.6);
  const tx=w/2-((minX+maxX)/2)*k, ty=h/2-((minY+maxY)/2)*k;
  view={k,x:tx,y:ty}; applyView();
}
function flyTo(id){
  const n=nodeById[id];
  const w=$('#stage').clientWidth, h=$('#stage').clientHeight;
  const k=Math.max(1.1, Math.min(view.k,1.6));
  animView({k,x:w/2-n.x*k,y:h/2-n.y*k},520);
}
let anim=null;
function animView(to,ms){
  cancelAnimationFrame(anim);
  const from={...view}; const t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  const loop=now=>{
    const p=Math.min(1,(now-t0)/ms), e=ease(p);
    view={k:from.k+(to.k-from.k)*e, x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e};
    applyView();
    if(p<1) anim=requestAnimationFrame(loop);
  };
  anim=requestAnimationFrame(loop);
}
function applyView(){
  $('#viewport').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  const st=$('#stage');
  st.style.setProperty('--grid', view.k<0.72?'72px':'36px');
}

/* ================= 交互 ================= */
let drag=null, pan=null, moved=0;
function toWorld(e){
  const r=svg.getBoundingClientRect();
  return {x:(e.clientX-r.left-view.x)/view.k, y:(e.clientY-r.top-view.y)/view.k};
}
let bgDown=false;
function startDrag(e,n){
  e.stopPropagation();
  bgDown=false;
  drag={n,sx:e.clientX,sy:e.clientY,moved:0};
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
}
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')) return;
  bgDown=true;
  pan={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
  svg.classList.add('panning');
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
});
svg.addEventListener('pointermove',e=>{
  if(drag){
    const p=toWorld(e);
    drag.moved=Math.max(drag.moved,Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy));
    if(drag.moved>4){
      drag.n.x=p.x; drag.n.y=p.y; drag.n.vx=0; drag.n.vy=0;
      drag.n.__el.setAttribute('transform',`translate(${p.x},${p.y})`);
    }
    return;
  }
  if(pan){
    view.x=pan.vx+(e.clientX-pan.sx);
    view.y=pan.vy+(e.clientY-pan.sy);
    applyView();
  }
});
svg.addEventListener('pointerup',e=>{
  if(drag){
    const n=drag.n, wasDrag=drag.moved>5; drag=null;
    if(!wasDrag){
      select(n.id,{scroll:true});   // 轻点：选中并出原文
    } else {
      const list=visibleNodes(); const links=layoutLinks(list);
      for(let i=0;i<40;i++) step(list,links,.5);
      render(); fitView(false);
    }
  }
  if(pan){ pan=null; svg.classList.remove('panning'); }
});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  // 双指横移 → 平移；捏合/滚轮 → 以光标为中心缩放
  if(!e.ctrlKey && Math.abs(e.deltaX)>Math.abs(e.deltaY)*0.8){
    view.x-=e.deltaX; view.y-=e.deltaY*0.4; applyView(); return;
  }
  const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const wx=(mx-view.x)/view.k, wy=(my-view.y)/view.k;
  const f=e.deltaY<0?1.1:1/1.1;
  view.k=Math.max(.35,Math.min(2.8,view.k*f));
  view.x=mx-wx*view.k; view.y=my-wy*view.k;
  applyView();
},{passive:false});
svg.addEventListener('click',e=>{
  if(!bgDown) return;          // 节点上的点击不清空选择
  bgDown=false;
  state.sel=null; applyHighlight(); renderInsight();
});

/* ================= 控件 ================= */
function syncControls(){
  document.querySelectorAll('#scenes button').forEach(b=>b.classList.toggle('on',b.dataset.id===state.scene));
  $('#gran').value=state.gran;
  $('#granVal').textContent=state.gran+' · '+['','领域骨架','核心瓶颈','关键机制','常规细节','原子实操'][state.gran];
  document.querySelectorAll('.drow').forEach(el=>el.classList.toggle('on',el.dataset.dom===state.domain));
  document.querySelectorAll('.drow').forEach(el=>{
    el.classList.toggle('off', !!state.domain && el.dataset.dom!==state.domain);
  });
}
$('#gran').addEventListener('input',e=>{
  state.gran=Number(e.target.value);
  $('#granVal').textContent=state.gran+' · '+['','领域骨架','核心瓶颈','关键机制','常规细节','原子实操'][state.gran];
});
$('#gran').addEventListener('change',()=>{ relayout(); fitView(true); });
$('#q').addEventListener('input',e=>{
  state.q=e.target.value.trim();
  clearTimeout(window.__qt);
  window.__qt=setTimeout(()=>{
    const q=state.q.toLowerCase();
    renderStream();
    relayout();
    fitView(true, q?visibleNodes().filter(matchQ):null);
    const hits=visibleNodes();
    const rs=q?ROUNDS.filter(r=>sceneSet.has(r.c)&&roundHit(r,q)):[];
    if(q){
      const mh=hits.filter(matchQ).length;
      $('#hint').textContent=`搜索“${state.q}” · 命中 ${mh} 个知识点 · ${rs.length} 轮原文（其余已淡化）`;
      if(rs.length){
        openDrawer();
        setTimeout(()=>scrollToRound(rs[0].c,rs[0].r,false),80);
      }
    }
    if(q && hits.length===1) select(hits[0].id,{scroll:true,fly:true});
  },220);
});
$('#zIn').onclick=()=>{view.k=Math.min(2.8,view.k*1.2);applyView();};
$('#zOut').onclick=()=>{view.k=Math.max(.35,view.k/1.2);applyView();};
$('#zFit').onclick=()=>fitView(true);
function closeDrawer(){
  $('#drawer').classList.remove('open');
  document.body.classList.remove('drawer-open');
  $('#fab').classList.add('show');
}
$('#dwClose').onclick=closeDrawer;
$('#fab').onclick=()=>openDrawer();
function openDrawer(){
  const wasOpen=$('#drawer').classList.contains('open');
  $('#drawer').classList.add('open');
  document.body.classList.add('drawer-open');
  $('#fab').classList.remove('show');
  if(!wasOpen) setTimeout(()=>{ resize(); fitView(true); },80);
}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'){ state.sel=null; applyHighlight(); renderInsight(); }
  if(e.key==='0'){ fitView(true); }
});

/* ================= 图例 ================= */
function buildLegend(){
  const box=$('#legend');
  const counts={}; NODES.forEach(n=>counts[n.dom]=(counts[n.dom]||0)+1);
  box.innerHTML=`<h4>技术领域</h4>`+
    DOMAINS.map(d=>`<div class="drow" data-dom="${d.id}">
      <span class="dot" style="background:${d.color}"></span>${d.name}
      <span class="cnt">${counts[d.id]||0}</span></div>`).join('')+
    `<div class="lines"><span><i class="l solid"></i>依赖</span><span><i class="l dash"></i>权衡</span></div>
    <div class="sizes">
      <div class="sz"><i style="width:23px;height:23px"></i>核心瓶颈</div>
      <div class="sz"><i style="width:15px;height:15px"></i>关键机制</div>
      <div class="sz"><i style="width:10px;height:10px"></i>常规</div>
      <div class="sz"><i style="width:7px;height:7px"></i>原子</div>
    </div>
    <button class="reset" id="resetDom">全部显示</button>`;
  box.querySelectorAll('.drow').forEach(el=>{
    el.onclick=()=>{
      state.domain = state.domain===el.dataset.dom? null : el.dataset.dom;
      syncControls(); relayout(); fitView(true);
    };
  });
  $('#resetDom').onclick=()=>{ state.domain=null; syncControls(); relayout(); fitView(true); };
}

/* ================= 统计 ================= */
(function(){
  const b=$('#brandSub');
  if(b) b.textContent=`15 段原声对话 · ${NODES.length} 个知识点`;
  $('#stats').innerHTML=
    `<div class="stat"><i>${DLG.length}</i>对话</div>
     <div class="stat"><i>${NODES.length}</i>节点</div>
     <div class="stat"><i>${ROUNDS.length}</i>轮</div>`;
})();

/* ================= 启动 ================= */
buildDefs(); buildNodes(); buildLegend(); renderStream(); renderInsight();
if(!$('#drawer').classList.contains('open')) $('#fab').classList.add('show');
syncControls();
resize();
relayout(140);
ready=true;
resize();
fitView(false);
window.addEventListener('resize',()=>{ resize(); render(); });
new ResizeObserver(()=>{ resize(); render(); }).observe($('#stage'));
</script>
