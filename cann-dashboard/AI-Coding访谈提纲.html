<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Coding 访谈提纲</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/IKKI2000/harmonyos-fonts@master/css/harmonyos_sans_sc.css">
<style>
  :root{--ink:#202735;--muted:#707b8f;--line:#9aa4b2;--paper:#f7f8fb;--panel:#fff}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:'HarmonyOS Sans SC','Noto Sans SC',sans-serif}
  .page{min-width:1280px;padding:42px 48px 56px}.head{max-width:1760px;margin:0 auto 28px;display:flex;align-items:end;justify-content:space-between;gap:24px}.eyebrow{font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#687489}.head h1{margin:7px 0 0;font-size:32px;letter-spacing:-.035em}.head p{max-width:430px;margin:0;color:var(--muted);font-size:14px;line-height:1.6;text-align:right}.canvas{max-width:1760px;margin:0 auto;border:1px solid #e0e4eb;border-radius:22px;background:var(--panel);box-shadow:0 16px 38px -30px rgba(22,33,54,.35);overflow:auto}.canvas svg{display:block;min-width:1280px;width:100%;height:auto}.edge{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.edge-main{stroke:var(--line)}.root rect{fill:#27324a}.root .title{fill:#fff;font-size:20px;font-weight:700}.root .sub{fill:rgba(255,255,255,.72);font-size:13px}.topic rect{stroke-width:1.7}.topic .num{font-size:11px;font-weight:700}.topic .title{font-size:16px;font-weight:700;fill:var(--ink)}.topic .count{font-size:11px;fill:var(--muted)}.question rect{stroke-width:1.1}.question text{fill:var(--ink);font-size:13px}.question .emphasis{font-weight:700}.question .dot{font-size:11px;font-weight:700}
  @media(max-width:900px){.page{padding:24px}.head{align-items:start;flex-direction:column}.head p{text-align:left}.canvas{border-radius:14px}}
</style>
</head>
<body>
<main class="page">
  <header class="head">
    <div><div class="eyebrow">INTERVIEW GUIDE</div><h1>AI Coding 访谈提纲</h1></div>
    <p>从一件真实任务出发，连续了解 AI 的参与方式、人的介入、结果验收、学习影响与产品机会。</p>
  </header>
  <section class="canvas" aria-label="AI Coding 访谈结构图">
    <svg id="map" role="img" aria-label="左侧是研究目标，中间是六个访谈主题，右侧是各主题对应的追问"></svg>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
const topics=[
  {title:'真实任务',color:'#377cf6',fill:'#edf4ff',items:['最近一次用 AI 完成什么任务？','任务类型、工具 / 模型、技术场景','做到什么程度算完成？']},
  {title:'AI 如何参与任务',color:'#249d89',fill:'#eaf9f5',items:['AI 帮了哪些步骤？检索、读文档、选方案、写代码、调试、优化','没有 AI 原本会怎么做？','还会在何时访问官方文档、社区、Sample、论坛？','AI 找到信息却仍无法解决问题时，原因是什么？']},
  {title:'人何时介入',color:'#ed7a42',fill:'#fff2eb',items:['什么情况下 AI 会卡住或反复报错？','人如何接手？补上下文、重定义问题、给新分支、换模型或方案','哪些判断依赖经验？','在昇腾等专有技术场景，AI 缺什么？知识、版本、错误案例、工程上下文、Skill']},
  {title:'如何验收结果',color:'#9060d2',fill:'#f5efff',items:['先检查什么？功能、精度、性能、稳健性','什么情况下会看关键代码？','哪些可交给 AI 审核，哪些必须人判断？','更信任结果、过程证据还是代码？']},
  {title:'AI 对学习的影响',color:'#bd8b15',fill:'#fff8e3',items:['任务完成后，是否真的学会？','哪些被压缩的过程影响理解？搜索、排错、写代码、理解原理','AI 失败时，用户能否自己继续？','新手、中等经验、资深用户有什么差异？']},
  {title:'学习类产品的 AI 机会',color:'#d55f83',fill:'#fff0f4',items:['现有 Agent 已经在哪些地方足够好？','哪些任务或学习节点仍然不够？','如果学习类产品加入 AI，必须提供什么价值才会使用？','更需要什么？可信来源、工程上下文、运行验证、错误恢复、知识沉淀或其他','希望以什么形式出现？学习页面、运行环境、Skill、IDE 插件或其他']}
];
const emphasis=[
  [['最近一次','AI'],['任务类型','工具 / 模型','技术场景'],['完成']],
  [['AI 帮了哪些步骤','检索、读文档、选方案、写代码、调试、优化'],['没有 AI','原本'],['官方文档、社区、Sample、论坛'],['仍无法解决问题','原因']],
  [['AI 会卡住或反复报错'],['人如何接手','补上下文、重定义问题、给新分支、换模型或方案'],['判断依赖经验'],['昇腾等专有技术场景','知识、版本、错误案例、工程上下文、Skill']],
  [['功能、精度、性能、稳健性'],['关键代码'],['AI 审核','必须人判断'],['最终结果、过程证据还是代码']],
  [['是否真的学会'],['被压缩的过程','搜索、排错、写代码、理解原理'],['AI 失败时','自己继续'],['新手、中等经验、资深用户']],
  [['现有 Agent','足够好'],['任务或学习节点','仍然不够'],['学习类产品加入 AI','必须提供什么价值'],['可信来源、工程上下文、运行验证、错误恢复、知识沉淀'],['学习页面、运行环境、Skill、IDE 插件']]
];

const cfg={w:1660,rootX:44,rootW:235,topicX:344,topicW:220,forkX:602,questionX:638,questionW:960,top:40,gap:20,itemGap:7};
const svg=d3.select('#map').attr('viewBox',`0 0 ${cfg.w} 100`);

function wrap(text,maxChars=54){
  const segments=text.split(/(?<=[，、：？])/).filter(Boolean);let line='';const lines=[];
  segments.forEach(segment=>{if((line+segment).length>maxChars&&line){lines.push(line);line=segment}else line+=segment});
  if(line)lines.push(line);return lines;
}

function renderLine(selection,line,terms){
  const matches=(terms||[]).filter(term=>line.includes(term)).sort((a,b)=>b.length-a.length);
  if(!matches.length){selection.text(line);return}
  const escaped=matches.map(term=>term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const pattern=new RegExp(`(${escaped.join('|')})`,'g');
  line.split(pattern).filter(Boolean).forEach(part=>selection.append('tspan').attr('class',matches.includes(part)?'emphasis':null).text(part));
}

function draw(){
  svg.selectAll('*').remove();
  const layout=[];let cursor=cfg.top;
  topics.forEach((topic,index)=>{
    const questions=topic.items.map((text,i)=>{const lines=wrap(text);return {text,i,lines,terms:emphasis[index][i],h:Math.max(42,18+lines.length*18)}});
    const questionsH=d3.sum(questions,d=>d.h)+cfg.itemGap*(questions.length-1);
    const topicH=64;const blockH=Math.max(topicH,questionsH);const topicY=cursor+(blockH-topicH)/2;
    let itemY=cursor;questions.forEach(q=>{q.y=itemY;itemY+=q.h+cfg.itemGap});
    layout.push({...topic,index,questions,blockH,topicY,topicMid:topicY+topicH/2,firstMid:questions[0].y+questions[0].h/2,lastMid:questions.at(-1).y+questions.at(-1).h/2});
    cursor+=blockH+cfg.gap;
  });
  const height=cursor+30;svg.attr('viewBox',`0 0 ${cfg.w} ${height}`);
  const rootH=102,rootY=height/2-rootH/2,trunkX=310;
  const g=svg.append('g');

  const root=g.append('g').attr('class','root').attr('transform',`translate(${cfg.rootX},${rootY})`);
  root.append('rect').attr('width',cfg.rootW).attr('height',rootH).attr('rx',18).attr('ry',18);
  root.append('text').attr('class','title').attr('x',22).attr('y',38).text('AI Coding 访谈');
  root.append('text').attr('class','sub').attr('x',22).attr('y',63).text('理解 AI 如何改变');
  root.append('text').attr('class','sub').attr('x',22).attr('y',83).text('开发、学习与产品需求');

  const trunkTop=layout[0].topicMid,trunkBottom=layout.at(-1).topicMid;
  g.append('path').attr('class','edge edge-main').attr('d',`M${cfg.rootX+cfg.rootW},${rootY+rootH/2}H${trunkX}V${trunkTop}M${trunkX},${trunkTop}V${trunkBottom}`);

  layout.forEach(topic=>{
    const topicNode=g.append('g').attr('class','topic').attr('transform',`translate(${cfg.topicX},${topic.topicY})`);
    g.append('path').attr('class','edge').attr('stroke',topic.color).attr('d',`M${trunkX},${topic.topicMid}H${cfg.topicX}`);
    topicNode.append('rect').attr('width',cfg.topicW).attr('height',64).attr('rx',14).attr('ry',14).attr('fill',topic.fill).attr('stroke',topic.color);
    topicNode.append('text').attr('class','num').attr('x',14).attr('y',23).attr('fill',topic.color).text(String(topic.index+1).padStart(2,'0'));
    topicNode.append('text').attr('class','title').attr('x',42).attr('y',24).text(topic.title);
    topicNode.append('text').attr('class','count').attr('x',42).attr('y',45).text(`${topic.items.length} 个核心问题`);

    g.append('path').attr('class','edge').attr('stroke',topic.color).attr('d',`M${cfg.topicX+cfg.topicW},${topic.topicMid}H${cfg.forkX}V${topic.firstMid}M${cfg.forkX},${topic.firstMid}V${topic.lastMid}`);
    topic.questions.forEach(question=>{
      const mid=question.y+question.h/2;
      g.append('path').attr('class','edge').attr('stroke',topic.color).attr('d',`M${cfg.forkX},${mid}H${cfg.questionX}`);
      const q=g.append('g').attr('class','question').attr('transform',`translate(${cfg.questionX},${question.y})`);
      q.append('rect').attr('width',cfg.questionW).attr('height',question.h).attr('rx',10).attr('ry',10).attr('fill','#fcfcfd').attr('stroke',topic.color).attr('stroke-opacity',.42);
      q.append('circle').attr('cx',16).attr('cy',question.h/2).attr('r',3.5).attr('fill',topic.color);
      const label=q.append('text').attr('x',29).attr('y',question.lines.length===1?question.h/2+4:18);
      label.selectAll('tspan.line').data(question.lines).join('tspan').attr('class','line').attr('x',29).attr('dy',(_,i)=>i?18:0).each(function(line){renderLine(d3.select(this),line,question.terms)});
    });
  });
}
draw();
</script>
</body>
</html>
