<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算子知识网络 · 15 次对话</title>
<style>
  :root{
    --bg:#F4F5F7; --panel:#fff; --ink:#1B1F26; --ink-2:#4A5260; --ink-3:#8A929F;
    --line:#E6E8EC; --accent:#2E6BE6; --radius:14px;
    --graph-bg:#0E1117;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}

  /* ---- top bar ---- */
  .topbar{height:60px;display:flex;align-items:center;gap:18px;padding:0 22px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    position:relative;z-index:30}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand span{font-size:12px;color:var(--ink-3)}
  .stats{display:flex;gap:14px;margin-left:26px;padding-left:22px;border-left:1px solid var(--line)}
  .stat{font-size:12px;color:var(--ink-3);display:flex;align-items:baseline;gap:4px}
  .stat i{font-style:normal;font-weight:700;color:var(--ink);font-size:14px}
  .spacer{flex:1}
  .tabs{display:flex;background:#EDEFF3;border-radius:10px;padding:3px}
  .tabs button{border:0;background:transparent;color:var(--ink-2);font-size:12.5px;padding:6px 14px;border-radius:8px;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

  /* ---- layout ---- */
  .layout{display:flex;height:calc(100vh - 60px)}
  .side{width:268px;flex:0 0 268px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  .side-head{padding:16px 16px 8px}
  .side-head h2{margin:0 0 3px;font-size:13px;letter-spacing:.4px;color:var(--ink-2);font-weight:600}
  .side-head p{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.6}
  .search{padding:8px 14px 10px}
  .search input{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 11px;
    font-size:12.5px;outline:none;background:#FAFBFC;color:var(--ink)}
  .search input:focus{border-color:#B9CCF7;background:#fff}
  .dlg-list{flex:1;overflow-y:auto;padding:0 10px 18px;
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 22px),transparent 100%);
            mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 22px),transparent 100%)}
  .dlg{padding:9px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;
    border-left:3px solid transparent;margin-bottom:2px}
  .dlg:hover{background:#F4F6FA}
  .dlg.on{background:#EDF2FE;border-color:#C9DAFB;border-left-color:var(--accent)}
  .dlg .no{flex:0 0 22px;height:22px;border-radius:6px;background:#EDEFF3;color:var(--ink-2);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .dlg.on .no{background:var(--accent);color:#fff}
  .dlg .t{font-size:12.5px;line-height:1.45}
  .dlg .m{font-size:10.5px;color:var(--ink-3);margin-top:2px}
  .domains{padding:10px 14px 16px;border-top:1px solid var(--line)}
  .domains h3{margin:0 0 8px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.5px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;
    border-radius:20px;padding:3.5px 9px;font-size:11px;color:var(--ink-2);cursor:pointer}
  .chip .dot{width:7px;height:7px;border-radius:50%}
  .chip.on{background:#EDF2FE;border-color:#C9DAFB;color:var(--ink);font-weight:600}

  /* ---- graph stage ---- */
  .stage{flex:1;position:relative;background:radial-gradient(circle at 50% 45%, #151A23 0%, #0E1117 62%, #0B0E13 100%);overflow:hidden;
    transition:margin-right .26s cubic-bezier(.22,.8,.3,1)}
  body.drawer-open .stage{margin-right:392px}
  #graph{width:100%;height:100%;display:block;cursor:grab}
  #graph.dragging{cursor:grabbing}

  .nd{cursor:pointer}
  .nd .dot{transition:r .15s, filter .15s}
  .nd .lbl{font-size:9.6px;fill:#C3CCDA;pointer-events:none;paint-order:stroke;
    stroke:#0E1117;stroke-width:2.6px;stroke-linejoin:round}
  .nd .dlbl{font-size:9.4px;fill:#AFBCCE;font-weight:500}
  .nd.d .ring{fill:rgba(255,255,255,.03);stroke:#CBD5E1;stroke-width:1.3}
  .nd:hover .dot{filter:brightness(1.25)}
  .nd:hover .ring{stroke:#fff}
  .lk{stroke:#8FA3BF;stroke-width:.9;opacity:.14;transition:opacity .15s}
  .lk.dc{stroke-dasharray:2 3;opacity:.08;stroke-width:.9}

  /* 聚焦态 */
  svg.focus .nd{opacity:.14}
  svg.focus .nd.hot, svg.focus .nd.nbr{opacity:1}
  svg.focus .lk{opacity:.03}
  svg.focus .lk.hot{opacity:.75;stroke:#DDE6F5}

  .hud{position:absolute;left:16px;bottom:14px;font-size:11px;color:#8B96A8;pointer-events:none;line-height:1.7}
  .hud b{color:#C9D3E1;font-weight:600}
  .ctrl{position:absolute;right:16px;top:14px;display:flex;gap:6px}
  .ctrl button{height:28px;padding:0 11px;border-radius:8px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);color:#C9D3E1;font-size:11.5px;cursor:pointer;backdrop-filter:blur(6px)}
  .ctrl button:hover{background:rgba(255,255,255,.1)}
  .ctrl button.on{background:rgba(124,155,255,.22);border-color:rgba(124,155,255,.45);color:#E6ECFA}
  .zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
  .zoom button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);color:#C9D3E1;font-size:15px;cursor:pointer;line-height:1}
  .zoom button:hover{background:rgba(255,255,255,.1)}

  /* ---- matrix ---- */
  .matrix{position:absolute;inset:14px;overflow:auto;background:#fff;border-radius:12px;display:block}
  .matrix.hidden{display:none}
  .matrix table{border-collapse:separate;border-spacing:0;font-size:11.5px;width:100%}
  .matrix th,.matrix td{padding:6px 8px;text-align:center;border-bottom:1px solid #F0F2F5;
    border-right:1px solid #F5F6F9;height:26px}
  .matrix thead th{position:sticky;top:0;background:#FAFBFC;z-index:2;font-weight:600;color:var(--ink-2)}
  .matrix tbody th{text-align:left;font-weight:400;color:var(--ink-2);white-space:nowrap;
    position:sticky;left:0;background:#fff;border-right:1px solid #EDEFF3}
  .matrix td.cell{cursor:pointer;border-radius:5px;font-variant-numeric:tabular-nums}
  .matrix td.cell:hover{outline:1.5px solid #9DB7F0}
  .matrix .tot{color:var(--ink-3)}

  /* ---- drawer ---- */
  #drawer{position:fixed;top:60px;right:0;bottom:0;width:392px;max-width:92vw;background:#fff;
    border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(16,24,40,.10);
    transform:translateX(102%);transition:transform .26s cubic-bezier(.22,.8,.3,1);z-index:40;
    display:flex;flex-direction:column}
  #drawer.open{transform:none}
  .dw-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);position:relative}
  .dw-bar{width:30px;height:4px;border-radius:3px;margin-bottom:10px}
  .dw-head h2{margin:0;font-size:17px;letter-spacing:.2px}
  .dw-head .kicker{font-size:11px;color:var(--ink-3);margin-bottom:6px}
  .dw-close{position:absolute;right:14px;top:14px;width:28px;height:28px;border:1px solid var(--line);
    background:#fff;border-radius:8px;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1}
  .dw-body{flex:1;overflow-y:auto;padding:16px 20px 28px}
  .dw-body h4{margin:18px 0 8px;font-size:11px;color:var(--ink-3);letter-spacing:.6px;font-weight:600}
  .dw-body h4:first-child{margin-top:0}
  .dw-def{font-size:13px;line-height:1.75}
  .dw-pit{margin-top:12px;background:#FFF8F0;border:1px solid #F8DFC0;border-radius:10px;
    padding:10px 12px;font-size:12.5px;line-height:1.7;color:#7A4A12}
  .dw-quote{margin-top:12px;border-left:3px solid #D5DCE8;padding:2px 0 2px 12px;
    font-size:12.5px;line-height:1.7;color:var(--ink-2)}
  .dw-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
    border-radius:8px;padding:5px 9px;font-size:11.5px;margin:0 5px 5px 0;cursor:pointer;color:var(--ink-2)}
  .dw-chip:hover{background:#F4F6FA}
  .dw-chip .n{font-weight:700;color:var(--accent);font-size:11px}
  .dw-sect{font-size:12px;line-height:1.8;color:var(--ink-2)}
  .ex-title{margin:10px 0 5px;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .ex-title:first-of-type{margin-top:2px}
  .ex{margin-top:2px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .ex-row{display:flex;gap:10px;padding:10px 12px;font-size:12.5px;line-height:1.78;color:var(--ink)}
  .ex-row + .ex-row{border-top:1px solid #F1F3F7;background:#FBFCFE}
  .who{flex:0 0 32px;height:20px;border-radius:6px;background:#EEF1F6;color:var(--ink-2);
    font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .who.a{background:#E8EFFD;color:#2E5FD0}
  .txt{flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>算子知识网络</b><span>15 次 AI 对话 · 知识点与关联</span></div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="tabs">
    <button data-view="map" class="on">网络图</button>
    <button data-view="matrix">覆盖矩阵</button>
  </div>
</header>

<main class="layout">
  <aside class="side">
    <div class="side-head">
      <h2>15 段对话</h2>
      <p>点一段，看它在网络里点亮哪一片</p>
    </div>
    <div class="search"><input id="q" placeholder="搜索知识点，如：对齐 / 同步 / 精度"></div>
    <div class="dlg-list" id="dlgList"></div>
    <div class="domains">
      <h3>知识域</h3>
      <div class="chips" id="domList"></div>
    </div>
  </aside>

  <section class="stage">
    <svg id="graph" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet">
      <g id="viewport">
        <g id="links"></g>
        <g id="nodes"></g>
      </g>
    </svg>

    <div class="ctrl">
      <button id="btnRelayout">重排</button>
      <button id="btnLabels" class="on">标签</button>
      <button id="btnReset">重置视图</button>
    </div>
    <div class="zoom">
      <button id="zIn">+</button>
      <button id="zOut">−</button>
    </div>

    <div class="matrix hidden" id="matrix"></div>

    <div class="hud" id="hud">
      <b>●</b> 知识点（颜色 = 知识域）　<b>○</b> 对话（他的处境）<br>
      拖拽节点可以拉散，滚轮缩放，点空白处复位高亮
    </div>
  </section>
</main>

<aside id="drawer">
  <div class="dw-head">
    <button class="dw-close" id="dwClose">×</button>
    <div class="dw-bar" id="dwBar"></div>
    <div class="kicker" id="dwKicker"></div>
    <h2 id="dwTitle"></h2>
  </div>
  <div class="dw-body" id="dwBody"></div>
</aside>

<script>
/* ============ 数据 ============ */
const DOMAINS = [{id: "env", name: "环境与运行时", color: "#7C9BFF"}, {id: "build", name: "编译与工程", color: "#F2B45C"}, {id: "data", name: "数据与搬运", color: "#2DD4BF"}, {id: "sync", name: "并发与同步", color: "#A78BFA"}, {id: "num", name: "精度与数值", color: "#F472B6"}, {id: "perf", name: "性能与调优", color: "#34D399"}, {id: "arch", name: "架构与模型", color: "#94A3B8"}, {id: "ext", name: "扩展与迁移", color: "#38BDF8"}, {id: "deploy", name: "部署与交付", color: "#FB923C"}];

const DIALOGUES = [{n: 1, t: "容器里看不到卡", s: "环境", sum: "接手别人的机器，npu-smi 报 DCMI 初始化失败", short: "看不到卡", opening: "接了图像组的预处理项目，机器是上一任留下的，8 卡 910B。CANN 我重装了一遍，npu-smi info 还是报： 是不是得重装系统？", openingA: "先别重装，这个报错我也见过不少次，八成不是系统坏了，而是设备管理通道（DCMI）没起来。 dcmi module initialize failed 的字面意思是：npu-smi 想通过 DCMI 接口去问驱动\"这台机器上有几张卡\"，但驱动那一侧没有响应。"}, {n: 2, t: "Tiling 怎么设计", s: "方法论", sum: "shape 变化大，每个都要重调 tiling", short: "Tiling 设计", opening: "接了个模型，batch 从 1 到 64，seq 从 128 到 8192。现在每个 shape 都要重调一遍 tiling，基本靠试，试到不崩、不慢为止。这个有没有方法，还是只能这样？", openingA: "有方法，而且\"靠试\"通常是因为把三件事混在一起试了。 Tiling 本质上是三个独立的决策，按顺序做，每个都有明确约束： 大部分人\"试\"的时候，是在同时调这三个，所以看不出哪个变量在起作用。先把 ① 定死，再调 ②，最后调 ③，会快很多。"}, {n: 3, t: "换了镜像编译不过", s: "编译", sum: "kernel_operator.h 找不到，链接又报符号未定义", short: "编译报错", opening: "新项目的镜像，msopgen gen 生成工程，bash build.sh 报：", openingA: "这个错很典型，先看一个变量： 如果它是空的，答案就有了——编译器的头文件搜索路径没建立。"}, {n: 4, t: "1000 个元素全 0", s: "功能", sum: "1024 正常、1000 全 0，静默错误", short: "全 0", opening: "{1,1024} fp16 结果全对，{1,1000} 输出全 0。不报错，不崩。", openingA: "先把两个数算出来： 1024 × 2 字节 = 2048，是 32 的整数倍（2048 / 32 = 64） 1000 × 2 字节 = 2000，不是 32 的整数倍（2000 / 32 = 62.5） 这不是巧合。"}, {n: 5, t: "API 到底分几层", s: "概念", sum: "基础 API / 高阶 API / 语言扩展分不清", short: "分不清 API", opening: "看文档的时候一会儿基础 API，一会儿高阶 API，还有语言扩展层、框架接口。这几个到底是什么关系？我该从哪一层开始写？", openingA: "四层，从\"最贴近硬件\"到\"最贴近业务\"，越往上越好用、越往下越可控： 一条经验：能用上层就别下沉。高阶 API 是\"别人已经调优过的实现\"，你手写大概率不会更快，但一定会更容易出错。"}, {n: 6, t: "多核偶发错", s: "并发", sum: "ReduceSum 八核，结果时对时错", short: "偶发错", opening: "blockDim=8，结果偶发错，错的位置还不固定。重跑有时候全对。", openingA: "这个现象——偶发 + 位置不固定——基本可以排除\"算法写错\"（算法错会稳定复现），指向竞争类问题。 按概率排，三类： 切分错误：相邻核的区间重叠或漏算（这类通常是稳定错，但你如果同时有下面的问题，就会看起来随机）； 同步缺失：部分和写进 workspace，还没写完就有核去读；"}, {n: 7, t: "Softmax 精度差一点", s: "精度", sum: "fp16 MARE 3.2e-3，fp32 完全过", short: "精度差", opening: "Softmax fp16，MARE 3.2e-3，验收线 1e-3。fp32 就完全过。", openingA: "先给结论：这不是算法错，是数值精度问题。判断依据就是你说的那句\"fp32 完全过\"——同一个算法，换精度就过，说明逻辑链路是对的，误差来自数值表示和运算顺序。"}, {n: 8, t: "动态 shape 怎么支持", s: "工程", sum: "输入长度不固定，tiling 是写死的", short: "shape 不固定", opening: "模型输入长度不固定，seq 从 128 到 4096 都有。我现在的 tiling 是按固定 shape 写死的，换个 shape 就错。动态 shape 到底该怎么支持？", openingA: "先说一个容易误解的点：动态 shape 不是\"kernel 支持变长\"。 kernel 本身不知道 shape，它只知道 tiling 参数——perCore、tileLen、tileNum。"}, {n: 9, t: "存量 kernel 的 SetFlag", s: "代码", sum: "接手代码，手写同步能不能删", short: "手写同步", opening: "接手一段代码，CopyIn 和 Compute 之间手写了 SetFlag/WaitFlag。文档里说 EnQue/DeQue 已经做同步了，这段是不是可以删？", openingA: "先别删，这里有个关键分叉：buffer 是从 TQue 拿的，还是从 TBuf 拿的？ 这两种情况的答案完全相反： TQue 是\"带同步语义的队列\"，TBuf 是\"裸内存\"。很多人以为名字里都有 buffer 就差不多，其实前者帮你管了事件，后者什么都没管。"}, {n: 10, t: "带宽只有 30%", s: "性能", sum: "mte2 18% / vec 60%，判读不出瓶颈", short: "带宽低", opening: "elementwise 算子，实测带宽只有理论值 30%。mte2_ratio 18%、vec_ratio 60%。这算搬运瓶颈还是计算瓶颈？", openingA: "先纠正一个很常见的误读：mte2_ratio 低，不等于\"搬运不是瓶颈\"。 这个指标的含义是\"搬运单元在采样窗口里有百分之多少的时间是忙的\"。它低，只能说明搬运单元大部分时间在空闲——但空闲的原因可能是： 没有数据可搬（上游没喂上，比如计算太慢）；"}, {n: 11, t: "算子融合能救多少", s: "架构", sum: "单算子都调好，整网还是慢", short: "整网变慢", opening: "单算子我都调过了，每个看着都还行。但整网还是慢，同事说要做算子融合。融合到底能救多少？值不值得投入？", openingA: "能救多少，取决于你的瓶颈在哪。先把融合的收益拆开，你才能判断值不值： 判断方法很简单：算一下\"融合能省掉多少次 GM 读写\"。 比如 LayerNorm → Gelu → Add： 理论上省掉 2/3 的访存。如果你的算子链是 memory bound，收益就接近这个数；"}, {n: 12, t: "搬 CUDA LayerNorm", s: "迁移", sum: "线程模型对不上，怎么映射", short: "搬 LayerNorm", opening: "老模型要迁，里面有我之前写的 CUDA LayerNorm：block 内 blockReduce，__syncthreads 很密。想直接搬过来。", openingA: "先给结论：别逐行翻译，按数据流重写。CUDA 的并行是\"线程级\"，Ascend C 是\"核 + 指令级\"，没有一一对应关系，硬翻译会得到一份能跑但很慢的代码。"}, {n: 13, t: "Python 里调不到", s: "部署", sum: "算子装了，dispatcher 报 PrivateUse1", short: "上线调不到", opening: "算子都过了，接进推理服务，Python 里报： config.ini 里有我的 vendor，nm -D 也能找到符号。那是框架的问题？", openingA: "你这个排查已经把\"算子包\"这一层排掉了，方向是对的。这个报错来自 PyTorch 的 dispatcher，含义很具体： \"这个算子名我认识，但没有注册在当前 backend（PrivateUse1，也就是昇腾私有后端）的实现表里。"}, {n: 14, t: "fp16/bf16/fp32 怎么选", s: "数值", sum: "怕精度不够，又怕性能掉了", short: "精度选型", opening: "一直不太确定，我的算子该用 fp16 还是 fp32。用 fp32 怕慢，用 fp16 怕精度不够。有没有判断标准？", openingA: "有三个维度，按顺序判断，基本能定下来： 先看三种格式的差别： 一句话选型：范围不够用 bf16，精度不够用 fp32，都不缺用 fp16。"}, {n: 15, t: "评审被问住", s: "原理", sum: "为什么不能像 CUDA 一个 kernel 搞定", short: "架构评审", opening: "方案评审被问\"为什么非要 host tiling + kernel 两段，不能像 CUDA 一样一个 kernel 里切分\"。我当时答\"文档就这么写的\"，被追问就没词了。", openingA: "这个问题确实值得答清楚，因为它是编程模型层面的差异，不是风格问题。 核心原因三条，每条都是硬约束： 1. AI Core 没有线程抽象，不能动态扩并行。 CUDA 里你在 kernel 里 if (threadIdx.x < n) 就能控制并行度，因为线程数是启动参数，block 内部还能再分层。"}];

const NODES = [{id: "n1", name: "驱动固件配套", dom: "env", refs: [1], def: "驱动与固件必须同版本配套，错位往往只在重负载时才暴露。", pit: "Health 显示 Warning 不是装饰，它经常伪装成“算子写错了”。", q: "能查到卡、能跑小算子，一上重负载就超时。", exs: [{d: 1, q: "能看到了。但 Health 是 Warning，驱动版本和板卡 Firmware 版本不一样。这个 Warning 我之前一直没管，会有事吗？", a: "会有事，而且这类问题最难查，因为它不立刻报错。 驱动和固件是配套发布的：驱动（内核态）和固件（跑在设备上的那层）之间有一套私有协议，版本错位时协议对不上，表现通常是\"能查到卡、能跑小算子、一到重负载就超时、或者偶发设备侧异常\"。你很难第一眼把它和\"版本不配套\"联系起来，反而会去怀疑自己的 kernel 写错了。"}]}, {id: "n2", name: "容器设备映射", dom: "env", refs: [1], def: "四个设备节点必须由 docker run 映射进来，容器里不会自动出现。", pit: "--privileged 只放开权限，不会凭空产生设备节点。", q: "我 --privileged 是不是就够了？", exs: [{d: 1, q: "两个都空。/dev 下一个都没有，lsmod 也没输出。那我是不是驱动没装？我直接在容器里装一遍驱动行不行？", a: "先回答你最后那个问题：不行，容器里装不了驱动。 原因不难理解：驱动是内核态模块（.ko），它必须加载到宿主机的内核里，而容器共享宿主内核——容器里既没有加载模块的权限，也没有对应的内核头文件。你在容器里跑 insmod 或装 .run 包，通常会看到 Operation not permitted 或者干脆没有 /lib/modules 目录。这不是权限没给够，是模型上就不成立。"}]}, {id: "n3", name: "管理面与算力面", dom: "env", refs: [1], def: "davinci_manager 管查询复位，davinci0 才是真正跑算子的设备。", pit: "缺 manager 时报的是“管理接口初始化失败”，极易误判成环境装坏。", q: "这个 manager 是干嘛的？跟 davinci0 有什么区别？", exs: [{d: 1, q: "加了，报 open /dev/davinci_manager: Permission denied。另外这个 manager 是干嘛的？跟 davinci0 有什么区别？", a: "先说权限，再说它是干嘛的。 权限问题：这些设备节点的属组是 HwHiAiUser（有的环境是 HwHiAiUser 加 root），权限位一般是 crw-rw----。容器里默认是 root 用户，理论上能读写，但如果镜像里跑的是普通用户，就会撞上 Permission denied。"}]}, {id: "n4", name: "设备节点权限", dom: "env", refs: [1], def: "设备节点属 HwHiAiUser 组，容器用户不在组里就只剩 root 能用。", pit: "--group-add 要用组 ID，容器里往往没有这个组名。", q: "报 open /dev/davinci_manager: Permission denied", exs: [{d: 1, q: "加了，报 open /dev/davinci_manager: Permission denied。另外这个 manager 是干嘛的？跟 davinci0 有什么区别？", a: "先说权限，再说它是干嘛的。 权限问题：这些设备节点的属组是 HwHiAiUser（有的环境是 HwHiAiUser 加 root），权限位一般是 crw-rw----。容器里默认是 root 用户，理论上能读写，但如果镜像里跑的是普通用户，就会撞上 Permission denied。"}]}, {id: "n5", name: "日志体系", dom: "env", refs: [1, 13], def: "plog 记 host 侧，AI Core 的崩溃在 device 侧，要用 msnpureport 导。", pit: "只翻 /var/log 找不到 kernel 崩溃，是因为找错了地方。", q: "那一堆 ascend 日志是干嘛的？我一直没敢删。", exs: [{d: 1, q: "行。对了，/var/log 下面那一堆 ascend 的日志是干嘛的？我一直没敢删。", a: "那是 plog，CANN 的 host 侧运行日志，可以删，但建议先别删——它是排障时最直接的一手材料。 几个关键点： 它记什么：ACL 初始化、device 打开、内存分配、算子下发、stream 同步这些 host 侧动作，以及 runtime 的错误码。你之前那些 aclrtMalloc failed、初始化 device 失败，答案基本都在这。 它不记什么：设备内部（AI Core）发生了什么。"}, {d: 13, q: "跑通了。但偶发报设备侧异常，日志里有个 507015。是不是我 workspace 释放早了？", a: "有可能，但先别急着改，先拿证据。 507015 这类错误是设备侧的 AI Core 异常（trap），常见原因四类，按概率排： 你说的\"偶发\"确实更像第 4 类，但也可能是越界刚好踩到边界。先导日志： 导出来看 device-0/ 下的日志，找 trap 之前的最后几条，以及访问的地址和长度。"}]}, {id: "n6", name: "环境体检与 CI", dom: "env", refs: [1], def: "按依赖顺序查：设备 → 环境变量 → OPP → 编译器，失败即退出。", pit: "顺序错了就会一直在“装没装坏”上绕圈。", q: "有没有一条命令能告诉我环境哪里不对？", exs: [{d: 1, q: "那这些东西我每次都得手动查一遍？有没有个脚本。", a: "可以封一个，关键是按依赖顺序查，失败就退出——顺序错了就会在\"装没装坏\"上绕圈。 为什么顺序是这样：设备 → 健康 → 环境变量 → OPP → 驱动 → 编译器。前两步不通，后面全是白搭；环境变量不通，编译器一定找不到头文件。按这个顺序走，第一个 FAIL 就是根因，不用往下猜。"}]}, {id: "n7", name: "两套编译器", dom: "build", refs: [3], def: "op_kernel 走 ccec、op_host 走 g++，两套 ISA 两套 ABI。", pit: "kernel 文件放错目标，语法能过、符号找不到。", q: "为什么不能像 CUDA 一样一个 nvcc 全编了？", exs: [{d: 3, q: "改回来变 undefined reference to 'AscendC::...' 了。这跟前面那个有关系吗？", a: "有间接关系，但不是同一个问题——你现在从\"编译期\"走到了\"链接期\"，这说明头文件找到了、语法过了，但符号没生成或者没链接上。 undefined reference 的典型原因：kernel 源码被当成普通 C++ 编了。"}]}, {id: "n8", name: "环境变量继承", dom: "build", refs: [3], def: "source 只影响当前 shell，编译起的子进程不一定继承。", pit: "把 include 写死成绝对路径能编过，但换机器就废。", q: "我明明 source 过了，怎么还是空？", exs: [{d: 3, q: "好。不过我先干了个事：把 include 改成绝对路径了，能编过。这样行吗？", a: "能编过，但建议改回去，这是个会给自己埋雷的做法。 绝对路径的问题不在\"现在能不能跑\"，而在： 换机器就废：CANN 装在 /usr/local/Ascend 是默认，但不是必然，容器里可能在 /home/xxx/Ascend； 换版本就废：不同 CANN 版本的头文件路径结构会调整； 团队协作失效：你的路径别人没有，代码一提交，别人全编不过；"}]}, {id: "n9", name: "算子名全局唯一", dom: "build", refs: [3], def: "算子类型名是全局注册键，重名会被覆盖或查到内置实现。", pit: "改名前记得三处一致：REG_OP、aclnn 接口、Python 封装。", q: "我算子叫 AddCustom，会跟内置 Add 撞吗？", exs: [{d: 3, q: "编过了。顺嘴问一句，我算子叫 AddCustom，会不会跟内置 Add 撞？", a: "AddCustom 和 Add 不撞，但这个问题问得对——算子类型名是全局唯一的注册键，撞了是真会出事的。 撞了会怎样，比报错更麻烦： 注册被覆盖：后注册的赢，你以为在跑自己的实现，其实是别人的； 运行时查到内置实现：aclnn 或图引擎按名字找算子，找到的是内置那个，你的自定义实现永远不会被调用； 现象：结果\"看起来对\"（因为内置也是对的），但你改的代码没生效，白白 debug 半天。"}]}, {id: "n10", name: "OPP 安装路径", dom: "build", refs: [3, 13], def: "run 包默认装到用户目录，和 ASCEND_OPP_PATH 常常不是一个地方。", pit: "装完必须重新 source，环境变量里缓存了路径。", q: "vendors 下没有我装的那个。", exs: [{d: 3, q: "没有。", a: "那基本可以确定是\"装到别处去了\"。 .run 包的默认行为是装到当前用户目录（~/Ascend/...），而你的 ASCEND_OPP_PATH 通常指向 /usr/local/Ascend/...——两个路径看起来很像，其实不是一个地方。很多人第一次装完就懵在这。 明确指定路径重装： 装完必须重新 source，因为环境变量里缓存了路径。然后验证： 还有一个容器场景的坑：在容器里装、在宿主机上用（或者反过来）。"}, {d: 13, q: "找到了，访问长度比我分配的多了 128 字节。是我 tiling 里算错了。", a: "那就对上了——不是 workspace 释放问题，是 tiling 算错了长度。 这类\"多 128 字节\"特别典型，通常是： 尾块按 tileLen 算，而不是按 realLen； 对齐时向上取整，但没做边界检查； blockNum × perCore 超过了 total。 修完之后建议加一道运行时断言，把这类问题挡在执行前："}]}, {id: "n11", name: "直调调试", dom: "build", refs: [3], def: "用 <<<>>> 直接调 kernel，跳过算子包安装这一整套。", pit: "直调对、打包偏，多半是 tiling 参数不一致。", q: "每次改一行都要重新安装，能不能不装直接跑？", exs: [{d: 3, q: "每次改一行都要重装一遍，太烦了。能不能不装直接跑？", a: "能，而且这是我更推荐的工作流——先用直调跑通逻辑，再打包成算子包。 直调（direct launch）的意思是：写一个普通的 main.cpp，像 CUDA 那样用 <<<>>> 直接调 kernel，完全跳过算子原型、tiling 注册、OPP 安装这一整套。 好处： 一次编译一次运行，几秒钟一轮，不用等打包安装； 可以开 CPU 调试（ASCENDC_CPU_DEBUG），先在仿真上跑逻辑；"}]}, {id: "n12", name: "六步开发链路", dom: "build", refs: [3], def: "原型 → tiling → kernel → 编译 → 打包 → 调用，每步都有可验证的产物。", pit: "不知道卡在哪一步，就会反复怀疑环境。", q: "给我一条完整链路吧，我老不知道下一步该干嘛。", exs: [{d: 3, q: "行，我先把这六步记下来。", a: "给你一条完整的链路，以后照着走，每一步都有\"可验证的产物\"： 每步的\"检查点\"： 口诀：头文件找不到看环境变量，符号找不到看 CMake，装完找不到看 config.ini，结果不对看 tiling。 ---"}]}, {id: "n13", name: "32B 对齐", dom: "data", refs: [4, 12], def: "DMA 按 32 字节的块搬运，非对齐会截断或越界，而且不报错。", pit: "2000 是偶数，但不是 32 的倍数——偶数和倍数不是一回事。", q: "2000 不是偶数吗？偶数也不行？", exs: [{d: 4, q: "2000 不是偶数吗？偶数也不行？", a: "不行，这里的单位是字节，要求是\"32 的倍数\"，不是\"2 的倍数\"。 2000 是偶数，说明它能被 2 整除，但它除以 32 余 16。硬件发起 DMA 时按\"块\"走，块大小是 32 字节，所以它只能搬 62 块（1984 字节）或者 63 块（2016 字节），前者少了 16 字节，后者多了 16 字节。 这也解释了为什么你会看到\"全 0\"而不是\"错一点点\"：少搬的那部分，UB 里是未初始化的值；"}, {d: 12, q: "行，我整理了一份 checklist，回头贴文档里。", a: "给你一版可以直接用的，八条： 其中 ③ 和 ④ 最容易出错，因为它们不报错，只是错。建议在 code review 时专门过这两条。 ---"}]}, {id: "n14", name: "DataCopyPad", dom: "data", refs: [4, 12], def: "把“搬多少字节”和“真实多长”分开，自动处理非对齐。", pit: "blockLen 填的是字节数，不是元素个数。", q: "是不是所有地方都换成 Pad 就行？", exs: [{d: 4, q: "那改 DataCopyPad。是不是所有地方都换成 Pad 就行？", a: "搬运层可以全换，但计算层不能跟着全换，这是两件事。 先看写法： 注意两个细节： blockLen 是字节数，不是元素数。传错了会搬多或搬少。 isPad = true 时，补的位置用 paddingValue 填；isPad = false 时由框架决定（通常是补第一个元素的值，或者随机值，取决于有没有 left/right padding）。归约类算子绝对不能依赖默认填充值，因为它是不可控的。"}, {d: 12, q: "老模型要迁，里面有我之前写的 CUDA LayerNorm：block 内 blockReduce，__syncthreads 很密。想直接搬过来。", a: "先给结论：别逐行翻译，按数据流重写。CUDA 的并行是\"线程级\"，Ascend C 是\"核 + 指令级\"，没有一一对应关系，硬翻译会得到一份能跑但很慢的代码。 映射关系先建立起来： 最重要的一条：CUDA 里你操心\"哪个线程算哪个元素\"，Ascend C 里你操心\"哪个核处理哪块数据，块内怎么用向量指令铺开\"。抽象层级变了。"}]}, {id: "n15", name: "尾块与 mask", dom: "data", refs: [4, 12, 8], def: "Pad 管“搬多少”，mask 管“算多少”，归约不能被填充值污染。", pit: "逐元素算子可以不管，归约类必须管。", q: "多搬进来的 24 个参与计算怎么办？", exs: [{d: 4, q: "搬 1000 个可能实际搬了 1024 个，多出来的 24 个参与计算怎么办？", a: "这是关键问题，分两类处理： 逐元素算子（scale、add、relu、sigmoid）： 多算几个位置无所谓，只要满足两个条件—— 这些位置的输入不是脏数据（Pad 已经用固定值填了，所以是安全的）； 输出按真实长度写回，多余部分不要落盘（CopyOut 时用真实 len）。 所以逐元素算子只需要改搬运，计算逻辑完全不用动。"}]}, {id: "n16", name: "越界哨兵", dom: "data", refs: [4], def: "输出前后各留 64 字节填魔数，跑完检查有没有被改。", pit: "别用 0 当魔数，它本身就是最常见的数据。", q: "怎么确认写回没踩到别人？", exs: [{d: 4, q: "还有个事我先不问性能了——我怎么确认写回没踩到别人？", a: "用哨兵值（canary），这是最便宜也最直接的办法。 思路：在输出 tensor 的前后各留一段\"不该被写\"的内存，填上一个特殊值，跑完检查它有没有变。"}]}, {id: "n17", name: "仿真 vs 真机", dom: "data", refs: [4], def: "仿真验逻辑，真机验对齐、容量、同步这些硬件约束。", pit: "仿真过、真机挂，先查对齐和容量，别改算法。", q: "CPU 调试是对的，一上板就全 0。", exs: [{d: 4, q: "改完哨兵没动了。不过我发现一个怪事：CPU 调试里 1000 一直是对的。", a: "这个不怪，是两类验证的边界不同。 CPU 调试（仿真）：模拟器逐字节搬，它不模拟 DMA 的 32 字节块约束，所以你写 2000 字节它就老老实实搬 2000 字节，看起来一切正常。 真机：DMA 按块发起，2000 字节只能搬 62 块或者 63 块，多出来或少掉的部分就出问题。 所以正确的理解是： 仿真过、真机挂，优先怀疑对齐和容量，不要去改算法。反过来，真机过、仿真挂，那才是逻辑有问题。"}]}, {id: "n18", name: "NHWC 与 stride", dom: "data", refs: [13, 12], def: "布局不同会让整块数据错位，结果看起来“差不多对但有偏差”。", pit: "全 1、全 0、单个 1，这三种输入比随机数好用。", q: "全 1 也对不上，是格式问题？", exs: [{d: 13, q: "明白了。那我改完之后和 PyTorch 对不上，差了 1e-3。", a: "先排语义，再排数值——顺序反了会浪费很多时间。 语义层（先查）： 数值层（后查）：累加顺序、Cast 的 RoundMode、eps。 验证技巧：用三组特殊输入跑一遍，比随机数好用得多： 随机数的问题是\"错了也看不出错在哪\"，这三种输入能把错误模式放大。"}]}, {id: "n19", name: "TQue vs TBuf", dom: "sync", refs: [9, 5], def: "TQue 带同步语义，TBuf 是裸内存，同步责任在你身上。", pit: "名字都带 buffer，但一个管事件，一个什么都不管。", q: "这段手写的 SetFlag 能不能删？", exs: [{d: 9, q: "接手一段代码，CopyIn 和 Compute 之间手写了 SetFlag/WaitFlag。文档里说 EnQue/DeQue 已经做同步了，这段是不是可以删？", a: "先别删，这里有个关键分叉：buffer 是从 TQue 拿的，还是从 TBuf 拿的？ 这两种情况的答案完全相反： TQue 是\"带同步语义的队列\"，TBuf 是\"裸内存\"。很多人以为名字里都有 buffer 就差不多，其实前者帮你管了事件，后者什么都没管。"}, {d: 5, q: "那 TQue 和 TBuf 属于哪一层？", a: "属于基础 API 的 Memory 类，但它们是\"管理方式\"，不是\"搬运操作\"。 三者的关系： 选型建议：默认用 TQue，需要复用同一块内存做中间计算时用 TBuf。用 TBuf 就要自己负责同步，这一点前面聊过。"}]}, {id: "n20", name: "EnQue/DeQue", dom: "sync", refs: [9], def: "在搬运与计算之间插一对 set/wait 事件，保证顺序。", pit: "它同步的是事件，不是内存屏障，不保证 cache 一致。", q: "EnQue 底层到底做了什么？", exs: [{d: 9, q: "说实话我一直不太理解，为什么 Ascend 要搞这么多同步原语？CUDA 里一个 __syncthreads 就完了。", a: "因为两者的并行模型不一样，不是设计者故意复杂。 CUDA 的 __syncthreads() 是线程级屏障：一个 block 里的所有线程到齐，再一起往下走。它背后假设的是\"同一时刻只有一段代码在跑，只是有很多线程\"。 Ascend 的 AI Core 里，实际在并行的是几条独立的流水： 它们各有各的指令队列，互相之间只靠\"事件\"通信。"}]}, {id: "n21", name: "Barrier vs Flag", dom: "sync", refs: [9], def: "同一 pipe 内用屏障，跨 pipe 用事件；前者正确但慢。", pit: "调试期用 PIPE_ALL 求稳，优化期换成精确事件。", q: "能不能统一用 PipeBarrier？", exs: [{d: 9, q: "那 PipeBarrier 和 SetFlag 到底什么时候用哪个？", a: "一句话区分：PipeBarrier 是\"我自己这条流水里，前后别乱序\"；SetFlag 是\"我等另一条流水\"。 一个实用原则：调试阶段用 PipeBarrier<PIPE_ALL> 求稳，把功能跑对；优化阶段再换成精确的 SetFlag。因为 Barrier 是\"一刀切串行\"，正确但慢；SetFlag 是点对点，快但容易配错。"}]}, {id: "n22", name: "eventId 资源", dom: "sync", refs: [9], def: "硬件事件数量有限，框架内部也在用，撞了会互相“冒充”。", pit: "症状是偶发读到旧数据，改一行无关代码就好或更差。", q: "我这段用了 0 到 3，会撞吗？", exs: [{d: 9, q: "eventId 有多少个？我这段代码用了 0 到 3。", a: "数量是有限的，具体几个取决于芯片和编译配置，通常是个位数。重点是：它不是\"你要多少有多少\"的资源，而且框架内部也在用。 这就是为什么手写 SetFlag 危险： 你用了 0–3，框架在某个路径上也用了 0–3，两边的 set/wait 会互相\"冒充\"； 症状是偶发读到旧数据，而且改一行无关代码（影响了调度）就\"好了\"或者\"更差\"； 这种 bug 极其难查，因为它伪装成随机故障。 所以原则是：能用队列就让队列管。"}]}, {id: "n23", name: "SyncAll 与槽位", dom: "sync", refs: [6, 9, 11], def: "所有核到齐才继续；workspace 按核独立分槽，用前清零。", pit: "有核没走到同步，就会挂死，而不是报错。", q: "我加了 SyncAll，怎么还是偶发错？", exs: [{d: 6, q: "哦，我总算明白了。改完还对吗？我加了 SyncAll() 之后更奇怪了，有时候直接挂住。", a: "挂住是个有价值的信号——它通常说明同步配对不上，而不是数据错了。 SyncAll 的语义是\"所有核都到这里，再一起往下走\"。所以它要求： 每个核都必须执行到它。如果有核走了 if 分支没进同步，其他核就会永远等； 次数要一致。循环里同步 3 次 vs 4 次，就会错位； 地址要一致。底层的跨核同步需要一个约定的通信地址，没设或者设错，各核同步的不是同一件事。 检查代码里这三处。"}, {d: 9, q: "说实话我一直不太理解，为什么 Ascend 要搞这么多同步原语？CUDA 里一个 __syncthreads 就完了。", a: "因为两者的并行模型不一样，不是设计者故意复杂。 CUDA 的 __syncthreads() 是线程级屏障：一个 block 里的所有线程到齐，再一起往下走。它背后假设的是\"同一时刻只有一段代码在跑，只是有很多线程\"。 Ascend 的 AI Core 里，实际在并行的是几条独立的流水： 它们各有各的指令队列，互相之间只靠\"事件\"通信。"}]}, {id: "n24", name: "竞争的概率性", dom: "sync", refs: [6, 9], def: "几条流水各自推进、没有全局时钟，只有时序撞上才出错。", pit: "“跑几次都过”不能算验证，要放大 shape 和核数。", q: "代码是顺序写的，为什么会偶发？", exs: [{d: 9, q: "我改了一版，同一输入跑 100 次结果一致，是不是可以了？", a: "还不够，100 次一致只能说明\"在当前的时序下没问题\"。 原因：同步类 bug 的触发依赖危险窗口，而窗口的宽度受这些因素影响： shape 大小：小 shape 流水几乎不重叠，窗口很窄； 核数：单核没有核间同步，多核才有； tile 大小：tile 越大，搬运时间越长，窗口越宽； 机器负载：空闲机器和满负载机器，调度时序不一样。 所以要把测试条件往\"更容易暴露\"的方向推："}]}, {id: "n25", name: "减 max", dom: "num", refs: [7], def: "先找 max、减掉、再 exp；既防溢出，也保住有效位。", pit: "顺序反了，减掉的是 exp 之后的最大值，已经不是 softmax。", q: "减 max 我以为只是防溢出，跟精度也有关系？", exs: [{d: 7, q: "", a: "找到了——顺序反了。 你现在是\"先 exp，再找 max，再减\"。这时候减掉的 max 是 exp 之后的最大值，而不是原始输入的最大值。数学上这已经不是标准的 softmax 了。 正确顺序是： 这样改完，你之前的 fp16 累加 fallback 才有意义——因为 exp 的输入范围被压到了 (-∞, 0]，输出在 (0, 1]，这是 fp16 表示最密的地方。"}]}, {id: "n26", name: "fp32 累加", dom: "num", refs: [7, 12, 14], def: "累加器用 fp32，存储仍保持 fp16，只转累加器不转整块。", pit: "fp16 累加会让“大数吃小数”，序列越长误差越大。", q: "为什么累加一定要用 fp32？", exs: [{d: 7, q: "Softmax fp16，MARE 3.2e-3，验收线 1e-3。fp32 就完全过。", a: "先给结论：这不是算法错，是数值精度问题。判断依据就是你说的那句\"fp32 完全过\"——同一个算法，换精度就过，说明逻辑链路是对的，误差来自数值表示和运算顺序。 fp16 只有约 3–4 位有效数字（尾数 10 位），Softmax 里恰好有三处会把它放大： 建议先做最小实验：只把 sum 改成 fp32 累加，别的都不动，看 MARE 掉到多少。这一步能告诉你误差主要来自哪里，比一次性全改更好定位。"}, {d: 14, q: "为什么累加一定要用 fp32？我用 fp16 累加，误差也没大到不能看。", a: "因为 fp16 累加的误差随长度增长，短序列看不出来，长序列会崩。 原理是\"大数吃小数\"： 序列越长，被吃掉的增量越多。1024 个元素的 sum，误差可能到 1e-2 量级。 fp32 的尾数多 13 位，同样的累加能保住更多增量。所以： 累加器：fp32（几乎无脑） 存储：fp16（省空间） 除法/开方：fp32（误差敏感） 这就是\"混合精度\"的核心：不是全局选一个精度，而是按运算类型选。"}]}, {id: "n27", name: "RoundMode", dom: "num", refs: [7], def: "fp32→fp16 用就近舍入，fp16→fp32 用 CAST_NONE。", pit: "截断带来的偏差是系统性的，误差分布会明显偏一个方向。", q: "RoundMode 选错会怎样？", exs: [{d: 7, q: "那我要是把中间量都换成 fp32，能压到多少？", a: "通常能到 1e-3 以下，具体看你的序列长度。经验上： 短序列（< 1024）：fp32 累加后一般能到 3e-4 量级； 长序列（> 4096）：还要注意累加顺序，分块归约比顺序累加稳。 但注意只转必要的中间量："}]}, {id: "n28", name: "MARE/MERE", dom: "num", refs: [7, 14], def: "一个看平均相对误差，一个看中位数，组合起来能判断误差类型。", pit: "只报一个数会误导优化方向：高+低是少数点炸了。", q: "MARE 和 MERE 到底在卡什么？", exs: [{d: 7, q: "我看报告里还有 MERE，那个也要看吗？", a: "要，而且两个数一起看才有诊断价值。 组合起来能区分三种情况： 你现在的 1.1e-3 如果 MERE 很低（比如 3e-4），说明大部分元素已经很好，只是少数点被放大——那 Epsilon 或边界处理就是重点，而不是整体提精度。"}, {d: 14, q: "那怎么判断\"精度够不够\"？有没有量化标准？", a: "三个层次： 1. 验收指标（硬标准）：MARE / MERE / RMSE Ratio 等，按算子类别查对应阈值。 2. 误差传播（软判断）：这个算子的输出会进到哪一层？如果后面是 softmax、layernorm 这类\"对输入敏感\"的操作，要求要更严。 3. 端到端（最终标准）：整网精度掉没掉。有时候单算子误差大一点，但整网看不出来；有时候单算子很好，但累积起来崩了。"}]}, {id: "n29", name: "eps 与小分母", dom: "num", refs: [7], def: "相对误差在分母很小时被放大，用 max(sum, eps) 兜底。", pit: "sum + eps 会引入系统性偏差，尤其 sum 本身很小时。", q: "误差只在输入很小那一段大。", exs: [{d: 7, q: "还有个事，我发现误差集中在输入很小那一段，大值区反而很准。", a: "这个现象很典型，是相对误差在小分母处放大。 举个例子：真实值是 1e-5，你算出来 1.1e-5，绝对误差只有 1e-6，但相对误差是 10%。MARE 是按相对误差算的，所以这些点会显著拉高指标。 两个处理方式： 1. 分母加 epsilon 但要注意：如果 sum 本身很小，1e-6 就不\"小\"了，会引入系统性偏差。"}]}, {id: "n30", name: "分段调试", dom: "num", refs: [7], def: "每一步打出来和 fp64 基准比，哪一段跳变，问题就在它的前一步。", pit: "基准别用 fp32，它自己有 1e-7 误差，会掩盖小问题。", q: "怎么知道是哪一步引入的误差？", exs: [{d: 7, q: "怎么量化每一步的误差贡献？我不想靠猜。", a: "分段打印 + fp64 基准，这是精度调试里性价比最高的方法。 思路： 在每一步后面把整个 tensor 打出来（或者抽样），逐段与 fp64 结果比较： 判读方法：哪一段的误差突然跳一个量级，问题就在那一段的前一步。 三个注意点： 基准要用 fp64（CPU 上用 double 算），不要用 fp32——fp32 自己就有 1e-7 误差，会掩盖小问题； 固定输入，不要用随机数，否则两次跑没法对比；"}]}, {id: "n31", name: "dtype 选型", dom: "num", refs: [14, 7], def: "范围不够用 bf16，精度不够用 fp32，都不缺用 fp16。", pit: "全局 fp32 是最省事的偷懒，也是最容易在性能上吃亏的选择。", q: "我的算子该用 fp16 还是 fp32？", exs: [{d: 14, q: "那最后给我一个能直接用的判断流程吧。", a: "五步，按顺序： 核心原则：能用 fp16 就用 fp16，把 fp32 留给\"真正需要它的那几步\"。全局 fp32 是最省事的偷懒，也是最容易在性能上吃亏的选择。 ---"}, {d: 7, q: "Softmax fp16，MARE 3.2e-3，验收线 1e-3。fp32 就完全过。", a: "先给结论：这不是算法错，是数值精度问题。判断依据就是你说的那句\"fp32 完全过\"——同一个算法，换精度就过，说明逻辑链路是对的，误差来自数值表示和运算顺序。 fp16 只有约 3–4 位有效数字（尾数 10 位），Softmax 里恰好有三处会把它放大： 建议先做最小实验：只把 sum 改成 fp32 累加，别的都不动，看 MARE 掉到多少。这一步能告诉你误差主要来自哪里，比一次性全改更好定位。"}]}, {id: "n32", name: "多核切分与余数", dom: "perf", refs: [2, 6], def: "按连续性、局部性、均衡选切分维度；余数摊到前几个核。", pit: "total/blockNum 会把余数丢掉，1002 个元素就有 2 个没人算。", q: "余数没人管会怎样？", exs: [{d: 2, q: "每个核分多少？我一直是 total / blockNum。", a: "total / blockNum 是起点，但有两个坑必须补： 坑一：余数丢了。 1002 / 8 = 125，余 2。这 2 个元素如果没人管，就是\"大部分对、少数位置偏小\"。 坑二：木桶效应。 整体时间由最慢的核决定。所以\"余数全给最后一个核\"看起来很整齐，实际上让最后一个核多干一倍的活（如果余数接近 perCore 的话），整体反而更慢。"}, {d: 6, q: "打出来了，第 7 核的 end 是 1002，但 total 也是 1002，看着没问题。等等，第 0 核到第 6 核每核 125 个，7×125=875，最后只有 127……", a: "你算到关键点了。让我把你的数摆开： total = 1002，blockNum = 8 perCore = 1002 / 8 = 125（整除，余 2） 前 7 个核（0~6）各 125 个，覆盖 0~874 第 7 核如果也是 125 个，覆盖 875~999 剩下 1000、1001 这 2 个元素没人管 所以第 7 核的 end 应该是 1002 才对，而不是 1000。"}]}, {id: "n33", name: "UB 预算与 tile", dom: "perf", refs: [2, 8, 10], def: "从 UB 容量倒推 tile，留 25% 余量，向下 32B 对齐。", pit: "tile 写死 8192，换个芯片就崩。", q: "tile 多大合适？我一直凭感觉。", exs: [{d: 2, q: "可我 shape 变化很大，每个 shape 都扫一遍不现实。", a: "不用每个都扫，用分档 + 公式。 第一步：把 tiling 写成函数，不要写死常量。 第二步：定几个\"档位\"，而不是连续值。 比如按 total 分三档： 小（< 8K）：单核，tile = total； 中（8K ~ 256K）：多核，tile 固定 16KB； 大（> 256K）：多核，tile 固定 32KB。 档位边界用实测定（找性能拐点），档内用公式。这样只有 3 组参数要调，不是 N 组。"}, {d: 8, q: "UB 预算怎么随 shape 变？我 tile 是写死的 16KB。", a: "tile 写死，意味着小 shape 时浪费、大 shape 时可能不够。正确做法是从 UB 预算倒推，而不是反过来。 注意最后一步\"按档位取整\"——如果 tile 随着 shape 连续变化，每次调用都换一个值，性能曲线会很难看。把它量化到 8K/16K/32K 几档，既省心又稳。"}, {d: 10, q: "已经试了，跑起来报 UB 超限。那我怎么算能放多大？", a: "给你一个可以手算的估算式，先粗后细： 几个容易漏的占用项： fp32 累加器：如果中间要转 fp32 累加，多一份 buffer； Cast 中转：fp16→fp32 再→fp16，中间那块也算； 对齐 padding：按 32B 向上取整，小 tile 时这个占比不小； 框架自身：TPipe、队列管理结构也占一点。 所以实际能用的不是\"UB 总大小\"，而是\"UB 减去这些之后剩下的\"。"}]}, {id: "n34", name: "队列深度双缓冲", dom: "perf", refs: [2, 9, 10], def: "深度 2 让搬运和计算重叠，深度受 UB 容量限制。", pit: "深度 1 等于没有双缓冲，搬运和计算完全串行。", q: "深度调到 4 或 8 是不是流水更满？", exs: [{d: 10, q: "tile 8KB，blockDim 8。我直接把 tile 改到 64KB 试试？", a: "先别，会撞 UB 上限。tile 不是越大越好，它受一个硬约束： 假设你现在是深度 2、一进一出： 改到 64KB 就是 2×64 + 2×64 = 256KB——远超 UB 容量（不同芯片百 KB 级，具体看型号）。所以大概率直接报\"UB 超限\"或者编译期就失败。 更关键的是：tile 和队列深度是一对联动参数。你把 tile 放大，深度就得降；"}, {d: 2, q: "那 tile 大小怎么定？我一般是 8K 或者 16K，凭感觉。", a: "tile 有闭式解，不用凭感觉。核心是 UB 预算： 举个具体的：假设 UB 有效可用 160KB，一进一出，深度 2： 再考虑对齐（32B）和临时 buffer，取 32KB 比较稳。 三个经验补充： tile 太小（< 8KB）：DMA 启动开销占比高，带宽上不去； tile 太大：深度只能降到 1，双缓冲没了，搬运和计算串行； 最优值通常在\"能放下的最大值\"和\"深度 2 能成立\"之间，要扫一遍确认。"}]}, {id: "n35", name: "木桶效应", dom: "perf", refs: [2, 6, 10], def: "整体时间由最慢的那个核决定，不是平均值。", pit: "余数全给最后一个核，会让它明显变慢，整体更慢。", q: "7 号核基本没干活，这能优化吗？", exs: [{d: 6, q: "clear 了，跑 20 次都一致。不过我发现 7 号核基本没干什么活，这个能优化吗？", a: "能，但先确认真的是\"没活干\"，而不是\"干得慢\"。 两个不同的问题： 负载不均：尾核拿到的元素少（比如 1002 个元素分 8 核，某些核 125、某些 126）； 木桶效应：整体时间由最慢的核决定，所以哪怕只差一个元素，也会被放大成\"其他核在等\"。 优化方向按成本排： 余数均摊（你现在的写法）——代价几乎为零，已经把差距压到 1 个元素；"}, {d: 2, q: "每个核分多少？我一直是 total / blockNum。", a: "total / blockNum 是起点，但有两个坑必须补： 坑一：余数丢了。 1002 / 8 = 125，余 2。这 2 个元素如果没人管，就是\"大部分对、少数位置偏小\"。 坑二：木桶效应。 整体时间由最慢的核决定。所以\"余数全给最后一个核\"看起来很整齐，实际上让最后一个核多干一倍的活（如果余数接近 perCore 的话），整体反而更慢。"}]}, {id: "n36", name: "ratio 判读", dom: "perf", refs: [10], def: "mte2 低不等于搬运不是瓶颈，要看 tile 大小和并行度。", pit: "两个 ratio 都低，通常是调度或同步开销。", q: "这算搬运瓶颈还是计算瓶颈？", exs: [{d: 10, q: "elementwise 算子，实测带宽只有理论值 30%。mte2_ratio 18%、vec_ratio 60%。这算搬运瓶颈还是计算瓶颈？", a: "先纠正一个很常见的误读：mte2_ratio 低，不等于\"搬运不是瓶颈\"。 这个指标的含义是\"搬运单元在采样窗口里有百分之多少的时间是忙的\"。它低，只能说明搬运单元大部分时间在空闲——但空闲的原因可能是： 没有数据可搬（上游没喂上，比如计算太慢）； 搬运任务太小、太碎，启动开销占了大头，真正\"忙\"的时间很短； 同步在等，搬运根本没被发起。"}]}, {id: "n37", name: "ablation 基线", dom: "perf", refs: [10], def: "先做“只搬不算”，测出这条链路的搬运上限，再谈优化。", pit: "同时改多个变量，等于什么都没测出来。", q: "纯搬运能到 80%，说明什么？", exs: [{d: 10, q: "16KB、深度 2，到 45% 了。还是差一半，是不是没救了。", a: "45% 已经说明方向对了（从 30% 到 45% 是实打实的提升），先别下\"没救\"的结论。 现在需要知道\"剩下的差距在哪\"，方法是 ablation——一次只改一个变量，看影响： 先做 A，因为它给你一个\"分母\"：这个 shape 在这张卡上的搬运上限是多少。"}]}, {id: "n38", name: "roofline 与口径", dom: "perf", refs: [10, 11], def: "用实测上限当分母判断差距；小 shape 别看带宽，看延迟。", pit: "大小 shape 混在一起算均值，会让优化方向跑偏。", q: "70% 到 80% 这段还值得追吗？", exs: [{d: 10, q: "那我看板上的数字不就废了？我们报表是按带宽算的。", a: "数字没废，但口径要分组。 混在一起算的问题是：小 shape 的\"低带宽\"会拉低整体均值，让你误判\"这个算子性能很差\"，实际上它只是\"小到不适用带宽口径\"。 建议报表分三组： 这样每个数字都有明确的解释，优化方向也不会跑偏。很多团队的性能看板就是因为没分组，导致\"优化了半天，看板数字没变\"。 ---"}]}, {id: "n39", name: "host tiling", dom: "arch", refs: [15, 2], def: "没有线程抽象、UB 小、二进制静态展开，所以切分只能在 host 侧算好。", pit: "kernel 只负责“按给定切分执行”，不决定“怎么切”。", q: "为什么不能像 CUDA 一样一个 kernel 搞定？", exs: [{d: 15, q: "方案评审被问\"为什么非要 host tiling + kernel 两段，不能像 CUDA 一样一个 kernel 里切分\"。我当时答\"文档就这么写的\"，被追问就没词了。", a: "这个问题确实值得答清楚，因为它是编程模型层面的差异，不是风格问题。 核心原因三条，每条都是硬约束： 1. AI Core 没有线程抽象，不能动态扩并行。 CUDA 里你在 kernel 里 if (threadIdx.x < n) 就能控制并行度，因为线程数是启动参数，block 内部还能再分层。"}, {d: 2, q: "那如果 tiling 已经有问题了，会表现成什么样？", a: "三种症状，对应不同的错法： 最快的确认方式：在 kernel 入口把 tiling 打出来，和你在 host 侧算的对比： 二十行日志，比读代码快。"}]}, {id: "n40", name: "AI Core 四单元", dom: "arch", refs: [15], def: "Scalar 指挥，Vector 逐元素，Cube 矩阵，MTE 搬运，三条流水。", pit: "Scalar 性能差但不可少，它干的是控制流。", q: "Scalar 那么弱，为什么还要它？", exs: [{d: 15, q: "那 Scalar 是干嘛的？我看它性能很差，为什么不干脆去掉。", a: "因为它干的是控制流，不是数据并行，这两类工作没法用同一个单元做。 Scalar 负责： 算地址（基址 + 偏移 + stride） 判断边界（是不是最后一块、要不要走尾块分支） 控制循环（搬几块、算几轮） 发指令（什么时候启动 MTE，什么时候启动 Vector） 这些都是\"决定做什么\"，而 Vector/Cube 是\"做\"。打个比方：Vector/Cube 是工人，Scalar 是工头。"}]}, {id: "n41", name: "UB / L1 / L0", dom: "arch", refs: [15, 12], def: "UB 服务 Vector，L1 与 L0A/B/C 服务 Cube，是两块独立空间。", pit: "把 UB 当 L1 用来算容量，会低估占用。", q: "UB 和 L1 是什么关系？L0A、L0B 又是什么？", exs: [{d: 15, q: "UB 和 L1 是什么关系？我老看到 L0A、L0B、L0C。", a: "一张图能说清： 关键区别：UB 和 L1 是两块不同的片上空间，不是包含关系。 所以你写 elementwise 基本只碰 UB；写 Matmul 才需要管 L1/L0 的搬运。两者不要混着理解。"}]}, {id: "n42", name: "API 分层", dom: "arch", refs: [5, 15], def: "四层：语言扩展、基础 API、高阶 API、框架接口；能用上层别下沉。", pit: "一上来手写全套流水，时间会全花在同步和精度上。", q: "这几个 API 到底是什么关系？", exs: [{d: 15, q: "那什么算子该用高阶 API？", a: "原则：能用就用，除非有明确理由不用。 反模式很常见：一上来就手写全套流水（CopyIn/Compute/CopyOut + 手写同步），最后在同步和精度上耗掉几周，而高阶 API 可能一天就到位。 正确顺序是：高阶 API 拿基线 → 有明确瓶颈 → 再下沉。"}, {d: 5, q: "高阶 API 会不会限制优化？我总觉得用别人的封装做不了极致性能。", a: "会有一定限制，但大部分场景下这个限制不成立，原因有两个： 高阶 API 本身就是针对标准形态调优过的，你没那么容易超过它； \"极致性能\"通常来自切分和流水，而这些高阶 API 内部已经做了。 真正受限的场景是： 特殊融合：比如 bias + 激活 + 量化的组合，高阶 API 覆盖不到； 非标准 shape：某些 shape 下高阶 API 的切分不是最优； 特殊数值要求：需要自定义累加顺序或精度处理。"}]}, {id: "n43", name: "图模式与 GE", dom: "arch", refs: [15, 11], def: "GE 管多个算子怎么排，aclnn 管单个算子怎么调，OPP 是仓库。", pit: "图里慢了，很难判断是算子问题还是调度问题。", q: "图模式和单算子模式，对写法有影响吗？", exs: [{d: 15, q: "aclnn、aclop、GE 这三个我一直分不清。", a: "按调用层次，从下往上： 一句话记：GE 管\"多个算子怎么排\"，aclnn 管\"一个算子怎么调\"，OPP 是仓库，kernel 是货。 你写算子时接触的是 kernel；给别人用时，对方接触的是 aclnn（或图）。"}]}, {id: "n44", name: "CUDA 映射", dom: "arch", refs: [12], def: "线程级并行换成“核 + 指令 lane”，shared memory 换成显式 UB。", pit: "逐行翻译会得到一份能跑但很慢的代码。", q: "映射关系到底怎么对应？", exs: [{d: 12, q: "老模型要迁，里面有我之前写的 CUDA LayerNorm：block 内 blockReduce，__syncthreads 很密。想直接搬过来。", a: "先给结论：别逐行翻译，按数据流重写。CUDA 的并行是\"线程级\"，Ascend C 是\"核 + 指令级\"，没有一一对应关系，硬翻译会得到一份能跑但很慢的代码。 映射关系先建立起来： 最重要的一条：CUDA 里你操心\"哪个线程算哪个元素\"，Ascend C 里你操心\"哪个核处理哪块数据，块内怎么用向量指令铺开\"。抽象层级变了。"}]}, {id: "n45", name: "动态 shape", dom: "ext", refs: [8], def: "每次调用都重算一次 tiling，kernel 不假设任何编译期常量。", pit: "tile 写死，换个 shape 就错，而且只在那个 shape 上错。", q: "动态 shape 到底该怎么支持？", exs: [{d: 8, q: "模型输入长度不固定，seq 从 128 到 4096 都有。我现在的 tiling 是按固定 shape 写死的，换个 shape 就错。动态 shape 到底该怎么支持？", a: "先说一个容易误解的点：动态 shape 不是\"kernel 支持变长\"。 kernel 本身不知道 shape，它只知道 tiling 参数——perCore、tileLen、tileNum。所以\"支持动态 shape\"的真正含义是： 每次调用时，host 侧重新算一次 tiling，把结果传给 kernel。"}]}, {id: "n46", name: "shape 分档", dom: "ext", refs: [2, 8], def: "把连续 shape 映射到几档参数，档内取上界，边界用实测定。", pit: "按 2 的幂拍档位，往往不是性能拐点。", q: "常见 shape 都要覆盖，怎么排比较省事？", exs: [{d: 8, q: "那有没有\"分档\"的策略？我想把常见的 shape 都覆盖。", a: "有，而且这是工业界常用的做法：shape 分档（shape bucketing）。 思路：把连续的 shape 映射到几个固定档位，每个档位用一套预编译/预调好的参数。 三个要点： 档位边界用实测定，不要按\"2 的幂\"拍； 档位内取上界，比如 seq=600 走档位 2 的参数，宁可稍微浪费一点； 档位表要能打印，出问题时一眼看出走了哪档。"}, {d: 2, q: "可我 shape 变化很大，每个 shape 都扫一遍不现实。", a: "不用每个都扫，用分档 + 公式。 第一步：把 tiling 写成函数，不要写死常量。 第二步：定几个\"档位\"，而不是连续值。 比如按 total 分三档： 小（< 8K）：单核，tile = total； 中（8K ~ 256K）：多核，tile 固定 16KB； 大（> 256K）：多核，tile 固定 32KB。 档位边界用实测定（找性能拐点），档内用公式。这样只有 3 组参数要调，不是 N 组。"}]}, {id: "n47", name: "算子融合", dom: "ext", refs: [11], def: "省掉中间结果的 GM 往返，收益取决于访存能减少多少。", pit: "省不下访存的融合，只是在增加复杂度。", q: "融合到底能救多少？值不值得投入？", exs: [{d: 11, q: "融合会不会反而更慢？我见过有人融合完性能下降的。", a: "会，三种典型情况： 1. UB 超限导致退化。 为了融合，tile 被迫变小，搬运次数变多，抵消了省下的 GM 往返。 2. 并行度下降。 融合后一个大 kernel 占满所有核，但每个核的活变少了，尾块浪费增加。 3. 同步开销。 融合后流水更长，同步点更多，如果写得不够精细，反而串行。 判断标准：融合后的 GM 访问量减少了吗？ 如果没减少（比如中间结果还是落 GM 了），那融合就没有意义，只是在增加复杂度。"}]}, {id: "n48", name: "何时拆 kernel", dom: "ext", refs: [11, 15], def: "中间结果放不下、单元配比差、需要可调试时，拆比融合好。", pit: "融合后变慢，通常是 UB 放不下或并行度下降。", q: "什么情况下应该拆，而不是融？", exs: [{d: 11, q: "那什么情况下应该拆 kernel，而不是融合？", a: "四种情况，都是\"融合的代价大于收益\"： 中间结果 UB 放不下：被迫落 GM，融合等于白做； Cube/Vector 配比差异大：一个阶段 Cube 忙、Vector 闲，另一个反过来，拆开可以让不同 kernel 用不同核数； 可调试性优先：线上出问题时，拆开的版本更容易定位； 复用性：某些中间算子被多处调用，融合进去就不好复用了。 一句话：融合是为了省访存，不是为了少写代码。省不了访存就别融合。"}, {d: 15, q: "方案评审被问\"为什么非要 host tiling + kernel 两段，不能像 CUDA 一样一个 kernel 里切分\"。我当时答\"文档就这么写的\"，被追问就没词了。", a: "这个问题确实值得答清楚，因为它是编程模型层面的差异，不是风格问题。 核心原因三条，每条都是硬约束： 1. AI Core 没有线程抽象，不能动态扩并行。 CUDA 里你在 kernel 里 if (threadIdx.x < n) 就能控制并行度，因为线程数是启动参数，block 内部还能再分层。"}]}, {id: "n49", name: "UB 生命周期", dom: "ext", refs: [12, 5], def: "UB 要显式分配、搬入、算完、还回，没有自动缓存这回事。", pit: "忘了还就卡住，忘了搬就是空数据。", q: "UB 是自动缓存吗？", exs: [{d: 9, q: "TBuf。因为这个 buffer 要复用做中间计算。", a: "那就不能删。而且你这段代码在 TBuf 上做\"复用 + 手动同步\"，是合理的写法，不是历史包袱。 原因：TBuf 只保证\"分配一块内存给你\"，不保证\"上一个操作写完了没有\"。你复用同一块 buffer 做中间计算时，如果不手动插同步，就会出现\"上一轮的计算还没读完，下一轮的搬运已经覆盖了它\"——这就是数据竞争。 顺带说一句，TBuf 复用确实是常见需求（省 UB），但要注意：复用的代价就是同步责任转移给了你。"}, {d: 12, q: "老模型要迁，里面有我之前写的 CUDA LayerNorm：block 内 blockReduce，__syncthreads 很密。想直接搬过来。", a: "先给结论：别逐行翻译，按数据流重写。CUDA 的并行是\"线程级\"，Ascend C 是\"核 + 指令级\"，没有一一对应关系，硬翻译会得到一份能跑但很慢的代码。 映射关系先建立起来： 最重要的一条：CUDA 里你操心\"哪个线程算哪个元素\"，Ascend C 里你操心\"哪个核处理哪块数据，块内怎么用向量指令铺开\"。抽象层级变了。"}]}, {id: "n50", name: "aclnn 两段式", dom: "deploy", refs: [13, 8], def: "先问 workspace 多大，再执行；workspace 由调用方分配。", pit: "同 shape 可以复用，别每一步都 malloc/free。", q: "workspace 不是框架给的吗？", exs: [{d: 13, q: "workspace 还要我自己 malloc？我以为框架会分配。", a: "必须你自己分配，这是 aclnn 的设计约定。但有三点可以省心： 1. 同一 shape 下可以复用。 不要每个 step 都 malloc/free，那是明显的性能损耗。按 shape 做个缓存： 2. 用 aclrtMalloc，别用 new / malloc。 前者分配的是 device 内存，后者是 host 内存，传错了会在执行时报奇怪的错。"}, {d: 8, q: "workspace 大小也随 shape 变，这个怎么处理？", a: "workspace 的大小是算出来的，不是固定的： 然后传给上层（aclnn 的第一段接口会告诉你需要多大）： 三个注意点： 不要预分配一个巨大的固定值——浪费内存，而且大小 shape 不一致时容易踩边界； workspace 要清零（如果语义需要），别假设新分配的内存是 0；"}]}, {id: "n51", name: "dispatcher 注册", dom: "deploy", refs: [13], def: "报 PrivateUse1 是“没注册实现”，不是“算子没装上”。", pit: "走 op-plugin 要补 schema、kernel、meta 三样，缺一个就挂。", q: "算子装了，Python 里还是调不到。", exs: [{d: 13, q: "算子都过了，接进推理服务，Python 里报： config.ini 里有我的 vendor，nm -D 也能找到符号。那是框架的问题？", a: "你这个排查已经把\"算子包\"这一层排掉了，方向是对的。这个报错来自 PyTorch 的 dispatcher，含义很具体： \"这个算子名我认识，但没有注册在当前 backend（PrivateUse1，也就是昇腾私有后端）的实现表里。\" 所以它不是\"算子没装上\"，而是\"PyTorch 不知道怎么调它\"。算子包和框架之间，还差一层注册。 两条路： 推理服务场景，B 通常够用，而且调试成本低。"}]}, {id: "n52", name: "设备异常定位", dom: "deploy", refs: [13], def: "导 device 日志，看第一条 trap、PC 地址、访问的地址和长度。", pit: "最后一条通常是连锁反应，别从那里开始看。", q: "507015 这个码是什么意思？", exs: [{d: 13, q: "导出来一堆，看哪？", a: "四个抓手，按优先级： 1. 第一条异常，不是最后一条。 设备日志会有连锁反应，最后一条通常是\"前面出错的后果\"。 2. PC 地址。 如果有，配合编译时 -g 保留符号，能定位到 kernel 的具体行。 3. 访问的地址和长度。 越界类日志通常会给\"访问了哪个地址、长度多少\"，和你的 tensor 大小一比就清楚。 4. trap 前后的算子名。"}]}, {id: "n53", name: "语义 vs 数值", dom: "deploy", refs: [13], def: "先排 dtype、布局、broadcast，再谈精度问题。", pit: "全 1 / 全 0 / 单个 1，比随机数更能暴露位置错。", q: "和 PyTorch 对不上，差了 1e-3。", exs: [{d: 13, q: "明白了。那我改完之后和 PyTorch 对不上，差了 1e-3。", a: "先排语义，再排数值——顺序反了会浪费很多时间。 语义层（先查）： 数值层（后查）：累加顺序、Cast 的 RoundMode、eps。 验证技巧：用三组特殊输入跑一遍，比随机数好用得多： 随机数的问题是\"错了也看不出错在哪\"，这三种输入能把错误模式放大。"}]}, {id: "n54", name: "交付清单", dom: "deploy", refs: [13, 11], def: "算子包、接口说明、支持矩阵、精度报告、性能数据、已知限制。", pit: "漏了支持矩阵，往往上线后才发现某个 shape 不支持。", q: "这个算子要交给业务团队，我交什么？", exs: [{d: 13, q: "最后问个事，这个算子要给业务团队，我交什么？", a: "六样，缺一样都会在对接时返工： 其中最容易漏的是 ③ 和 ⑥： ③ 漏了：业务方传一个你没测过的 shape，出问题后才发现\"不支持\"； ⑥ 漏了：业务方踩到一个已知 bug，以为是新问题，重新排查一遍。 另外建议在 ② 里写清楚 workspace 的复用方式——这是调用方最容易写错的地方。 ---"}, {d: 11, q: "单算子我都调过了，每个看着都还行。但整网还是慢，同事说要做算子融合。融合到底能救多少？值不值得投入？", a: "能救多少，取决于你的瓶颈在哪。先把融合的收益拆开，你才能判断值不值： 判断方法很简单：算一下\"融合能省掉多少次 GM 读写\"。 比如 LayerNorm → Gelu → Add： 理论上省掉 2/3 的访存。如果你的算子链是 memory bound，收益就接近这个数；如果是 compute bound，收益就小得多。"}]}];

const LINKS = [["n13", "n14", "dep"], ["n14", "n15", "dep"], ["n15", "n32", "dep"], ["n16", "n15", "dep"], ["n17", "n13", "dep"], ["n18", "n53", "dep"], ["n18", "n15", "dep"], ["n19", "n20", "dep"], ["n20", "n22", "dep"], ["n20", "n34", "dep"], ["n21", "n20", "dep"], ["n23", "n24", "dep"], ["n24", "n23", "dep"], ["n23", "n32", "dep"], ["n19", "n23", "dep"], ["n25", "n26", "dep"], ["n26", "n31", "dep"], ["n26", "n30", "dep"], ["n27", "n31", "dep"], ["n28", "n30", "dep"], ["n29", "n28", "dep"], ["n32", "n35", "dep"], ["n33", "n34", "dep"], ["n33", "n47", "dep"], ["n33", "n49", "dep"], ["n36", "n37", "dep"], ["n37", "n38", "dep"], ["n35", "n38", "dep"], ["n39", "n32", "dep"], ["n39", "n45", "dep"], ["n40", "n39", "dep"], ["n41", "n33", "dep"], ["n42", "n19", "dep"], ["n42", "n39", "dep"], ["n43", "n47", "dep"], ["n43", "n48", "dep"], ["n44", "n49", "dep"], ["n44", "n18", "dep"], ["n45", "n46", "dep"], ["n46", "n33", "dep"], ["n47", "n48", "dep"], ["n49", "n19", "dep"], ["n7", "n8", "dep"], ["n7", "n12", "dep"], ["n8", "n11", "dep"], ["n9", "n10", "dep"], ["n10", "n50", "dep"], ["n50", "n51", "dep"], ["n51", "n53", "dep"], ["n52", "n5", "dep"], ["n5", "n52", "dep"], ["n54", "n53", "dep"], ["n1", "n3", "dep"], ["n3", "n4", "dep"], ["n2", "n4", "dep"], ["n26", "n31", "trade"], ["n33", "n34", "trade"], ["n47", "n33", "trade"]];
/* ============ 基础 ============ */
const NS='http://www.w3.org/2000/svg';
const $ = s=>document.querySelector(s);
const domById = Object.fromEntries(DOMAINS.map(d=>[d.id,d]));
const nodeById = Object.fromEntries(NODES.map(n=>[n.id,n]));
const dlgByN = Object.fromEntries(DIALOGUES.map(d=>[d.n,d]));
const W=1000, H=720, CX=W/2, CY=H/2;

/* ============ 顶栏统计 ============ */
(function(){
  const shared = NODES.filter(n=>n.refs.length>1).length;
  const dlinks = NODES.reduce((s,n)=>s+n.refs.length,0);
  $('#stats').innerHTML = `
    <div class="stat"><i>${DIALOGUES.length}</i>段对话</div>
    <div class="stat"><i>${NODES.length}</i>个知识点</div>
    <div class="stat"><i>${LINKS.length + dlinks}</i>条关联</div>
    <div class="stat"><i>${shared}</i>个跨段共享</div>`;
})();

/* ============ 侧栏 ============ */
(function(){
  const list = $('#dlgList');
  DIALOGUES.forEach(d=>{
    const cnt = NODES.filter(n=>n.refs.includes(d.n)).length;
    const el = document.createElement('div');
    el.className='dlg'; el.dataset.n=d.n;
    el.innerHTML = `<div class="t">${d.t}</div><div class="m">${d.s} · ${cnt} 个知识点</div>`;
    el.onclick = ()=>toggleDialogue(d.n);
    list.appendChild(el);
  });
  const dom = $('#domList');
  DOMAINS.forEach(d=>{
    const el = document.createElement('div');
    el.className='chip'; el.dataset.id=d.id;
    el.innerHTML = `<span class="dot" style="background:${d.color}"></span>${d.name}`;
    el.onclick = ()=>toggleDomain(d.id);
    dom.appendChild(el);
  });
})();

/* ============ 状态 ============ */
const state = {dlg:null, dom:null, q:''};
let labelsOn = true;

/* ============ 力导向网络 ============ */
const simNodes = [], simLinks = [];
const anchors = {};

DOMAINS.forEach((d,i)=>{
  const a = -Math.PI/2 + i*(Math.PI*2/DOMAINS.length);
  anchors[d.id] = {x: CX + Math.cos(a)*300, y: CY + Math.sin(a)*222};
});

NODES.forEach(n=>{
  const a = anchors[n.dom];
  const ang = Math.random()*Math.PI*2, rad = 40 + Math.random()*120;
  simNodes.push({
    id:n.id, kind:'c', dom:n.dom, label:n.name, ref:n,
    x: a.x + Math.cos(ang)*rad, y: a.y + Math.sin(ang)*rad,
    vx:0, vy:0, r:5, deg:0
  });
});
DIALOGUES.forEach((d,i)=>{
  const ang = (i/DIALOGUES.length)*Math.PI*2 - Math.PI/2;
  simNodes.push({
    id:'D'+d.n, kind:'d', dom:null, label:d.short, ref:d,
    x: CX + Math.cos(ang)*330, y: CY + Math.sin(ang)*250,
    vx:0, vy:0, r:13, deg:0
  });
});

const byId = Object.fromEntries(simNodes.map(n=>[n.id,n]));

LINKS.forEach(([a,b,kind])=>simLinks.push({s:a,t:b,kind:kind==='trade'?'trade':'cc'}));
DIALOGUES.forEach(d=>{
  NODES.filter(n=>n.refs.includes(d.n)).forEach(n=>{
    simLinks.push({s:'D'+d.n, t:n.id, kind:'dc'});
  });
});
simLinks.forEach(l=>{ byId[l.s].deg++; byId[l.t].deg++; });
simNodes.forEach(n=>{ if(n.kind==='c') n.r = 4.2 + Math.min(n.deg,8)*0.78; });

const svg = $('#graph');
const gLinks = $('#links');
const gNodes = $('#nodes');
const viewport = $('#viewport');

/* ---- DOM ---- */
simNodes.forEach(n=>{
  const g = document.createElementNS(NS,'g');
  g.setAttribute('class','nd ' + (n.kind==='d'?'d':'c'));
  g.dataset.id = n.id;

  if(n.kind==='c'){
    const color = domById[n.dom].color;
    const halo = document.createElementNS(NS,'circle');
    halo.setAttribute('r', n.r*2.0); halo.setAttribute('fill', color);
    halo.setAttribute('opacity','.10'); g.appendChild(halo);

    const dot = document.createElementNS(NS,'circle');
    dot.setAttribute('class','dot'); dot.setAttribute('r', n.r);
    dot.setAttribute('fill', color);
    g.appendChild(dot);

    const t = document.createElementNS(NS,'text');
    t.setAttribute('class','lbl'); t.textContent = n.label;
    g.appendChild(t);
  } else {
    const ring = document.createElementNS(NS,'circle');
    ring.setAttribute('class','ring'); ring.setAttribute('r', n.r);
    g.appendChild(ring);
    const t = document.createElementNS(NS,'text');
    t.setAttribute('class','lbl dlbl');
    t.textContent = n.label;
    g.appendChild(t);
  }

  g.addEventListener('mouseenter', ()=>focusNode(n.id));
  g.addEventListener('mouseleave', ()=>focusNode(null));
  g.addEventListener('click', e=>{
    e.stopPropagation();
    if(n.kind==='c') openDrawerNode(n.id);
    else toggleDialogue(n.ref.n);
  });
  n.el = g;
  gNodes.appendChild(g);
});

simLinks.forEach(l=>{
  const line = document.createElementNS(NS,'line');
  line.setAttribute('class','lk ' + (l.kind==='dc'?'dc':''));
  if(l.kind==='trade'){ line.setAttribute('stroke','#E7A0AB'); line.setAttribute('stroke-dasharray','4 3'); }
  l.el = line;
  gLinks.appendChild(line);
});

/* ---- 力导向 ---- */
const SIM = {alpha:1, running:false};

function tick(){
  simNodes.forEach(n=>{ n.fx=0; n.fy=0; });

  // 斥力
  for(let i=0;i<simNodes.length;i++){
    const a=simNodes[i];
    for(let j=i+1;j<simNodes.length;j++){
      const b=simNodes[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      let d2=dx*dx+dy*dy;
      if(d2<0.01){ dx=(Math.random()-.5); dy=(Math.random()-.5); d2=dx*dx+dy*dy; }
      if(d2>170000) continue;
      const d=Math.sqrt(d2);
      const base = (a.kind==='d'||b.kind==='d') ? 3600 : 2200;
      const f = base/d2;
      const ux=dx/d, uy=dy/d;
      a.fx-=ux*f; a.fy-=uy*f;
      b.fx+=ux*f; b.fy+=uy*f;
      const minD = a.r + b.r + ((a.kind==='d'||b.kind==='d') ? 28 : 20);
      if(d < minD){
        const push=(minD-d)*0.45;
        a.fx-=ux*push; a.fy-=uy*push;
        b.fx+=ux*push; b.fy+=uy*push;
      }
    }
  }
  // 连线弹簧
  simLinks.forEach(l=>{
    const a=byId[l.s], b=byId[l.t];
    if(!a||!b) return;
    let dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const L = l.kind==='dc' ? 145 : (l.kind==='trade' ? 70 : 58);
    const k = l.kind==='dc' ? 0.007 : 0.030;
    const f=(d-L)*k;
    const ux=dx/d, uy=dy/d;
    a.fx+=ux*f; a.fy+=uy*f;
    b.fx-=ux*f; b.fy-=uy*f;
  });
  // 聚类 + 向心
  simNodes.forEach(n=>{
    if(n.kind==='c'){
      const an=anchors[n.dom];
      n.fx += (an.x-n.x)*0.045;
      n.fy += (an.y-n.y)*0.045;
    }
    if(n.kind==='c'){
      n.fx += (CX-n.x)*0.0006;
      n.fy += (CY-n.y)*0.0006;
    } else {
      const dx=n.x-CX, dy=n.y-CY, d=Math.hypot(dx,dy)||1;
      const f=(d-330)*0.022;
      n.fx -= dx/d*f; n.fy -= dy/d*f;
    }
  });
  // 积分
  simNodes.forEach(n=>{
    if(n.pin) return;
    n.vx=(n.vx+n.fx*SIM.alpha*0.6)*0.86;
    n.vy=(n.vy+n.fy*SIM.alpha*0.6)*0.86;
    const sp=Math.hypot(n.vx,n.vy);
    if(sp>8){ n.vx*=8/sp; n.vy*=8/sp; }
    n.x+=n.vx; n.y+=n.vy;
    n.x=Math.max(36,Math.min(W-36,n.x));
    n.y=Math.max(28,Math.min(H-28,n.y));
  });
  SIM.alpha*=0.984;
  paint();
}

function paint(){
  simNodes.forEach(n=>{
    n.el.setAttribute('transform', `translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    const t = n.el.querySelector('.lbl');
    if(t){
      const right = n.x < CX;
      t.setAttribute('x', right ? (n.r+7) : -(n.r+7));
      t.setAttribute('text-anchor', right ? 'start':'end');
      t.setAttribute('y','3.4');
      t.style.display = labelsOn ? '' : 'none';
    }
  });
  simLinks.forEach(l=>{
    const a=byId[l.s], b=byId[l.t];
    l.el.setAttribute('x1',a.x.toFixed(1)); l.el.setAttribute('y1',a.y.toFixed(1));
    l.el.setAttribute('x2',b.x.toFixed(1)); l.el.setAttribute('y2',b.y.toFixed(1));
  });
}

function textW(str, fs){
  let w=0;
  for(const ch of str) w += /[\u4e00-\u9fa5]/.test(ch) ? fs : fs*0.58;
  return w;
}

function placeLabels(){
  const fs = 9.6, placed = [];
  const obstacles = simNodes.map(n=>({x:n.x-n.r-2, y:n.y-n.r-2, w:n.r*2+4, h:n.r*2+4}));
  const list = simNodes.slice().sort((a,b)=>b.deg-a.deg);
  list.forEach(n=>{
    const t = n.el.querySelector('.lbl'); if(!t) return;
    const w = textW(n.label, fs), h = fs+3;
    const cands = [
      {ax:'start',  dx:n.r+7,  dy:3.4},
      {ax:'end',    dx:-(n.r+7), dy:3.4},
      {ax:'middle', dx:0,      dy:-(n.r+7)},
      {ax:'middle', dx:0,      dy:n.r+13}
    ];
    let pick=null;
    for(const c of cands){
      const x0 = c.ax==='start' ? n.x+c.dx : (c.ax==='end' ? n.x+c.dx-w : n.x-w/2);
      const box = {x:x0-2, y:n.y+c.dy-fs, w:w+4, h:h};
      const hit = placed.some(b=>!(box.x+box.w<b.x || box.x>b.x+b.w || box.y+box.h<b.y || box.y>b.y+b.h))
               || obstacles.some(o=>!(box.x+box.w<o.x || box.x>o.x+o.w || box.y+box.h<o.y || box.y>o.y+o.h));
      if(!hit){ pick={c,box}; break; }
    }
    if(pick){
      t.setAttribute('text-anchor', pick.c.ax);
      t.setAttribute('x', pick.c.dx);
      t.setAttribute('y', pick.c.dy);
      t.style.display = labelsOn ? '' : 'none';
      placed.push(pick.box);
    } else if(n.kind==='d'){
      // 对话标签不隐藏，退回右侧，保证每段都能读
      t.setAttribute('text-anchor','start');
      t.setAttribute('x', n.r+8);
      t.setAttribute('y','3.4');
    } else {
      t.style.display='none';
    }
  });
}

function fitView(){
  const xs=simNodes.map(n=>n.x), ys=simNodes.map(n=>n.y);
  const minX=Math.min(...xs)-62, maxX=Math.max(...xs)+62;
  const minY=Math.min(...ys)-46, maxY=Math.max(...ys)+46;
  const k=Math.min((W-30)/(maxX-minX),(H-30)/(maxY-minY),1.2);
  view={k, x:CX-(minX+maxX)/2*k, y:CY-(minY+maxY)/2*k};
  applyView();
}

function loop(){
  if(!SIM.running) return;
  tick();
  if(SIM.alpha<0.02){
    SIM.running=false;
    placeLabels();
    fitView();
    return;
  }
  requestAnimationFrame(loop);
}
function kick(a=1){ SIM.alpha=Math.max(SIM.alpha,a); if(!SIM.running){ SIM.running=true; requestAnimationFrame(loop);} }

/* ---- 聚焦高亮 ---- */
function focusNode(id){
  if(state.dlg||state.q||state.dom) return;
  if(!id){ svg.classList.remove('focus');
    simNodes.forEach(n=>n.el.classList.remove('hot','nbr'));
    simLinks.forEach(l=>l.el.classList.remove('hot'));
    return; }
  const nbr = new Set([id]);
  simLinks.forEach(l=>{
    const hit = l.s===id || l.t===id;
    l.el.classList.toggle('hot', hit);
    if(hit){ nbr.add(l.s); nbr.add(l.t); }
  });
  simNodes.forEach(n=>{
    n.el.classList.toggle('hot', n.id===id);
    n.el.classList.toggle('nbr', nbr.has(n.id) && n.id!==id);
  });
  svg.classList.add('focus');
}

/* ---- 过滤 ---- */
function applyState(){
  const q = state.q.toLowerCase();
  const filtering = !!(state.dlg || state.dom || q);
  const active = new Set();
  simNodes.forEach(n=>{
    let on = true;
    if(state.dlg) on = n.kind==='d' ? n.ref.n===state.dlg : n.ref.refs.includes(state.dlg);
    if(state.dom) on = on && n.dom === state.dom;
    if(q) on = on && n.kind==='c' && (n.ref.name.toLowerCase().includes(q) || n.ref.def.toLowerCase().includes(q));
    n.el.style.opacity = on ? 1 : .16;
    const dot = n.el.querySelector('.dot');
    if(dot){
      dot.setAttribute('stroke', (filtering && on) ? 'rgba(255,255,255,.85)' : 'none');
      dot.setAttribute('stroke-width','1.2');
    }
    if(on) active.add(n.id);
  });
  simLinks.forEach(l=>{
    const both = active.has(l.s) && active.has(l.t);
    l.el.style.opacity = both ? (l.kind==='dc'? .55 : .65) : .03;
  });
  document.querySelectorAll('.dlg').forEach(el=>el.classList.toggle('on', Number(el.dataset.n)===state.dlg));
  document.querySelectorAll('.chip').forEach(el=>el.classList.toggle('on', el.dataset.id===state.dom));
  const h = $('#hud');
  if(state.dlg){
    const d=dlgByN[state.dlg];
    h.innerHTML = `已聚焦 <b>${d.t}</b>，点亮 ${NODES.filter(n=>n.refs.includes(d.n)).length} 个知识点`;
  } else if(state.dom){
    h.innerHTML = `已聚焦 <b>${domById[state.dom].name}</b>`;
  } else if(state.q){
    h.innerHTML = `搜索 <b>${state.q}</b>`;
  } else {
    h.innerHTML = `<b>●</b> 知识点（颜色 = 知识域）　<b>○</b> 对话（他的处境）<br>悬停看关联，点击看原文，拖拽拉散，滚轮缩放`;
  }
}

/* ---- 交互：拖拽 / 缩放 / 平移 ---- */
let view = {k:1, x:0, y:0};
function applyView(){ viewport.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }

function toSvg(evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return {x:(p.x - view.x)/view.k, y:(p.y - view.y)/view.k};
}

let dragging=null, panning=null;

svg.addEventListener('pointerdown', e=>{
  const g = e.target.closest('.nd');
  if(g){
    const n = byId[g.dataset.id];
    n.pin = true; n.vx=0; n.vy=0;
    dragging = {n, off: (()=>{const p=toSvg(e); return {x:p.x-n.x, y:p.y-n.y};})()};
    svg.setPointerCapture(e.pointerId);
  } else if(e.target === svg || e.target.closest('#viewport')){
    panning = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y};
    svg.classList.add('dragging');
  }
});
svg.addEventListener('pointermove', e=>{
  if(dragging){
    const p = toSvg(e);
    dragging.n.x = p.x - dragging.off.x;
    dragging.n.y = p.y - dragging.off.y;
    paint();
  } else if(panning){
    const s = 1000 / svg.clientWidth;
    view.x = panning.vx + (e.clientX - panning.sx) * s;
    view.y = panning.vy + (e.clientY - panning.sy) * s * (1000/1000);
    applyView();
  }
});
svg.addEventListener('pointerup', e=>{
  if(dragging){ dragging.n.pin=false; kick(.35); dragging=null;
    setTimeout(()=>{ if(!SIM.running) placeLabels(); }, 500); }
  if(panning){ panning=null; svg.classList.remove('dragging'); }
});
svg.addEventListener('click', e=>{
  if(e.target === svg || e.target.closest('#viewport') && !e.target.closest('.nd')){
    state.dlg=null; state.dom=null; state.q=''; $('#q').value='';
    applyState(); closeDrawer();
  }
});
svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const p = toSvg(e);
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  const k2 = Math.min(2.6, Math.max(.45, view.k*factor));
  const sx = p.x*view.k + view.x, sy = p.y*view.k + view.y;
  view.k = k2;
  view.x = sx - p.x*k2;
  view.y = sy - p.y*k2;
  applyView();
}, {passive:false});

$('#zIn').onclick = ()=>{ view.k=Math.min(2.6,view.k*1.2); applyView(); };
$('#zOut').onclick = ()=>{ view.k=Math.max(.45,view.k/1.2); applyView(); };
$('#btnReset').onclick = ()=>{ view={k:1,x:0,y:0}; applyView(); };
$('#btnRelayout').onclick = ()=>{
  SIM.alpha=1;
  simNodes.forEach(n=>{ n.vx=0;n.vy=0;
    if(n.kind==='c'){
      const a=anchors[n.dom], ang=Math.random()*Math.PI*2, rad=40+Math.random()*120;
      n.x=a.x+Math.cos(ang)*rad; n.y=a.y+Math.sin(ang)*rad;
    } else {
      const ang=Math.random()*Math.PI*2;
      n.x=CX+Math.cos(ang)*320; n.y=CY+Math.sin(ang)*240;
    }
  });
  initLayout();
};
$('#btnLabels').onclick = e=>{
  labelsOn = !labelsOn;
  e.currentTarget.classList.toggle('on', labelsOn);
  if(labelsOn) placeLabels();
  else document.querySelectorAll('.nd.c .lbl').forEach(t=>t.style.display='none');
};

/* ============ 对话选择 ============ */
function toggleDialogue(n){
  state.dlg = (state.dlg===n)? null : n;
  if(state.dlg) state.dom=null;
  applyState();
  if(state.dlg){
    const d = dlgByN[state.dlg];
    openDrawerDialogue(d, NODES.filter(x=>x.refs.includes(d.n)));
  } else closeDrawer();
}
function toggleDomain(id){
  state.dom = (state.dom===id)? null : id;
  if(state.dom) state.dlg=null;
  applyState();
  if(!state.dom) closeDrawer();
}
$('#q').addEventListener('input', e=>{ state.q=e.target.value.trim(); applyState(); });

/* ============ 抽屉 ============ */
const drawer = $('#drawer'), dwBody = $('#dwBody');
$('#dwClose').onclick = ()=>{ closeDrawer(); state.dlg=null; state.dom=null; applyState(); };
function closeDrawer(){ drawer.classList.remove('open'); document.body.classList.remove('drawer-open'); }
function openDrawer(){ drawer.classList.add('open'); document.body.classList.add('drawer-open'); }

function openDrawerNode(id){
  const n = nodeById[id]; const d = domById[n.dom];
  $('#dwBar').style.background = d.color;
  $('#dwKicker').textContent = d.name + ' · ' + (n.refs.length>1? `出现在 ${n.refs.length} 段对话`:'只出现在 1 段');
  $('#dwTitle').textContent = n.name;
  const rel = LINKS.filter(l=>l[0]===id||l[1]===id).map(l=>l[0]===id?l[1]:l[0]).filter((v,i,a)=>a.indexOf(v)===i);
  dwBody.innerHTML = `
    <h4>原文</h4>
    ${n.exs.map(e=>`<div class="ex-title">《${dlgByN[e.d].t}》</div>
      <div class="ex">
        <div class="ex-row"><span class="who">他</span><span class="txt">${e.q}</span></div>
        <div class="ex-row"><span class="who a">助手</span><span class="txt">${e.a}</span></div>
      </div>`).join('')}
    <h4>一句话</h4><div class="dw-def">${n.def}</div>
    <h4>常见误区</h4><div class="dw-pit">${n.pit}</div>
    <h4>这些都出自</h4><div>${n.refs.map(r=>`<span class="dw-chip" data-goto="${r}">${dlgByN[r].t}</span>`).join('')}</div>
    <h4>相关概念</h4><div>${rel.map(r=>`<span class="dw-chip" data-rel="${r}">${nodeById[r].name}</span>`).join('')||'<span class="dw-sect">暂无</span>'}</div>`;
  dwBody.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>toggleDialogue(Number(el.dataset.goto)));
  dwBody.querySelectorAll('[data-rel]').forEach(el=>el.onclick=()=>openDrawerNode(el.dataset.rel));
  openDrawer();
}

function openDrawerDialogue(d, cnt){
  $('#dwBar').style.background = '#2E6BE6';
  $('#dwKicker').textContent = `对话 · ${d.s}`;
  $('#dwTitle').textContent = d.t;
  const byDom = DOMAINS.map(dm=>{
    const items = cnt.filter(n=>n.dom===dm.id);
    if(!items.length) return '';
    return `<h4>${dm.name}</h4><div>${items.map(n=>`<span class="dw-chip" data-rel="${n.id}">${n.name}</span>`).join('')}</div>`;
  }).join('');
  dwBody.innerHTML = `
    <h4>他当时在做什么</h4><div class="dw-def">${d.sum}</div>
    <h4>开场那句</h4>
    <div class="ex">
      <div class="ex-row"><span class="who">他</span><span class="txt">${d.opening}</span></div>
      <div class="ex-row"><span class="who a">助手</span><span class="txt">${d.openingA}</span></div>
    </div>
    <h4>这段涉及 ${cnt.length} 个知识点</h4>${byDom}`;
  dwBody.querySelectorAll('[data-rel]').forEach(el=>el.onclick=()=>openDrawerNode(el.dataset.rel));
  openDrawer();
}

/* ============ 视图切换 ============ */
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b===btn));
    const map = btn.dataset.view==='map';
    svg.style.display = map? 'block':'none';
    document.querySelector('.hud').style.display = map? 'block':'none';
    document.querySelector('.ctrl').style.display = map? 'flex':'none';
    document.querySelector('.zoom').style.display = map? 'flex':'none';
    $('#matrix').classList.toggle('hidden', map);
  };
});

/* ============ 覆盖矩阵 ============ */
(function(){
  const el = $('#matrix');
  const head = '<tr><th style="text-align:left">对话</th>' +
    DOMAINS.map(d=>`<th><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${d.color};margin-right:4px"></span>${d.name}</th>`).join('') +
    '<th>合计</th></tr>';
  let rows='';
  DIALOGUES.forEach(d=>{
    let total=0;
    const cells = DOMAINS.map(dm=>{
      const items = NODES.filter(n=>n.dom===dm.id && n.refs.includes(d.n));
      total += items.length;
      if(!items.length) return `<td class="cell" data-d="${d.n}" data-dom="${dm.id}" style="background:#FAFBFC;color:#C9CFDA">·</td>`;
      const a = Math.min(.14+items.length*0.2,.82);
      return `<td class="cell" data-d="${d.n}" data-dom="${dm.id}" style="background:${hexA(dm.color,a)};color:${items.length>=2?'#fff':'#1B1F26'};font-weight:600">${items.length}</td>`;
    }).join('');
    rows += `<tr><th>${d.t}</th>${cells}<td class="tot">${total}</td></tr>`;
  });
  el.innerHTML = `<div style="padding:10px 14px 2px;font-size:11.5px;color:#8A929F">每一格 = 该段对话在该知识域涉及的知识点数，点格子可反查</div>
    <table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  el.querySelectorAll('td.cell').forEach(td=>td.onclick=()=>{
    const n=Number(td.dataset.d), dm=td.dataset.dom;
    const items = NODES.filter(x=>x.dom===dm && x.refs.includes(n));
    if(!items.length) return;
    $('#dwBar').style.background = domById[dm].color;
    $('#dwKicker').textContent = `${dlgByN[n].t} · ${domById[dm].name}`;
    $('#dwTitle').textContent = `${items.length} 个知识点`;
    dwBody.innerHTML = `<h4>本格内容</h4><div>${items.map(x=>`<span class="dw-chip" data-rel="${x.id}">${x.name}</span>`).join('')}</div>`;
    dwBody.querySelectorAll('[data-rel]').forEach(c=>c.onclick=()=>openDrawerNode(c.dataset.rel));
    openDrawer();
  });
})();

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ============ 启动 ============ */
function initLayout(){
  SIM.alpha = 1; SIM.running = false;
  for(let i=0;i<340;i++) tick();
  SIM.alpha = 0.02;
  paint();
  placeLabels();
  fitView();
}

applyView();
initLayout();

</script>
</body>
</html>
