<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 339.26425 415.4" width="339.26425" height="415.4" style="--bg:#ffffff;--fg:#354052;--line:#8794a8;--accent:#6563b7;--muted:#657184;--surface:#f7f8fb;--border:#d9dee7">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="intent" data-to="studio" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.62824999999998,54.900000000000006 210.62824999999998,102.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="studio" data-to="prompt" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.62824999999998,139.8 210.62824999999998,163.8 143.08549999999997,163.8 143.08549999999997,187.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="studio" data-to="path" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="210.62824999999998,139.8 210.62824999999998,163.8 210.62824999999998,163.8 210.62824999999998,360.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="prompt" data-to="path" data-style="solid" data-arrow-start="true" data-arrow-end="true" data-label="补充与调整" points="143.08549999999997,224.70000000000002 143.08549999999997,348.5 173.7495833333333,348.5 173.7495833333333,360.5" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-start)" />
<g class="edge-label" data-from="prompt" data-to="path" data-label="补充与调整">
  <rect x="62.585499999999996" y="267.70000000000005" width="160.3" height="49.800000000000004" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="142.7355" y="292.6" text-anchor="middle" font-size="26" font-weight="400" fill="var(--_text-sec)" dy="9.1">补充与调整</text>
</g>
<g class="node" data-id="intent" data-label="任务线索 / 学习目标" data-shape="rectangle">
  <rect x="126.29774999999997" y="18" width="168.661" height="36.900000000000006" rx="0" ry="0" fill="#f1f5ff" stroke="#8da4de" stroke-width="1.5px" />
  <text x="210.62824999999998" y="36.45" text-anchor="middle" font-size="13" font-weight="500" fill="#293b5c" dy="4.55">任务线索 / 学习目标</text>
</g>
<g class="node" data-id="studio" data-label="Studio 与用户一起梳理" data-shape="rectangle">
  <rect x="118.14675" y="102.9" width="184.96299999999997" height="36.900000000000006" rx="0" ry="0" fill="#eeeefe" stroke="#7776c8" stroke-width="1.8px" />
  <text x="210.62824999999998" y="121.35000000000001" text-anchor="middle" font-size="13" font-weight="500" fill="#34345e" dy="4.55">Studio 与用户一起梳理</text>
</g>
<g class="node" data-id="prompt" data-label="可编辑 Prompt：范围 / 约束 / 步骤" data-shape="rectangle">
  <rect x="18" y="187.8" width="250.17099999999996" height="36.900000000000006" rx="0" ry="0" fill="#ffffff" stroke="#cdd7e5" stroke-width="1.5px" />
  <text x="143.08549999999997" y="206.25" text-anchor="middle" font-size="13" font-weight="500" fill="#344256" dy="4.55">可编辑 Prompt：范围 / 约束 / 步骤</text>
</g>
<g class="node" data-id="path" data-label="学习路径：节点 / 顺序 / 验证" data-shape="rectangle">
  <rect x="99.99224999999998" y="360.5" width="221.272" height="36.900000000000006" rx="0" ry="0" fill="#ffffff" stroke="#cdd7e5" stroke-width="1.5px" />
  <text x="210.62824999999998" y="378.95" text-anchor="middle" font-size="13" font-weight="500" fill="#344256" dy="4.55">学习路径：节点 / 顺序 / 验证</text>
</g>
</svg>