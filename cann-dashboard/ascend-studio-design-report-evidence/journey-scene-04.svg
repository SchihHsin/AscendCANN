  <text x="276.15825" y="206.25" text-anchor="middle" font-size="13" font-weight="500" fill="#28564f" dy="4.55">开发环境：运行 / 练习</text>
</g>
<g class="node" data-id="result" data-label="返回结果" data-shape="diamond">
  <polygon points="195.33291666666668,272.70000000000005 257.9479166666667,335.31500000000005 195.33291666666668,397.93000000000006 132.71791666666667,335.31500000000005" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="195.33291666666668" y="335.31500000000005" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">返回结果</text>
</g>
<g class="node" data-id="explain" data-label="日志 + 图解：解释原因" data-shape="rectangle">
