<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474.411 588.63" width="474.411" height="588.63" style="--bg:#ffffff;--fg:#354052;--line:#8794a8;--accent:#45958e;--muted:#657184;--surface:#f7f8fb;--border:#d9dee7">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="plan" data-to="env" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="183.5705,139.8 183.5705,163.8 276.15825,163.8 276.15825,187.8" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="env" data-to="result" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="276.15825,224.70000000000002 276.15825,260.70000000000005 216.20458333333335,260.70000000000005 216.20458333333335,293.5716666666667" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="result" data-to="explain" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="错误" points="174.46125,293.5716666666667 174.46125,260.70000000000005 52.5,260.70000000000005 52.5,90.9 179.42533333333336,90.9 179.42533333333336,54.900000000000006" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="result" data-to="mastery" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="通过" points="195.33291666666668,397.93000000000006 195.33291666666668,533.73" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="explain" data-to="retry" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="241.82066666666668,54.900000000000006 241.82066666666668,90.9 368.746,90.9 368.746,102.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
