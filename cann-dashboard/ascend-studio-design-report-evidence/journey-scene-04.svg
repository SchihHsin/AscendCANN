<g class="edge-label" data-from="result" data-to="explain" data-label="错误">
  <rect x="14" y="203.9" width="76.06" height="49.800000000000004" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="52.03" y="228.8" text-anchor="middle" font-size="26" font-weight="400" fill="var(--_text-sec)" dy="9.1">错误</text>
</g>
<g class="edge-label" data-from="result" data-to="mastery" data-label="通过">
  <rect x="156.83291666666668" y="440.93" width="76.06" height="49.800000000000004" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="194.86291666666668" y="465.83" text-anchor="middle" font-size="26" font-weight="400" fill="var(--_text-sec)" dy="9.1">通过</text>
</g>
