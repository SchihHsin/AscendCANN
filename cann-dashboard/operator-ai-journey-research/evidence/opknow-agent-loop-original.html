<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Opknow · Agent 循环架构原图</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f2f3f7}
    body{display:grid;place-items:center;padding:8px;font-family:"HarmonyOS Sans SC","Noto Sans SC",sans-serif}
    svg{display:block;width:100%;max-width:660px;height:auto;margin:auto}
    #source{position:fixed;inset:0;width:1px;height:1px;border:0;visibility:hidden;pointer-events:none}
    #loading{color:#6f7782;font-size:12px}
  </style>
</head>
<body>
  <span id="loading">加载 Opknow Agent 循环架构原图…</span>
  <iframe id="source" title="Opknow 原图源" src="../../../../opknow/20_human_ai_journey.html#archView"></iframe>
  <script>
    const source=document.getElementById('source');
    source.addEventListener('load',()=>{
      const original=source.contentDocument?.querySelector('#archView svg');
      if(!original)return;
      const svg=original.cloneNode(true);
      source.remove();
      document.body.replaceChildren(svg);
    });
  </script>
</body>
</html>
