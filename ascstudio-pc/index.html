<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="Ascend Studio 桌面端设计点演示：从表达目标到理解、实践与经验回流。">
  <title>Ascend Studio · 桌面端设计点</title>
  <link rel="icon" type="image/svg+xml" href="../ascstudio-mini/mark.svg">
  <link rel="stylesheet" href="./styles.css?rev=20261029-note-icons-vertical">
  <script type="module" src="./app.js?rev=20261029-note-icons-vertical"></script>
</head>
<body>
  <main class="showcase" id="showcase" data-view="cover">
    <iframe id="demo-frame" class="demo-frame" title="Ascend Studio 桌面端交互 Demo" allow="clipboard-read; clipboard-write"></iframe>

    <section class="chapter-cover" id="chapter-cover" aria-labelledby="cover-title">
      <header class="cover-brand"><span class="brand-mark" aria-hidden="true">A</span><span>ASCEND STUDIO</span><i></i><span>DESIGN JOURNEY</span></header>
      <div class="cover-main">
        <div class="cover-copy">
          <p class="cover-eyebrow" id="cover-kicker">用户旅程 · 章节 01 / 05</p>
          <p class="cover-number" id="cover-number">01</p>
          <h1 id="cover-title">先把目标说清</h1>
          <p class="cover-description" id="cover-description"></p>
          <div class="cover-actions">
            <button class="primary-button" id="cover-enter" type="button">进入本章 <span aria-hidden="true">→</span></button>
            <button class="text-button" id="cover-index" type="button">浏览全部章节</button>
          </div>
        </div>
        <aside class="cover-outline" aria-label="本章设计点">
          <div class="outline-heading"><span>本章设计点</span><span id="cover-point-count"></span></div>
          <ol id="cover-points"></ol>
          <div class="journey-rail" id="journey-rail" aria-label="五个旅程章节"></div>
        </aside>
      </div>
      <footer class="cover-footer"><span>从一次表达，到理解、实践与经验回流</span><span>可按章节自由体验 · 示例任务用于演示交互</span></footer>
    </section>

    <aside class="design-note" id="design-note" aria-live="polite" aria-label="当前设计点讲解">
      <div class="note-topline" title="拖动此处移动讲解卡">
        <span id="note-kicker"></span>
        <button class="icon-button" id="note-collapse" type="button" aria-label="收起设计点讲解" title="收起讲解">−</button>
      </div>
      <div class="note-content">
        <div class="note-body">
          <h2 id="note-title"></h2>
          <p id="note-description"></p>
        </div>
        <div class="note-controls" role="group" aria-label="设计点导航">
          <button class="icon-button" id="note-prev" type="button" aria-label="上一个设计点" title="上一个设计点"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
          <button class="icon-button" id="note-index" type="button" aria-label="打开章节与设计点目录" title="章节与设计点"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
          <button class="icon-button note-next" id="note-next" type="button" aria-label="下一个设计点" title="下一个设计点"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </div>
    </aside>
    <button class="note-dock" id="note-dock" type="button" hidden aria-label="展开设计点讲解">
      <span class="dock-dot"></span><span id="dock-label">01 · 先把目标说清</span><span aria-hidden="true">↑</span>
    </button>

    <nav class="chapter-menu" id="chapter-menu" aria-label="章节与设计点" hidden>
      <div class="menu-heading"><strong>选择章节与设计点</strong><button class="icon-button" id="menu-close" type="button" aria-label="关闭章节目录">×</button></div>
      <div id="menu-content"></div>
    </nav>
    <button class="mobile-return" id="mobile-return" type="button" hidden>返回桌面 <span aria-hidden="true">↗</span></button>
    <button class="fullscreen-button" id="fullscreen-button" type="button" aria-label="进入全屏" title="进入全屏">⛶</button>
    <div class="loading-state" id="loading-state" aria-live="polite" hidden><span></span>正在载入演示页面…</div>
  </main>
</body>
</html>
